    calcular:function(){
      var Q=num("acQ"),rhoT=num("acRho"),theta=num("acTheta"),fm=num("acFm"),fsm=num("acFsm");
      var Fmax=num("acFmax"),V=num("acV"),Din=num("acD")/1000,Bin=num("acB")/1000;
      var L2=num("acL2"),L1=num("acL1"),L3=num("acL3"),L=num("acL"),H=num("acH");
      var WbIn=num("acWb"),xrot=num("acXrot"),aesp=num("acAesp");
      var Dt=num("acDt"),eta=num("acEta");
      var abras=$("#acAbras").value, tipoC=$("#acTipo").value, Ky=parseFloat($("#acKy").value);
      var kxM=$("#acKxM").value, K=parseFloat($("#acK").value), FS=parseFloat($("#acFS").value);
      if([Q,rhoT,theta,fm,fsm,Fmax,V,L2,L1,L3,L,H,Dt,eta].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||rhoT<=0||V<=0||L<=0||L2<=0||Dt<=0||eta<=0||eta>1||theta<=0||theta>=90) return null;
      var gama=rhoT*1000;                                  // kgf/m³  (γ do manual)
      /* ---- Largura da correia e abertura das guias ---- */
      var LARG=[16,20,24,30,36,42,48,54,60,72,84];
      var WB={Plylon:[5.2,6.5,7.7,11.9,14.3,17.7,20.2,26.8,29.8,35.7,41.6],
              HDRN:[6.4,8.0,9.6,13.5,16.2,21.0,24.0,37.6,41.8,50.1,58.4]};
      var gamaP=rhoT*1000;
      // Critério de CAPACIDADE: de D = Q/(γ·V·B·3600) com o limite D ≤ B/2  →  B ≥ √(2Q/(3600·γ·V))
      var Bcap_m=Math.sqrt(2*(Q*1000)/(3600*gamaP*V));     // abertura de guia mínima (m)
      var Bpor_cap=Bcap_m/0.65*1000/25.4;                  // pol de correia correspondentes
      var Bpor_guia=(Bin>0)?(Bin/0.65*1000/25.4):0;        // pol necessárias p/ a guia informada
      var Bpor_gran=3*Fmax/25.4;                           // ≥ 3 × o maior bloco
      var Breq_pol=Math.max(Bpor_cap,Bpor_guia,Bpor_gran);
      var Bauto=LARG[LARG.length-1], granInsuf=true;
      for(var i=0;i<LARG.length;i++){
        if(LARG[i]>=Breq_pol){ Bauto=LARG[i]; granInsuf=false; break; } }
      var govLarg=(Bpor_guia>=Bpor_cap&&Bpor_guia>=Bpor_gran)?"abertura de guia informada":
                  (Bpor_cap>=Bpor_gran?"capacidade (limite D ≤ B/2)":"granulometria (3 × maior bloco)");
      var Bsel=$("#acBsel").value, manualB=(Bsel!=="auto");
      var Bpol=manualB?parseInt(Bsel,10):Bauto;
      var Bmm=Math.round(Bpol*25.4);
      var iW=LARG.indexOf(Bpol); if(iW<0)iW=LARG.length-1;
      var Wb=(WbIn>0)?WbIn:WB[tipoC][iW];
      var B=(Bin>0)?Bin:(0.65*Bmm/1000);                   // abertura da guia (m)
      var Bestreita=manualB&&(Bpol<Bauto);
      var lumpOK=(Bmm>=3*Fmax);
      /* ---- Altura da camada  D = Q / (γ · V · B · 3600) ---- */
      var Dcalc=(Q*1000)/(gama*V*B*3600);                  // m
      var D=(Din>0)?Din:Dcalc;
      var Dmax=B/2, Dok=(D<=Dmax+1e-9);
      var Qreal=3600*B*D*V*gama/1000;                      // t/h
      var Vmax=(abras==="abr")?0.3:0.5, Vok=(V<=Vmax+1e-9);
      /* ---- Coeficientes ---- */
      var Ka=(1-Math.sin(theta*Math.PI/180))/(1+Math.sin(theta*Math.PI/180));
      var tgTheta=Math.tan(theta*Math.PI/180);
      var Wm=Q*1000/(3.6*V*1000);                          // kgf/m de material sobre a correia
      var Kx=(kxM==="det")?(0.0068*(Wm+Wb)+((aesp>0)?xrot/aesp:0)):4.46;
      /* ---- TENSÃO EFETIVA  Te = Pe + P1 + Ps + Pfs + Ph  (pág. 1-21) ---- */
      var Pe=L*(Kx+Ky*Wb+0.02*Wb)+45.4;                                    // correia vazia
      var P1=Ky*(1.2*B*B*gama*L2 + B*D*L3*gama);                           // movimentar o material
      var Ps=Math.max(0,(1.2*B-D))*gama*L1*fm*B;                           // cisalhamento do material
      var Pfs=D*gama*Ka*fsm*((2.4*B-D)*L1 + D*L3) + 8.93*L;                // atrito nas guias laterais
      var Ph=B*D*gama*H;                                                   // elevação
      var Te=Pe+P1+Ps+Pfs+Ph;                                              // kgf
      if(!isFinite(Te)||Te<=0) return null;
      var pctPe=100*Pe/Te,pctP1=100*P1/Te,pctPs=100*Ps/Te,pctPfs=100*Pfs/Te,pctPh=100*Ph/Te;
      /* ---- Potência e acionamento ---- */
      var Pkw=Te*9.80665*V/1000;                          // kW no tambor
      var Peixo=Pkw/eta;
      var Pmaj=Peixo*1.15;                                // 15% de margem
      var npul=V*60000/(Math.PI*Dt);                      // rpm do tambor
      var Msaida=(npul>0)?(9550*Pmaj/npul):0;
      var sew=selSEW(Pmaj,npul);
      /* ---- Tensões de operação e correia ---- */
      var T1=(1+K)*Te, T2=K*Te;
      var trN=T1*9.80665/Bmm;                             // N/mm
      var carcReq=trN*FS;
      var EP=[200,250,315,400,500,630,800,1000,1250,1600,2000];
      var EPsel=EP.find(function(x){return x>=carcReq;})||EP[EP.length-1];
      /* ---- Tambores ---- */
      var Dmin_acion=Math.max(400,Math.ceil(EPsel*0.9/50)*50);
      var Dtok=(Dt>=Dmin_acion);
      var geomAviso=(L1>L2+1e-9)||(L2+L3>L+1e-9);
      var OUT=[
        {sec:"Aplicação"},
        {k:"Tipo de equipamento",v:"Alimentador de correia sob MOEGA DE ALIMENTAÇÃO — retomada de materiais finos e úmidos, onde o alimentador vibratório não é recomendado. Permite dosagem contínua e precisa com variador de velocidade.",hi:true},
        {k:"Método de cálculo",v:"Idêntico ao do transportador de correia, exceto na determinação da TENSÃO EFETIVA Te, que inclui as parcelas de cisalhamento do material (Ps) e de atrito nas guias laterais (Pfs) — Manual de Britagem, págs. 1-20 a 1-23."},
        {sec:"Etapa 1 — Capacidade, velocidade e camada"},
        {k:"Capacidade  Q",v:Q.toFixed(0)+" t/h"},
        {k:"Densidade aparente  γ",v:rhoT.toFixed(2).replace(".",",")+" t/m³  =  "+fmt(Math.round(gama))+" kgf/m³"},
        {k:"Velocidade da correia  V",v:V.toFixed(2).replace(".",",")+" m/s"+(Vok?"  (≤ V máx. "+Vmax.toFixed(1).replace(".",",")+" m/s — material "+(abras==="abr"?"abrasivo":"não abrasivo")+")":"  ⚠ acima da velocidade máxima recomendada ("+Vmax.toFixed(1).replace(".",",")+" m/s)"),hi:true},
        {k:"Abertura da guia de material  B",v:(B*1000).toFixed(0)+" mm"+(Bin>0?"  (informada)":"  (0,65 × largura da correia)"),hi:true},
        {k:"Altura da camada  D = Q / (γ·V·B·3600)",v:(D*1000).toFixed(0)+" mm"+(Din>0?"  (informada — calculada "+(Dcalc*1000).toFixed(0)+" mm)":"  (calculada)"),hi:true},
        {k:"Limite  D ≤ B/2",v:(Dmax*1000).toFixed(0)+" mm"+(Dok?"  ✓ atende":"  ⚠ CAMADA ACIMA DO LIMITE — o resultado sai da faixa de validade do método; aumentar a largura da correia, a abertura B ou a velocidade V"),hi:!Dok},
        {k:"Abertura de guia mínima pela capacidade  B ≥ √(2Q/(3600·γ·V))",v:(Bcap_m*1000).toFixed(0)+" mm  →  correia "+(Bpor_cap).toFixed(1).replace(".",",")+"\""},
        {k:"Capacidade resultante  Q = 3600·B·D·V·γ",v:Qreal.toFixed(0)+" t/h"+(Math.abs(Qreal-Q)/Q<0.02?"  ✓ confere":"  (recalculada com a camada informada)")},
        {k:"Carga de material sobre a correia  Wm",v:Wm.toFixed(1).replace(".",",")+" kgf/m"},
        {k:"Maior bloco do material",v:fmt(Math.round(Fmax))+" mm"},
        {sec:"Etapa 2 — Coeficientes do material"},
        {k:"Ângulo de repouso  θ",v:theta.toFixed(0)+"°   (tg θ = "+tgTheta.toFixed(3).replace(".",",")+")"},
        {k:"Relação pressões lateral/vertical  Ka = (1−sen θ)/(1+sen θ)",v:Ka.toFixed(3).replace(".",","),hi:true},
        {k:"Atrito interno do material  fm",v:fm.toFixed(2).replace(".",",")+(fm<tgTheta?"  ⚠ abaixo de tg θ — para material fino e seco fm = tg θ; para pedaços/úmido deve ser maior":"")},
        {k:"Atrito do material com o aço  fsm",v:fsm.toFixed(2).replace(".",",")},
        {k:"Origem dos coeficientes",v:(function(){var p=FEED_MAT[$("#acMat").value];return p?p.fonte:"informados pelo usuário";})()},
        {sec:"Etapa 3 — Geometria (figura da pág. 1-21)"},
        {k:"L2 — abertura da moega",v:L2.toFixed(2).replace(".",",")+" m",hi:true},
        {k:"L1 — comprimento de atrito",v:L1.toFixed(2).replace(".",",")+" m"},
        {k:"L3 — guias laterais além da moega",v:L3.toFixed(2).replace(".",",")+" m"},
        {k:"L — distância entre centros dos tambores",v:L.toFixed(2).replace(".",",")+" m",hi:true},
        {k:"H — altura de elevação do material",v:H.toFixed(2).replace(".",",")+" m"+(H===0?"  (alimentador horizontal)":"")},
        {k:"Consistência da geometria",v:geomAviso?"⚠ verificar: L1 deve estar contido em L2, e L2 + L3 devem caber em L (com folga para os tambores)":"OK — L1 ≤ L2 e L2 + L3 ≤ L"},
        {sec:"Etapa 4 — Tensão efetiva  Te = Pe + P1 + Ps + Pfs + Ph  (pág. 1-21)"},
        {k:"Peso da correia  Wb  ("+tipoC+", "+Bpol+"\")",v:Wb.toFixed(1).replace(".",",")+" kgf/m"+(WbIn>0?"  (informado)":"  (tabela pág. 1-23)")},
        {k:"Kx — resistência dos roletes",v:Kx.toFixed(2).replace(".",",")+" kgf/m"+(kxM==="det"?"   = 0,0068·("+Wm.toFixed(1).replace(".",",")+" + "+Wb.toFixed(1).replace(".",",")+") + "+xrot.toFixed(1).replace(".",",")+"/"+aesp.toFixed(2).replace(".",","):"   (caso geral)")},
        {k:"Ky — resistência à flexão",v:Ky.toFixed(2).replace(".",",")+"   ("+(Ky===0.05?"roletes inclinados":"roletes planos")+")"},
        {k:"Pe = L·(Kx + Ky·Wb + 0,02·Wb) + 45,4   — correia vazia",v:fmt(Math.round(Pe))+" kgf   ("+pctPe.toFixed(0)+"%)"},
        {k:"P1 = Ky·(1,2·B²·γ·L2 + B·D·L3·γ)   — movimentar o material",v:fmt(Math.round(P1))+" kgf   ("+pctP1.toFixed(0)+"%)"},
        {k:"Ps = (1,2·B − D)·γ·L1·fm·B   — cisalhamento do material",v:fmt(Math.round(Ps))+" kgf   ("+pctPs.toFixed(0)+"%)",hi:true},
        {k:"Pfs = D·γ·Ka·fsm·[(2,4·B − D)·L1 + D·L3] + 8,93·L   — guias laterais",v:fmt(Math.round(Pfs))+" kgf   ("+pctPfs.toFixed(0)+"%)",hi:true},
        {k:"Ph = B·D·γ·H   — elevação do material",v:fmt(Math.round(Ph))+" kgf   ("+pctPh.toFixed(0)+"%)"},
        {k:"TENSÃO EFETIVA  Te",v:fmt(Math.round(Te))+" kgf",hi:true},
        {k:"Parcela dominante",v:(function(){var a=[[Pe,"Pe (correia vazia)"],[P1,"P1 (movimentar o material)"],[Ps,"Ps (cisalhamento do material)"],[Pfs,"Pfs (atrito nas guias)"],[Ph,"Ph (elevação)"]].sort(function(x,y){return y[0]-x[0];});return a[0][1]+" — "+(100*a[0][0]/Te).toFixed(0)+"% da tensão efetiva";})()},
        {sec:"Etapa 5 — Potência e acionamento"},
        {k:"Potência no tambor  P = Te · V",v:Pkw.toFixed(2).replace(".",",")+" kW  (~"+(Pkw/0.7457).toFixed(1).replace(".",",")+" HP)"},
        {k:"Potência no eixo do redutor  P / η",v:Peixo.toFixed(2).replace(".",",")+" kW   (η = "+eta.toFixed(2).replace(".",",")+")",hi:true},
        {k:"Potência de seleção  (+15%)",v:Pmaj.toFixed(2).replace(".",",")+" kW  (~"+(Pmaj/0.7457).toFixed(1).replace(".",",")+" HP)",hi:true},
        {k:"Rotação do tambor  n = V·60000/(π·D)",v:npul.toFixed(2).replace(".",",")+" rpm   (D = "+Dt.toFixed(0)+" mm)"},
        {k:"Torque no eixo de saída  M = 9550·P/n",v:fmt(Math.round(Msaida))+" N·m",hi:true},
        {k:"Motoredutor SEW recomendado",v:sewDrive(sew,Pmaj),hi:true},
        {k:"Controle da vazão",v:"Alimentador de correia aceita variador contínuo de velocidade (inversor), permitindo dosagem contínua e precisa e ampla variação da taxa de alimentação — a vazão é praticamente linear com V."},
        {sec:"Etapa 6 — Tensões de operação e seleção da correia"},
        {k:"LARGURA DA CORREIA",v:Bpol+"\" ("+Bmm+" mm)"+(manualB?"  (escolha do usuário)":"  (automático)")+(Bestreita?"  ⚠ menor que a calculada ("+Bauto+"\")":"")+(granInsuf?"  ⚠ acima do maior catálogo":""),hi:true},
        {k:"Critérios de largura  (governa: "+govLarg+")",v:"capacidade → "+Bpor_cap.toFixed(1).replace(".",",")+"\"   ·   granulometria (3 × bloco) → "+Bpor_gran.toFixed(1).replace(".",",")+"\""+(Bpor_guia>0?("   ·   guia informada → "+Bpor_guia.toFixed(1).replace(".",",")+"\""):"")},
        {k:"Verificação de bloco  (largura ≥ 3 × maior bloco)",v:lumpOK?"OK — "+Bmm+" mm ≥ "+(3*Fmax).toFixed(0)+" mm":"⚠ insuficiente — usar correia mais larga ou reduzir o bloco"},
        {k:"Tensão máxima  T1 = (1 + K)·Te",v:fmt(Math.round(T1))+" kgf   (K = "+K.toFixed(2).replace(".",",")+")",hi:true},
        {k:"Tensão no lado frouxo  T2 = K·Te",v:fmt(Math.round(T2))+" kgf"},

/* ---------- Menu ---------- */
function buildMenu(){
  const menu=DB.meta.menu||[];
  $("#menu").innerHTML=menu.map(g=>{
    const subs=(g.subgrupos||[]).map(s=>`<button class="navitem" data-grupo="${g.grupo}" data-sub="${s}">${s}</button>`).join("");
    return `<div class="grp open" data-grp="${g.grupo}"><button class="grphead" data-grupo="${g.grupo}"><span>${g.grupo}</span><span class="arrow">›</span></button><div class="subs">${subs}</div></div>`;
  }).join("");
  document.querySelectorAll(".grphead").forEach(b=>b.addEventListener("click",()=>{b.closest(".grp").classList.toggle("open");selectFilter(b.dataset.grupo,"");}));
  document.querySelectorAll(".subs .navitem").forEach(b=>b.addEventListener("click",()=>{selectFilter(b.dataset.grupo,b.dataset.sub);closeDrawer();}));
  $(".navitem.all").addEventListener("click",()=>{selectFilter("","");closeDrawer();});
}
function selectFilter(g,s){
  curGrupo=g;curSub=s;
  document.querySelectorAll(".navitem,.grp").forEach(n=>n.classList.remove("active"));
  if(!g){$(".navitem.all").classList.add("active");}
  else{const grp=document.querySelector(`.grp[data-grp="${CSS.escape(g)}"]`);if(grp)grp.classList.add("active","open");
    if(s){const el=document.querySelector(`.subs .navitem[data-grupo="${CSS.escape(g)}"][data-sub="${CSS.escape(s)}"]`);if(el)el.classList.add("active");}}
  render();
}
function openDrawer(){$("#drawer").classList.add("open");$("#overlay").classList.add("open");}
function closeDrawer(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("open");}

function render(){
  const list=DB.equipamentos.filter(e=>(!curGrupo||e.grupo===curGrupo)&&(!curSub||e.subgrupo===curSub));
  $("#count").textContent=list.length+" equipamento"+(list.length!==1?"s":"");
  $("#title").textContent=curSub||curGrupo||"Dimensionamento de Equipamentos";
  $("#grid").innerHTML=list.map(e=>{
    const idx=DB.equipamentos.indexOf(e);
    return `<div class="card" onclick="openItem(${idx})">
      <div class="icon">${icon(e)}</div>
      <div><div class="cat">${e.grupo} · ${e.subgrupo}</div>
      <h3>${e.modelo}</h3><div class="desc">${e.descricao||e.subtipo}</div>
      ${e.calculadora?'<span class="calcflag">▸ Abrir cálculo de pré-dimensionamento</span>':'<span class="calcflag soon">⋯ Calculadora em desenvolvimento</span>'}</div>
    </div>`;
  }).join("")||'<p style="color:var(--muted)">Nenhum equipamento neste grupo ainda.</p>';
}

function openItem(i){
  const e=DB.equipamentos[i];

  if(!calc){
    $("#sheet").innerHTML=`
      <div class="head"><div class="ic">${icon(e)}</div>

        <div class="note">Referência prevista: ${e.referencia||"—"}</div>
      </div></div>`;
    $("#modal").classList.add("open");
    return;
  }
  if(!calc.campos[0]||calc.campos[0].id!=="eqTag"){ calc.campos.unshift({id:"eqTag",label:"TAG (identificação do equipamento)",tipo:"text",valor:"",placeholder:"ex.: PN-101 / TC-201"}); }
  const campos=calc.campos.map(f=>{
    if(f.tipo==="head"){return `<div class="fhead">${f.label}</div>`;}
    if(f.tipo==="text"){
      return `<div class="field"><label>${f.label}</label><input id="${f.id}" type="text" value="${f.valor||""}" placeholder="${f.placeholder||""}"/></div>`;
    }
    const auto=`runCalc('${e.calculadora}')`, autoSoft=`runCalc('${e.calculadora}',1)`;
    if(f.tipo==="select"){
      const eatt=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const ops=f.opcoes.map(o=>`<option value="${eatt(o.v)}"${o.v===f.valor?" selected":""}>${o.t}</option>`).join("");
      return `<div class="field"><label>${f.label}</label><select id="${f.id}" onchange="${f.onchange||auto}">${ops}</select></div>`;
    }
    return `<div class="field"><label>${f.label} ${f.unidade?`<span class="u">(${f.unidade})</span>`:""}</label>
      <input id="${f.id}" type="number" value="${f.valor}" step="${f.step||"any"}" oninput="${autoSoft}" onchange="${auto}"/></div>`;
  }).join("");
  $("#sheet").innerHTML=`
    <div class="head"><div class="ic">${icon(e)}</div>
      <div><h2>${e.modelo}</h2><div class="sub">${e.subtipo} · pré-dimensionamento</div></div>
      <button class="close" onclick="closeModal()">×</button></div>
    <div class="calcbody">
      <div class="inputs"><div class="sec-t">Dados de entrada</div>${campos}
        <button class="btn" onclick="runCalc('${e.calculadora}')">Calcular</button>

        <div class="placeholder">Preencha os dados e clique em <b>Calcular</b>.</div>
        <div class="note">Referência: ${calc.referencia}</div></div>
    </div>`;
  $("#modal").classList.add("open");
  runCalc(e.calculadora);
}
function runCalc(id,soft){
  const calc=CALCS[id];const r=calc.calcular();
  const box=$("#results");
  if(!r){if(soft&&box.querySelector("table.res"))return;box.innerHTML=`<div class="sec-t">Resultados</div><div class="placeholder">Verifique os dados de entrada (valores positivos).</div><div class="note">Referência: ${calc.referencia}</div>`;return;}
  const rows=r.map(x=> x.sec
    ? `<tr><td colspan="2" style="padding:16px 6px 6px;color:var(--teal-d);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--teal)">${x.sec}</td></tr>`
    : `<tr class="${x.hi?"highlight":""}"><td class="k">${x.k}</td><td class="v">${x.v}</td></tr>`).join("");
  box.innerHTML=`<div class="sec-t">Resultados</div><table class="res">${rows}</table>
    <div class="note">Estimativa de <b>pré-dimensionamento</b>. A seleção SEW usa torques nominais aproximados de catálogo — confirmar a escolha final no <a href="https://www.sew-eurodrive.com" target="_blank" rel="noopener">configurador oficial SEW</a>.<br><b>Resultado final majorado em 20%</b> (margem de projeto) — a seleção do motor/redutor SEW considera a potência majorada.<br>Referência: ${calc.referencia} · SEW-EURODRIVE (série R / motores DRN).</div>`;
}
function san(s){return String(s==null?"":s).replace(/³/g,"3").replace(/²/g,"2").replace(/⁴/g,"4").replace(/·/g,"-").replace(/≥/g,">=").replace(/≤/g,"<=").replace(/≈/g,"~").replace(/→/g,"->").replace(/⚠/g,"(!)").replace(/×/g,"x").replace(/√/g,"raiz").replace(/[−–—]/g,"-").replace(/φi/g,"fi").replace(/σc/g,"sc").replace(/σ1/g,"s1").replace(/σadm/g,"sadm").replace(/ρ/g,"ro").replace(/φ/g,"phi").replace(/δ/g,"delta").replace(/η/g,"eta").replace(/σ/g,"sigma").replace(/θ/g,"teta").replace(/α/g,"alfa").replace(/λ/g,"lambda").replace(/γ/g,"gama").replace(/β/g,"beta").replace(/π/g,"pi").replace(/τ/g,"tau").replace(/ε/g,"eps").replace(/[μµ]/g,"u").replace(/[ΔΘ]/g,"D").replace(/[Øø]/g,"O").replace(/[^\x00-\xFF]/g,"");}
function inputVal(f){var el=document.getElementById(f.id);if(!el)return "";if(f.tipo==="select")return el.options[el.selectedIndex].text;return el.value+(f.unidade?" "+f.unidade:"");}

        [san("Compressão vertical de atrito  nz"),san(G.nzS.toFixed(1))+" kN/m"],
        [san("σz / σ admissível de flambagem local"),san(G.sigZ.toFixed(1))+" / "+san(G.sigCrAdm.toFixed(0))+" MPa"+(G.flambOK?san("  OK"):san("  NAO ATENDE"))],
        [san("Tremonha — Ff (enchimento) / Fe (descarga)"),san(G.Ff.toFixed(3))+" / "+san(G.Fe.toFixed(3))],
        [san("Tremonha — pn enchimento / descarga"),san(G.pnF.toFixed(1))+" / "+san(G.pnE.toFixed(1))+" kPa"],
        [san("PRESSÃO DE SWITCH na transição"),san(G.pSwitch.toFixed(1))+" kPa em "+san(String(Math.round(G.hSwitch*1000)))+" mm"],
        [san("Tração meridional na transição"),san(G.nMer.toFixed(1))+" kN/m"],
        [san("Anel — carga horizontal qh"),san(G.qhAnel.toFixed(1))+" kN/m"],
        [san("Anel — momento / tração"),san(G.Manel.toFixed(1))+" kN·m / "+san(G.Nanel.toFixed(0))+" kN"],
        [san("Anel — W / A requeridos"),san(String(Math.round(G.WanelReq)))+" cm³ / "+san(G.AanelReq.toFixed(0))+" cm²"]
      ],36);
      var y4=tab("4 — PERFIS E MONTANTES",[
        [san("PERFIL DA CINTA"),san(G.perfilCinta)],
        [san("Cinta — alternativas"),san(G.altCinta||"-")],
        [san("PERFIL DO ENRIJECEDOR VERTICAL"),san(G.perfilEnr)],
        [san("Enrijecedor — alternativas"),san(G.altEnr||"-")],
        [san("PERFIL DO ANEL DE TRANSIÇÃO"),san(G.perfilAnel)],
        [san("Anel — alternativas"),san(G.altAnel||"-")],
        [san("PERFIL DO MONTANTE"),san(G.perfilCol)],
        [san("Montante — alternativas"),san(G.altMont||"-")],
        [san("Quantidade de cintas / enrijecedores"),san(String(G.nCintas))+" / "+san(String(G.nEnrV))],
        [san("Vão da cinta entre montantes"),san(G.vaoCinta.toFixed(2))+" m"],
        [san("Nº de montantes / vinculação K"),san(String(G.Ncol))+" / K = "+san(G.Kbuc.toFixed(1))],
        [san("Montante — esbeltez λ / χ"),san(G.lam.toFixed(0))+" / "+san(G.chi.toFixed(2))],
        [san("Montante — A requerida / i mínimo"),san(G.Areq.toFixed(0))+" cm² / "+san(G.imin.toFixed(1))+" cm"]
      ],y3+5);
      var y5=tab("5 — BASE, CHUMBADORES E REAÇÕES PARA A FUNDAÇÃO",[
        [san("Placa de base (por montante)"),san(G.ladoBP.toFixed(0))+" × "+san(G.ladoBP.toFixed(0))+" × "+san(String(G.tBP))+" mm"],
        [san("Chumbadores por montante"),san(String(G.nCh))+" × Ø"+san(String(G.diaCh))+" mm"],
        [san("Comprimento de ancoragem mínimo"),san(String(G.Lanc))+" mm"],
        [san("Reação vertical — permanente (serviço)"),san(G.Rv_perm.toFixed(0))+" kN"],
        [san("Reação vertical — total (serviço)"),san(G.Rv_tot.toFixed(0))+" kN"],
        [san("Reação vertical — ELU"),san(G.Rv_ELU.toFixed(0))+" kN"],
        [san("Reação horizontal por montante"),san(G.Rh_col.toFixed(0))+" kN"],
        [san("TRAÇÃO DE ARRANCAMENTO (ELU)"),san(G.Ntrac.toFixed(0))+" kN"],
        [san("Contraventamento"),(G.Kbuc<2)?san("pórtico contraventado (K 1,0)"):san("sem contraventamento (K 2,0)")]
      ],y4+5);
      var y6=tab("6 — PESOS, FADIGA E DINÂMICA",[
        [san("PESO SECO DO SILO (estrutura)"),san((G.pesoSeco/1000).toFixed(1))+" t"],
        [san("Revestimento interno"),san((G.pLiner/1000).toFixed(2))+" t"],
        [san("Material armazenado (cheio)"),san((G.pesoMat/1000).toFixed(1))+" t"],
        [san("PESO TOTAL COM SILO CHEIO"),san((G.pesoCheio/1000).toFixed(1))+" t"],
        [san("Área de parede / de tremonha"),san(G.Aparede.toFixed(0))+" / "+san(G.Atrem.toFixed(0))+" m²"],
        [san("Fadiga — ciclos de projeto"),san(String(G.Ntot))],
        [san("Fadiga — Δσ / Δσ admissível"),san(G.dSig.toFixed(0))+" / "+san(G.dSigAdm.toFixed(0))+" MPa"+(G.fadOK?san("  OK"):san("  NAO ATENDE"))],
        [san("Frequência natural da estrutura"),san(G.fn.toFixed(2))+" Hz"],
        [san("Força de impacto no enchimento"),san(G.Fimp.toFixed(1))+" kN"],
        [san("Dispositivos anti-arco"),G.coeso?(san(String(G.nCanhoes))+" canhões de "+san(String(G.volCanhao))+" L"):san("não requeridos")],
        [san("INTERFACE COM O ALIMENTADOR — σv / Fv na boca"),san(G.interfSv.toFixed(1))+" kPa / "+san(G.Fv.toFixed(0))+" kN"]
      ],y5+5);
      doc.setFontSize(7); doc.setTextColor(110);
      doc.text(san("Croqui e tabelas de pré-dimensionamento executivo — Jenike (fluxo), EN 1991-4/NBR 11700 (ações), NBR 6123 (vento), NBR 15421 (sismo) e NBR 8800 (estrutura)."),14,y6+6);
      doc.text(san("Não substitui ensaio Jenike Shear do material real, projeto de fundação (NBR 6122/6118), detalhamento de ligações e ART do responsável técnico."),14,y6+10);
    } else {
    var cx=80, wH=26, oH=8, topY=50, transY=112, botY=142, G_LEG=14;
    // preenchimento do material (corpo + moega)
    doc.setFillColor(245,228,190);
    doc.rect(cx-wH,topY,2*wH,transY-topY,"F");
    doc.lines([[2*wH,0],[-(wH-oH),botY-transY],[-2*oH,0],[-(wH-oH),-(botY-transY)]],cx-wH,transY,[1,1],"F",true);
    // contornos do silo
    doc.setDrawColor(20,40,60); doc.setLineWidth(0.7);
    doc.line(cx-wH,topY,cx,topY-11); doc.line(cx,topY-11,cx+wH,topY);
    doc.line(cx-wH,topY,cx-wH,transY); doc.line(cx+wH,topY,cx+wH,transY); doc.line(cx-wH,topY,cx+wH,topY);
    doc.line(cx-wH,transY,cx-oH,botY); doc.line(cx+wH,transY,cx+oH,botY);
    doc.line(cx-wH,transY,cx+wH,transY); doc.line(cx-oH,botY,cx+oH,botY);
    // linhas de cota
    doc.setDrawColor(30,155,196); doc.setLineWidth(0.3); doc.setTextColor(30,120,150); doc.setFontSize(8);
    var dy=topY-7; doc.line(cx-wH,dy,cx+wH,dy); doc.line(cx-wH,dy-1.6,cx-wH,dy+1.6); doc.line(cx+wH,dy-1.6,cx+wH,dy+1.6);
    doc.text((G.tipo==="ret"?"a = ":"D = ")+san(G.D.toFixed(2))+" m",cx,dy-1.2,{align:"center"});
    var rx=cx+wH+9; doc.line(rx,topY,rx,transY); doc.line(rx-1.6,topY,rx+1.6,topY); doc.line(rx-1.6,transY,rx+1.6,transY);
    doc.text("H = "+san(G.Hcil.toFixed(2))+" m",rx+2,(topY+transY)/2+1);
    doc.line(rx,transY,rx,botY); doc.line(rx-1.6,transY,rx+1.6,transY); doc.line(rx-1.6,botY,rx+1.6,botY);
    doc.text("hc = "+san(G.hc.toFixed(2))+" m",rx+2,(transY+botY)/2+1);
    var lx=cx-wH-9; doc.line(lx,topY,lx,botY); doc.line(lx-1.6,topY,lx+1.6,topY); doc.line(lx-1.6,botY,lx+1.6,botY);
    doc.text("Htot = "+san(G.Htot.toFixed(2))+" m",lx-2,(topY+botY)/2+1,{align:"right"});
    var by=botY+7; doc.line(cx-oH,by,cx+oH,by); doc.line(cx-oH,by-1.6,cx-oH,by+1.6); doc.line(cx+oH,by-1.6,cx+oH,by+1.6);
    doc.text("B = "+san(String(Math.round(G.Brec*1000)))+(G.tipo==="ret"&&G.cunha?(" x "+String(Math.round(G.Bl*1000))):"")+" mm",cx,by+4,{align:"center"});
    if(G.tipo==="ret"){
      // cotas extras do retangular: angulos de face, vale, chapas, cintas e montantes
      doc.text("face "+san(G.alfaB.toFixed(0))+"°",cx+oH+4,botY-3);
      doc.setTextColor(G.flowShallow?200:30,G.flowShallow?60:120,G.flowShallow?60:150);
      doc.text((G.cunha?"aresta ":"VALE ")+san(G.alfaVale.toFixed(0))+"° (exig. "+san(G.alfaFlow.toFixed(0))+"°)",cx-oH-4,botY-3,{align:"right"});
      doc.setTextColor(30,120,150);
      // CINTAS horizontais (traço cheio, ultrapassando a parede) — a cada s
      doc.setDrawColor(200,120,40); doc.setLineWidth(0.7);
      var nc=Math.max(1,Math.min(G.nCintas,12)), passo=(transY-topY)/(nc+1);
      for(var ic=1;ic<=nc;ic++){ var yc=topY+passo*ic; doc.line(cx-wH-2.5,yc,cx+wH+2.5,yc); }
      doc.setFontSize(6.5); doc.setTextColor(190,110,30);
      doc.text(san(String(G.nCintas))+" cintas @ "+san(G.sst.toFixed(2))+" m",cx+wH+4,topY+passo+2);
      doc.text(san(G.perfilCinta),cx+wH+4,topY+passo+6);
      // ENRIJECEDORES verticais (tracejado fino entre as cintas)
      doc.setDrawColor(90,120,150); doc.setLineWidth(0.35);
      var nv=5;
      for(var iv=1;iv<=nv;iv++){ var xv=cx-wH+(2*wH)*iv/(nv+1); for(var yy=topY+1;yy<transY-1;yy+=3){ doc.line(xv,yy,xv,Math.min(yy+1.6,transY-1)); } }
      doc.setFontSize(6.5); doc.setTextColor(80,110,140);
      doc.text("enrijecedores verticais: "+san(G.perfilEnr),cx-wH-3,transY+4,{align:"right"});
      // montantes
      doc.setDrawColor(20,40,60); doc.setLineWidth(0.9);
      doc.line(cx-wH+3,botY,cx-wH+3,botY+G_LEG); doc.line(cx+wH-3,botY,cx+wH-3,botY+G_LEG);
      doc.setFontSize(6.5); doc.setTextColor(110,140,165);
      doc.text(san(String(G.Ncol))+" montantes · L = "+san(G.Hleg.toFixed(1))+" m",cx,botY+G_LEG+4,{align:"center"});
      doc.text(san(G.perfilCol),cx,botY+G_LEG+8,{align:"center"});
      // espessuras indicadas na parede e na tremonha
      doc.setFontSize(6.5); doc.setTextColor(60,90,120);
      doc.text("chapa "+san(G.tcom.toFixed(1))+" mm",cx-wH-3,(topY+transY)/2,{align:"right",angle:90});
      doc.text("chapa "+san(G.thopcom.toFixed(1))+" mm",cx+oH+6,(transY+botY)/2+4);
      doc.setFontSize(8); doc.setTextColor(30,120,150);
    } else {
      doc.text("ang. moega "+san(G.alfa.toFixed(0))+"°",cx+oH+4,botY-3);
    }
    // legenda com as medidas resultantes
    var legBody=[];
    if(G.tipo==="ret"){
      legBody.push([san("Seção interna  a × b"),san(G.D.toFixed(2))+" × "+san(G.b.toFixed(2))+" m"]);
      legBody.push([san("Altura 1 — parte reta  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura 2 — tremonha  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Tipo de tremonha"),G.cunha?"Cunha (fenda) — fluxo plano":"Piramidal — fluxo cônico"]);
      legBody.push([san("Boca de descarga"),G.cunha?(san(String(Math.round(G.Brec*1000)))+" × "+san(String(Math.round(G.Bl*1000)))+" mm"):(san(String(Math.round(G.Brec*1000)))+" mm")]);
      legBody.push([san("Ângulo de face (a / b)"),san(G.alfaA.toFixed(0))+"° / "+san(G.alfaB.toFixed(0))+"°"]);
      legBody.push([san(G.cunha?"Ângulo da aresta":"ÂNGULO DE VALE (governa o fluxo)"),san(G.alfaVale.toFixed(0))+"°  (exigido "+san(G.alfaFlow.toFixed(0))+"°)"+(G.flowShallow?"  (!) RASO":"  OK")]);
      legBody.push([san("Volume útil requerido / da geometria"),san(G.Vutil.toFixed(1))+" / "+san(G.Vgeo.toFixed(1))+" m³"]);
      legBody.push([san("Pressão horizontal de projeto  ph,d"),san(G.phD.toFixed(1))+" kPa"]);
      legBody.push([san("Chapa da parede (lado a / lado b)"),san(G.tA.toFixed(1))+" / "+san(G.tB.toFixed(1))+" mm"]);
      legBody.push([san("Chapa da tremonha"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Enrijecedores — espaçamento  s"),san(G.sst.toFixed(2))+" m"+(G.otimS?"  (otimizado)":"")]);
      legBody.push([san("Cintas — quantidade / W requerido"),san(String(G.nCintas))+" un / "+san(String(Math.round(G.Wreq)))+" cm³"]);
      legBody.push([san("PERFIL DA CINTA"),san(G.perfilCinta)]);
      legBody.push([san("Cinta — alternativas"),san(G.altCinta||"-")]);
      legBody.push([san("PERFIL DO ENRIJECEDOR VERTICAL"),san(G.perfilEnr)]);
      legBody.push([san("Enrijecedor — alternativas"),san(G.altEnr||"-")]);
      legBody.push([san("Cinta — inércia p/ pressão externa  I"),san(G.Ireq.toFixed(0))+" cm⁴"]);
      legBody.push([san("Vento (Vk) · sucção · vácuo"),san(G.Vk.toFixed(1))+" m/s · "+san(G.pvento.toFixed(2))+" · "+san(G.pvac.toFixed(1))+" kPa"]);
      legBody.push([san("Pressão externa de projeto  q_ext"),san(G.qext.toFixed(2))+" kPa"]);
      legBody.push([san("Montantes — quantidade"),san(String(G.Ncol))+(G.otimN?"  (otimizado)":"")]);
      legBody.push([san("Montante — carga / área / raio de giração"),san(String(Math.round(G.Pcol)))+" kN / "+san(G.Areq.toFixed(0))+" cm² / "+san(G.imin.toFixed(1))+" cm"]);
      legBody.push([san("PERFIL DO MONTANTE"),san(G.perfilCol)]);
      legBody.push([san("Montante — alternativas"),san(G.altMont||"-")]);
      legBody.push([san("PESO SECO DO SILO (estrutura)"),san((G.pesoSeco/1000).toFixed(1))+" t"]);
      legBody.push([san("Material armazenado (cheio)"),san((G.pesoMat/1000).toFixed(1))+" t"]);
      legBody.push([san("PESO TOTAL COM SILO CHEIO"),san((G.pesoCheio/1000).toFixed(1))+" t"]);
      legBody.push([san("Altura livre dos montantes  L"),san(G.Hleg.toFixed(1))+" m"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }else{
      legBody.push([san("Diâmetro interno  D"),san(G.D.toFixed(2))+" m"]);
      legBody.push([san("Altura cilíndrica  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura da moega (tremonha)  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Lado da boca de descarga  B"),san(String(Math.round(G.Brec*1000)))+" mm"]);
      legBody.push([san("Ângulo da moega (com a horizontal)"),san(G.alfa.toFixed(0))+"°"]);
      legBody.push([san("Volume útil de armazenagem"),san(G.Vutil.toFixed(1))+" m³"]);
      legBody.push([san("Espessura da chapa do corpo"),san(G.tcom.toFixed(1))+" mm"]);
      legBody.push([san("Espessura da chapa da moega"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }
    doc.autoTable({startY:botY+(G.tipo==="ret"?26:16),theme:"grid",margin:{left:14,right:14},
      head:[["Medida resultante do cálculo","Valor"]],
      body:legBody,
      headStyles:{fillColor:[22,38,60],textColor:255,fontSize:9},bodyStyles:{fontSize:8.5},
      alternateRowStyles:{fillColor:[244,247,250]},
      columnStyles:{0:{cellWidth:120},1:{cellWidth:62,halign:"right",fontStyle:"bold"}}});
    doc.setFontSize(7); doc.setTextColor(110);
    doc.text(san("Croqui esquemático (fora de escala) — medidas resultantes do pré-dimensionamento."),14,doc.lastAutoTable.finalY+6);
    }
    doc.setFontSize(7); doc.setTextColor(150);
    doc.text("ProjectARK Engenharia · Dimensionamento de Equipamentos",14,290);
  }
  doc.save("ProjectARK-"+CUR_EQ.calculadora+".pdf");
}
function closeModal(){$("#modal").classList.remove("open");}
$("#burger").addEventListener("click",openDrawer);
$("#overlay").addEventListener("click",closeDrawer);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();}});

fetch("equipamentos.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  DB=d;
  $("#htag").innerHTML="Versão "+d.meta.versao+"<br>"+d.equipamentos.length+" equipamento(s)";
  $("#foot").textContent="ProjectARK · Pré-dimensionamento de Equipamentos · v"+d.meta.versao;
  buildMenu();render();
}).catch(()=>{$("#grid").innerHTML='<p style="color:#b33">Erro ao carregar equipamentos.json — abra via servidor (GitHub Pages).</p>';});
</script>
