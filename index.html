  screw_conveyor:{
    titulo:"Transportador Helicoidal — pré-dimensionamento",
    referencia:"CEMA / KWS Screw Conveyor Engineering Guide · DIN 15262 / ISO 7119",
    campos:[
      {id:"Qm",label:"Vazão de projeto",unidade:"t/h",tipo:"number",valor:30},
      {id:"rho",label:"Densidade aparente",unidade:"t/m³",tipo:"number",valor:1.3,step:"0.01"},
      {id:"L",label:"Comprimento",unidade:"m",tipo:"number",valor:12},
      {id:"H",label:"Elevação (0 = horizontal)",unidade:"m",tipo:"number",valor:0},
      {id:"carga",label:"Grau de enchimento da calha",tipo:"select",valor:"0.30",opcoes:[
        {v:"0.45",t:"Leve / fluido (45%)"},{v:"0.30",t:"Médio (30%)"},{v:"0.15",t:"Pesado / abrasivo (15%)"}]},
      {id:"n",label:"Rotação do eixo",unidade:"rpm",tipo:"number",valor:60},
      {id:"lambda",label:"Resistência do material",tipo:"select",valor:"2.5",opcoes:[
        {v:"1.2",t:"Leve, fluido (λ ≈ 1,2)"},{v:"2.5",t:"Médio (λ ≈ 2,5)"},{v:"4.0",t:"Pesado / abrasivo (λ ≈ 4,0)"}]}
    ],
    calcular:function(){
      const Qm=num("Qm"),rho=num("rho"),L=num("L"),H=num("H"),carga=num("carga"),n=num("n"),lam=num("lambda");
      if([Qm,rho,L,H,carga,n,lam].some(x=>isNaN(x))||rho<=0||n<=0) return null;
      const Cv=Qm/rho;                                  // m³/h volumétrico requerido
      const Dcalc=Math.cbrt(Cv/(47.12*carga*n));        // m (passo = D)
      const Dstd=nextStd(Dcalc*1000);                   // mm padrão
      const Qrv=47.12*Math.pow(Dstd/1000,3)*carga*n;    // capacidade real m³/h
      const Qrm=Qrv*rho;                                // capacidade real t/h
      const Ph=Qm*L*lam/367;                            // potência no material
      const Pst=Qm*H/367;                               // potência de elevação
      const Pn=(Dstd/1000)*L/20;                        // potência em vazio
      const Ptot=Ph+Pst+Pn;
      const Pdrive=Ptot*1.2/0.9;                        // fator de serviço 1,2 / rend. 0,9
      const Pmaj=Pdrive*1.20;                           // majoração de 20% (margem de projeto)
      const sew=selSEW(Pmaj,n);
      return [
        {k:"Vazão volumétrica requerida",v:Cv.toFixed(1)+" m³/h"},
        {k:"Diâmetro calculado da rosca",v:(Dcalc*1000).toFixed(0)+" mm"},
        {k:"Diâmetro padrão recomendado",v:Dstd+" mm",hi:true},
        {k:"Capacidade real (Ø padrão)",v:Qrv.toFixed(1)+" m³/h  ·  "+Qrm.toFixed(1)+" t/h"},
        {k:"Potência no material (P_H)",v:Ph.toFixed(2)+" kW"},
        {k:"Potência de elevação (P_st)",v:Pst.toFixed(2)+" kW"},
        {k:"Potência em vazio (P_N)",v:Pn.toFixed(2)+" kW"},
        {k:"Potência de acionamento (calculada)",v:Pdrive.toFixed(2)+" kW"},
        {k:"Potência final majorada (+20%)",v:Pmaj.toFixed(2)+" kW",hi:true},
        {sec:"Acionamento SEW recomendado (sobre a potência majorada)"},
        {k:"Momento no eixo do redutor  T = 9550·P/n",v:fmt(Math.round(sew.T))+" N·m"},
        {k:"Fator de serviço adotado (fB)",v:"1,4"},
        {k:"Torque de seleção (T · fB)",v:fmt(Math.round(sew.Tsel))+" N·m"},
        {k:"Relação de redução  i = n_motor / n_rosca",v:"≈ "+sew.i.toFixed(1)+" : 1"},
        {k:"Motor SEW (4 polos, ~1750 rpm)",v:sew.mot.kw.toString().replace(".",",")+" kW · "+sew.mot.d,hi:true},
        {k:"Redutor SEW",v:sew.foraR?("acima da série R ("+fmt(sew.red.t)+" N·m) → industrial série "+sew.ind.serie+"  ·  faixa "+sew.ind.faixa):(sew.red.s+"  (Md "+fmt(sew.red.t)+" N·m)"),hi:true},
        {k:"Motoredutor SEW recomendado",v:sewDrive(sew,Pmaj),hi:true}
      ];
    }
  },

    calcular:function(){
      var g=9.81;
      var Q=num("siQ"),t=num("siT"),eta=num("siEta");
      var rho=num("siRho"),phi=num("siPhi"),delta=num("siDelta"),c=num("siCoes"),d50=num("siD50");
      var scMed=num("siSc"),s1=num("siS1"),D=num("siD");
      if([Q,t,eta,rho,phi,delta,c,d50,s1,D].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||t<=0||eta<=0||eta>1||rho<=0||phi<=0||phi>=90||delta<=0||delta>=90||s1<=0||D<=0) return null;
      // Etapa 2 — capacidade
      var massa=Q*t;
      var V=massa/(rho*eta);
      var gamma=rho*g; // kN/m³
      // Flow Function
      var pr=phi*Math.PI/180;
      var scEst=2*c*Math.cos(pr)/(1-Math.sin(pr));
      if(!isFinite(scEst)||scEst<0) scEst=0;
      var sc=(scMed>0)?scMed:scEst;
      var fonteSc=(scMed>0)?"ensaio Jenike (informado)":"estimado: σc = 2c·cosφi/(1−senφi)";
      var ffc=(sc>0.001)?s1/sc:999;
      var classe = ffc<1?"Não flui (endurecido)":ffc<2?"Muito coesivo":ffc<4?"Coesivo":ffc<10?"Fácil escoamento":"Livre escoamento (free-flowing)";
      var ffcTxt=(ffc>=100)?"> 100":ffc.toFixed(1).replace(".",",");
      // Etapa 4/5 — regime de fluxo e descarga (moega cônica)
      var thetaV=50-delta; if(thetaV<5)thetaV=5; if(thetaV>45)thetaV=45; // meia-abertura da vertical p/ fluxo de massa
      var thetaDes=thetaV-3; if(thetaDes<3)thetaDes=3; // margem de segurança
      var alfaFlow=90-thetaDes; // ângulo da moega recomendado p/ fluxo de massa (com horizontal)
      var Hf=2.0+thetaDes/60; // fator de Jenike H(θ) — moega cônica
      var Barco=(sc>0.001)?Hf*sc/gamma:0; // m
      var Bmec=8*d50/1000; // m  (≈ 8·d50 p/ evitar arco mecânico de blocos)
      var Bfloor=0.6; // mínimo prático em silos de minério (600 mm)
      var Brec=Math.max(Barco,Bmec,Bfloor);
      var coeso=(ffc<4);
      // Etapa 3 — geometria (cilindro + moega cônica/tronco de cone), com opção de alturas informadas
      var H1in=num("siH1"), H2in=num("siH2");
      var hasH1=(!isNaN(H1in)&&H1in>0), hasH2=(!isNaN(H2in)&&H2in>0);
      var alfa, hc;
      if(hasH2){ hc=H2in; alfa=Math.atan(2*hc/Math.max(0.001,(D-Brec)))*180/Math.PI; }
      else { alfa=alfaFlow; hc=(D-Brec)/2*Math.tan(alfa*Math.PI/180); if(hc<0)hc=0; }
      var arad=alfa*Math.PI/180;
      var flowShallow=(alfa<alfaFlow-0.5); // moega mais rasa que o recomendado p/ fluxo de massa
      var Vcone=Math.PI/12*hc*(D*D+D*Brec+Brec*Brec);
      var Vcil, Hcil, semCorpo;
      if(hasH1){ Hcil=H1in; Vcil=Math.PI*D*D/4*Hcil; semCorpo=false; }
      else { Vcil=V-Vcone; semCorpo=(Vcil<=0); Hcil=semCorpo?0:Vcil/(Math.PI*D*D/4); }
      var geoFixa=(hasH1||hasH2);
      var Vgeo=Vcil+Vcone;                 // capacidade real da geometria montada
      var autonGeo=(Q>0)?Vgeo*rho*eta/Q:0; // h de autonomia real
      var geoSub=(geoFixa&&Vgeo<V*0.999);
      var Htot=Hcil+hc;
      var esbeltez=Htot/D;
      // Etapas 5-6 — raio hidráulico e pressões de Janssen (enchimento)
      var Rh=D/4;
      var Kj=1.1*(1-Math.sin(pr));
      var mu=Math.tan(delta*Math.PI/180);
      var z=Hcil; // altura de enchimento no corpo (transição na base do cilindro)
      var pvAsym=gamma*Rh/(mu*Kj);
      var pv=pvAsym*(1-Math.exp(-mu*Kj*z/Rh));
      var ph=Kj*pv, pw=mu*ph;
      // Etapa 7 — fatores de descarga EN 1991-4 (parede vertical, Classe 2)
      var Ch=1.15, Cw=1.10;

      function jph(zz){return Kj*pvAsym*(1-Math.exp(-mu*Kj*zz/Rh));}
      var phMid=jph(z/2);
      // Etapa 9 — dimensionamento das chapas (tensão circunferencial de membrana)
      var Rc=D/2;
      var ntheta=phD*Rc;            // kN/m = N/mm  (esforço de membrana com pressão de descarga)
      var fy=parseFloat($("#siFy").value); if(isNaN(fy))fy=345;
      var abr=num("siAbr"); if(isNaN(abr))abr=0;
      var sadm=0.90*fy;             // MPa = N/mm²  (NBR 8800, escoamento, φ=0,90)
      var tcalc=ntheta/sadm;        // mm
      var tmin=6.0;                 // mm — mínimo prático em silos de minério
      var treq=Math.max(tcalc+abr,tmin);
      var COM=[6.3,8.0,9.5,12.5,16.0,19.0,22.4,25.0,31.5];
      var tcom=COM[COM.length-1]; for(var ti=0;ti<COM.length;ti++){ if(COM[ti]>=treq){ tcom=COM[ti]; break; } }
      var govMin=(tcalc+abr<tmin);
      // Etapa 10 — anéis de reforço (estabilidade do casco sob pressão externa, modo de anel n=2)
      var qext=num("siQext"); if(isNaN(qext)||qext<0)qext=0;
      var Ls=num("siLs"); if(isNaN(Ls)||Ls<=0)Ls=3;
      var Eaco=200e6;                       // kPa (200 GPa)
      var Ireq=qext*Math.pow(Rc,3)*Ls/(3*Eaco); // m⁴
      var Ireq_cm4=Ireq*1e8;                // cm⁴
      var nAneis=Math.max(1,Math.ceil(Hcil/Ls)-1);
      // Etapa 11 — montantes verticais (colunas de apoio)
      var Ncol=parseFloat($("#siNcol").value); if(isNaN(Ncol)||Ncol<1)Ncol=4;
      var Hleg=num("siHleg"); if(isNaN(Hleg)||Hleg<=0)Hleg=6;
      var fself=num("siSelf"); if(isNaN(fself)||fself<1)fself=1.15;
      var Wmat=massa*g;                      // kN (massa em t × g)
      var Wtot=Wmat*fself;                   // kN (material + peso próprio/sobrecargas)
      var Pcol=Wtot/Ncol;                    // kN por montante
      var chi=0.6;                           // redução de flambagem assumida (pré-dim)
      var fy_kNcm2=fy/10;                    // MPa → kN/cm²
      var Areq=Pcol/(chi*0.90*fy_kNcm2);     // cm²
      var lamMax=120, Kbuc=2.0;              // engastado-livre (montante em balanço)
      var imin=Kbuc*(Hleg*100)/lamMax;       // cm
      // Etapa 12 — dimensionamento da moega (tremonha cônica, membrana meridional)
      var Atrans=Math.PI*D*D/4;              // m²

      var senA=Math.sin(arad);
      var Tm=(senA>0)?Fv/(Math.PI*D*senA):0; // kN/m (tração meridional na transição)
      var thop=Tm/sadm;                      // mm (Tm[kN/m]=N/mm; sadm[MPa]=N/mm²)
      var thop_req=Math.max(thop+abr,tmin);
      var thopcom=COM[COM.length-1]; for(var th=0;th<COM.length;th++){ if(COM[th]>=thop_req){ thopcom=COM[th]; break; } }
      var pnHop=pv;                          // estimativa da pressão normal na parede (confirmar pico de switch — EN 1991-4)

      // Etapa 13 — descarga excêntrica (EN 1991-4)
      var e0=num("siEcc"); if(isNaN(e0)||e0<0)e0=0;
      var ecc=e0/D;

      var Fimp=Ci*mdot*vimp/1000;            // kN (força de impacto da alimentação)
      var Icol_cm4=Areq*imin*imin;           // cm⁴ (I ≈ A·i²)
      var Icol=Icol_cm4*1e-8;                // m⁴
      var Edin=200e9;                        // Pa
      var klat=Ncol*3*Edin*Icol/Math.pow(Hleg,3); // N/m (apoio em colunas, modelo cantilever)
      var mvib=Wtot*1000/g;                  // kg (massa total vibrante)
      var fn=(klat>0&&mvib>0)?(1/(2*Math.PI))*Math.sqrt(klat/mvib):0; // Hz
      var OUT=[
        {sec:"Etapa 2 — Capacidade do silo"},

        {k:"Volume da moega (tronco de cone)",v:Vcone.toFixed(1).replace(".",",")+" m³"},
        {k:(hasH1?"Altura 1 — parte reta  H (informada)":"Altura 1 — parte reta  H (pela capacidade)"),v:(semCorpo?"0  ⚠ moega já comporta o volume — reduzir D":Hcil.toFixed(2).replace(".",",")+" m"),hi:true},
        {k:"Altura total  Htot = H + hc",v:Htot.toFixed(2).replace(".",",")+" m"},

      ];

    calcular:function(){
      var g=9.81;
      var Q=num("siQ"),t=num("siT"),eta=num("siEta");
      var rho=num("siRho"),phi=num("siPhi"),deltaIn=num("siDelta"),c=num("siCoes"),d50=num("siD50");
      var scMed=num("siSc"),s1=num("siS1"),a=num("rA"),b=num("rB");
      if([Q,t,eta,rho,phi,deltaIn,c,d50,s1,a,b].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||t<=0||eta<=0||eta>1||rho<=0||phi<=0||phi>=90||deltaIn<=0||deltaIn>=90||s1<=0||a<=0||b<=0) return null;
      var massa=Q*t, V=massa/(rho*eta), gamma=rho*g;
      var pr=phi*Math.PI/180;
      /* ===== ETAPA 3a — REVESTIMENTO: altera o atrito de parede φw ===== */
      var LINER={none:{d:0,t:0,rho:0,n:"sem revestimento (aço carbono)"},
                 hardox:{d:0,t:8,rho:7850,n:"chapa antidesgaste Hardox 400/450, 8 mm"},
                 inox:{d:-5,t:3,rho:7900,n:"aço inoxidável 304 2B, 3 mm"},
                 uhmw:{d:-10,t:12,rho:940,n:"UHMW-PE, 12 mm"},
                 ceram:{d:-3,t:20,rho:3600,n:"cerâmica de alumina, 20 mm"}};
      var LN=LINER[$("#rLiner")?$("#rLiner").value:"none"]||LINER.none;
      var delta=Math.max(5,deltaIn+LN.d);          // φw efetivo com revestimento
      /* ===== ETAPA 1 — FLOW FUNCTION (com tempo de consolidação) ===== */
      var fTemp=parseFloat($("#rTcons")?$("#rTcons").value:"1.0")||1.0;
      var scEst=2*c*Math.cos(pr)/(1-Math.sin(pr)); if(!isFinite(scEst)||scEst<0)scEst=0;
      var sc0=(scMed>0)?scMed:scEst, sc=sc0*fTemp;
      var fonteSc=(scMed>0)?"ensaio Jenike (informado)":"estimado: σc = 2c·cosφi/(1−senφi)";
      var ffc=(sc>0.001)?s1/sc:999;
      var classe=ffc<1?"Não flui (endurecido)":ffc<2?"Muito coesivo":ffc<4?"Coesivo":ffc<10?"Fácil escoamento":"Livre escoamento (free-flowing)";
      var ffcTxt=(ffc>=100)?"> 100":ffc.toFixed(1).replace(".",",");
      var coeso=(ffc<4);
      /* ===== ETAPA 4 — ÁBACO DE JENIKE (fluxo de massa) =====
         θ = meio-ângulo da tremonha medido a partir da VERTICAL, no limite do fluxo de massa,
         em função do atrito de parede φw e do ângulo efetivo de atrito interno δ.
         Tabelas digitalizadas de Jenike (Bulletin 123): cônica (axissimétrica) e plana (cunha).
         Prática de projeto: adotar 3° mais íngreme que o limite (margem de segurança). */
      var JEN_D=[30,40,50,60,70], JEN_W=[0,10,20,30,40];
      var JEN_CON=[[33,24,13, 0, 0],[35,28,19, 7, 0],[36,30,23,13, 0],[37,32,26,18, 7],[38,33,28,22,13]];
      var JEN_PLA=[[49,41,31,17, 0],[50,44,36,25, 8],[51,46,39,31,18],[52,47,42,35,25],[52,48,44,38,30]];
      function bilin(TB,xs,ys,x,y){
        function idx(v,arr){ if(v<=arr[0])return [0,0,0]; if(v>=arr[arr.length-1])return [arr.length-1,arr.length-1,0];
          for(var i=1;i<arr.length;i++){ if(v<=arr[i]) return [i-1,i,(v-arr[i-1])/(arr[i]-arr[i-1])]; } return [arr.length-1,arr.length-1,0]; }
        var ix=idx(x,xs), iy=idx(y,ys);
        var v00=TB[ix[0]][iy[0]],v01=TB[ix[0]][iy[1]],v10=TB[ix[1]][iy[0]],v11=TB[ix[1]][iy[1]];
        var v0=v00+(v01-v00)*iy[2], v1=v10+(v11-v10)*iy[2];
        return v0+(v1-v0)*ix[2];
      }
      var deffIn=num("siDeff");
      var deff=(!isNaN(deffIn)&&deffIn>0)?deffIn:phi;    // ângulo efetivo de atrito interno δ
      var cunha=($("#rHop").value==="cunha");
      var thetaLim=bilin(cunha?JEN_PLA:JEN_CON,JEN_D,JEN_W,deff,delta);
      var margJ=3.0;
      var thetaDes=Math.max(3,thetaLim-margJ);          // θ de projeto (da vertical)
      var alfaJen=90-thetaDes;                           // ângulo de FACE exigido pelo ábaco
      /* Limite construtivo: faces acima de ~70° tornam a tremonha alta demais e o silo
         inviável. Se o ábaco exigir mais que isso, o fluxo de massa NÃO é atingível com
         a geometria — o silo passa a operar em FLUXO DE FUNIL e a boca precisa ser maior
         que o diâmetro de rathole (tubulação) de Jenike, não apenas que o arco. */
      var alfaCapLim=70;
      var alfaCap=(alfaJen>alfaCapLim);
      var alfaFlow=alfaCap?alfaCapLim:alfaJen;
      /* semFluxoMassa é definido após a geometria, na re-avaliação do regime */
      /* Diâmetro de rathole (fluxo de funil): Df = G(φt)·σc/γ  — Jenike */
      var GT_X=[30,40,50,60], GT_Y=[2.0,3.3,5.0,7.5];
      function interpG(x){ if(x<=GT_X[0])return GT_Y[0]; if(x>=GT_X[3])return GT_Y[3];
        for(var i=1;i<4;i++){ if(x<=GT_X[i]) return GT_Y[i-1]+(GT_Y[i]-GT_Y[i-1])*(x-GT_X[i-1])/(GT_X[i]-GT_X[i-1]); } return GT_Y[3]; }
      var Gfun=interpG(deff);
      /* ===== ETAPA 4 — ABERTURA ANTI-ARCO ===== */
      var Hf=(cunha?1.0:2.0)+thetaDes/60;               // fator H(θ) de Jenike
      var Barco=(sc>0.001)?Hf*sc/gamma:0, Bmec=(cunha?6:8)*d50/1000, Bfloor=cunha?0.4:0.6;
      var Drat=(sc>0.001)?Gfun*sc/gamma:0;              // diâmetro de rathole (fluxo de funil)
      var Brec=Math.max(Barco,Bmec,Bfloor);
      if(semFluxoMassa) Brec=Math.max(Brec,Drat);       // em fluxo de funil o rathole governa
      /* ===== ETAPA 3 — GEOMETRIA ===== */
      var Lmax=Math.max(a,b), Lmin=Math.min(a,b);
      var H1in=num("rH1"), H2in=num("rH2");
      var hasH1=(!isNaN(H1in)&&H1in>0), hasH2=(!isNaN(H2in)&&H2in>0);
      var BwIn=num("rBw"), BlIn=num("rBl");
      var hasBw=(!isNaN(BwIn)&&BwIn>0), hasBl=(!isNaN(BlIn)&&BlIn>0);
      var Bw=hasBw?(BwIn/1000):Brec;
      var Bl=hasBl?(BlIn/1000):(cunha?Lmax:Bw);
      if(Bw>Lmin*0.95)Bw=Lmin*0.95; if(Bl>Lmax*0.99)Bl=Lmax*0.99;
      var bocaUser=(hasBw||hasBl);
      var bocaCurta=(Bw<Brec-0.001);
      var bocaNota=bocaCurta?("  ⚠ abaixo do mínimo exigido ("+Math.round(Brec*1000)+" mm) — risco de arco/entupimento"):"";
      /* A boca é retangular Bw × Bl também na tremonha piramidal: Bl acompanha o lado
         MAIOR do silo e Bw o menor. Antes os recuos usavam Bw nas duas direções, o que
         tratava a boca como quadrada e produzia um ângulo de vale mais raso que o real. */
      var aLong=(a>=b);
      var ta=aLong?((a-Bl)/2):((a-Bw)/2), tb=aLong?((b-Bw)/2):((b-Bl)/2);
      if(ta<0)ta=0; if(tb<0)tb=0;
      var hc;
      if(hasH2){ hc=H2in; }
      else if(cunha){ hc=(Lmin-Bw)/2*Math.tan(alfaFlow*Math.PI/180); }
      else { hc=Math.sqrt(ta*ta+tb*tb)*Math.tan(alfaFlow*Math.PI/180); }
      if(!(hc>0))hc=0;
      function angFace(tt){ return (tt<=0.0005)?90:Math.atan(hc/tt)*180/Math.PI; }
      var alfaA,alfaB,alfaVale;
      if(cunha){ alfaA=90; alfaB=angFace((Lmin-Bw)/2); alfaVale=alfaB; }
      else { alfaA=angFace(ta); alfaB=angFace(tb);
             alfaVale=(hc>0)?Math.atan(hc/Math.sqrt(ta*ta+tb*tb))*180/Math.PI:0; }
      /* ===== RE-AVALIAÇÃO DO REGIME PELA GEOMETRIA REAL =====
         O bloco acima usou o ábaco do tipo DECLARADO no formulário apenas para gerar a
         altura da tremonha quando ela é automática. Agora que αA, αB e a boca estão
         definidos, o regime é decidido pela geometria: boca em rasgo (≥ 3:1) com parede de
         topo íngreme escoa em regime plano, e quem governa passa a ser a face convergente
         em vez da aresta de vale. Como o dimensionamento anterior usou o critério mais
         severo, o resultado só pode ficar igual ou mais favorável — nunca contra a segurança. */
      var RG=regimeFluxo({deff:deff,phw:delta,C:Bl,D:Bw,alfaA:alfaA,alfaB:alfaB,
                          alfaVale:alfaVale,forcaPlano:cunha});
      thetaLim=RG.plano?RG.thPla:RG.thCon;
      thetaDes=90-RG.exig;
      alfaJen=RG.exig;
      alfaCap=(RG.exig>alfaCapLim);
      alfaFlow=RG.exig;
      Hf=RG.Hf; Bmec=RG.kMec*d50/1000; Bfloor=RG.Bfloor;
      Barco=(sc>0.001)?Hf*sc/gamma:0;
      Brec=Math.max(Barco,Bmec,Bfloor);
      var semFluxoMassa=!RG.ok;
      if(semFluxoMassa) Brec=Math.max(Brec,Drat);
      bocaCurta=(Bw<Brec-0.001);
      bocaNota=bocaCurta?("  ⚠ abaixo do mínimo exigido ("+Math.round(Brec*1000)+" mm) — risco de arco/entupimento"):"";
      var flowShallow=!RG.ok;
      var valeGap=RG.exig-RG.gov;
      var alfa=alfaVale, arad=alfa*Math.PI/180;
      var betaHop=90-alfa;                               // meio-ângulo da tremonha (da vertical)
      var A1=a*b, A2=Bw*Bl;
      var Vpir=cunha?(hc/2)*(Lmin+Bw)*Lmax:(hc/3)*(A1+A2+Math.sqrt(A1*A2));

      var hCone=(Lmin/2)*Math.tan(rep*Math.PI/180);

      if(hasH1){ Hcil=H1in; Vcil=a*b*Hcil; semCorpo=false; }

      /* ===== CLASSE DE ESBELTEZ (EN 1991-4) ===== */
      var Rh=(a*b)/(2*(a+b)), dc=4*Rh;                   // dimensão característica
      var hcDc=Hcil/dc;
      var clsEsb=(hcDc>=2)?"esbelto":(hcDc>1)?"intermediário":(hcDc>0.4)?"baixo (squat)":"de retenção";
      var Ch,Cw;

      var AAC=$("#rAAC")?$("#rAAC").value:"2";
      /* ===== ETAPAS 5-6 — JANSSEN COM OS TRÊS CASOS DE CARGA (EN 1991-4) =====
         K e μ médios com fatores de conversão a_K e a_μ (EN 1991-4, Tabela E.1 — valores
         genéricos para material sem ensaio: a_K = a_μ = 1,15). */
      var aK=1.15, aMu=1.15;

      }

      var LC2=janssen(Ku,MUu,z);      // atrito máximo (compressão vertical na parede)

      var LCm=janssen(Km,MUm,z);      // valores médios (referência)

      var phD=Ch*ph, pwD=Cw*pw, pvD=Ch*pv;

      function ageom(s){return Math.PI*Math.pow(s.di/1000,2)/4;}      // m² — seção do tubo
      function autil(s){return ageom(s)*fill;}                        // m² — seção ocupada pelo material
      function cap(s){return autil(s)*s.vmax*3600;}                   // m³/h
      var Qv=Q/rho;
      var sel=$("#tcDN").value, S=null, insuf=false;
      if(sel!=="auto"){ for(var i=0;i<TC.length;i++){ if(TC[i].n===sel){ S=TC[i]; break; } } }
      if(!S){ for(var i=0;i<TC.length;i++){ if(cap(TC[i])>=Qv && TC[i].di>=KLUMP*dim){ S=TC[i]; break; } } if(!S){ S=TC[TC.length-1]; insuf=true; } }
      var Ag=ageom(S), Au=autil(S);
      var rLump=(dim>0)?S.di/dim:0;
      var lumpNote=(dim<=0)?"":(rLump>=KLUMP)?"  (OK ≥ "+KLUMP+"× — passagem livre)":(rLump>=2)?"  ⚠ entre 2× e "+KLUMP+"× — confirmar disco/passo com o fabricante":"  ⚠ abaixo de 2× — tubo incompatível com o dimensional; usar diâmetro maior";
      var V=Qv/(Au*3600); if(V>S.vmax){ insuf=true; }
      var Vshow=Math.min(V,S.vmax);
      var fillNote=(fillPc>70)?"  ⚠ acima de 70% — risco de compactação/sobrecarga da corrente":(fillPc<30)?"  (baixa — tubo subutilizado)":"";
      var qm=rho*Au*1000, qc=S.qc;
      var th=theta*Math.PI/180, H=Li*Math.sin(th), Lcos=Li*Math.cos(th);
      var Lhoriz=Lh1+Lh2+Lcos, Lpath=Lh1+Li+Lh2;
      var Fhor=g*(qc*muc+qm*mum)*(Lh1+Lh2);
      var Finc=g*((qc*muc+qm*mum)*Math.cos(th)+(qc+qm)*Math.sin(th))*Li;
      var Fret=g*qc*muc*Lpath;
      var F0=Fhor+Finc+Fret, F=F0*(1+0.08*Nb);
      var Peff=F*Vshow/eta/1000, Pmaj=Peff*1.20;
      var nspr=Vshow*60/(Math.PI*S.pcd), sew=selSEW(Pmaj,nspr);
      /* ===== SELEÇÃO DA CORRENTE =====
         Duas exigências independentes governam a bitola:
         (a) CARGA — carga de ruptura ≥ F·FS, com 2 seções resistentes por elo:
             BL = 2·(π·d²/4)·Rm
         (b) GEOMETRIA — a corrente carrega os discos que varrem o tubo e engrena na roda
             dentada; o construtor de tubo Ø_N adota a bitola tabelada S.d. Reduzir a bitola
             abaixo disso comprometeria a fixação do disco, o passo e a roda dentada.
         Quando (b) governa, o FS efetivo fica muito acima do FS de projeto — isso é
         esperado e NÃO significa superdimensionamento por carga: a corrente é imposta
         pela geometria do tubo, não pelo esforço. */
      var Rm=800, BLreq=F*SF, dreq=Math.sqrt(BLreq/(2*(Math.PI/4)*Rm));
      var CH=[14,16,18,20,22,26,30,34];
      function chCom(d){ for(var i=0;i<CH.length;i++){ if(CH[i]>=d) return CH[i]; } return CH[CH.length-1]; }
      function BLd(d){ return 2*(Math.PI/4)*d*d*Rm; }
      /* --- (1) CARGA: resistência estática --- */
      var dCarga=chCom(dreq);
      /* --- (2) DESGASTE: a corrente perde seção ao longo da vida. A bitola tem de
             atender ao FS AINDA GASTA, no limite de troca. BL ∝ d², logo
             d_novo = d_carga / (1 − w). --- */
      var wPc=parseFloat($("#tcWear")?$("#tcWear").value:"20")||20, wf=wPc/100;
      var dDesg=chCom(dreq/(1-wf));
      /* --- (3) ARTICULAMENTO: pressão de contato entre elos. A cada volta cada elo
             articula duas vezes sob tração. Área de contato ≈ d² (proxy de elo redondo).
             p = F/d² ≤ p_adm  →  d ≥ √(F/p_adm).  É este critério, e não a resistência
             estática, que costuma governar a corrente em arraste tubular. --- */
      var padm=parseFloat($("#tcPadm")?$("#tcPadm").value:"45")||45;
      var dArt=chCom(Math.sqrt(F/padm));
      /* --- (4) DISCO: força de arraste por disco, transmitida localmente à corrente --- */
      var pDisc=num("tcPd"); if(isNaN(pDisc)||pDisc<=0)pDisc=0.25;
      var nDisc=Math.max(1,Math.round((Lh1+Li+Lh2)/pDisc));
      var Fdisc=F/nDisc;                       // N por disco
      var tauDisc=Fdisc/(2*(Math.PI/4)*S.d*S.d); // N/mm² no elo, referência
      /* --- (5) PRÁTICA DO FABRICANTE para o tubo --- */
      var dPrat=S.d;
      var dAuto=Math.max(dCarga,dDesg,dArt,dPrat);
      var govs=[["carga",dCarga],["desgaste",dDesg],["articulamento",dArt],["prática do tubo",dPrat]]
                 .filter(function(x){return x[1]===dAuto;}).map(function(x){return x[0];}).join(" e ");
      var chSel=$("#tcChain")?$("#tcChain").value:"auto";
      var dsel, modoCh;
      if(chSel==="auto"){ dsel=dAuto; modoCh="automático"; }
      else if(chSel==="carga"){ dsel=dCarga; modoCh="mínima pela carga (imposta pelo usuário)"; }
      else { dsel=parseFloat(chSel)||dAuto; modoCh="imposta pelo usuário"; }

         O circuito da corrente é fechado: o comprimento de corrente e o número de discos

      var Lcircuito=2*Ltot;                                  // m — corrente ida e volta
      var espTubo=(S.de-S.di)/2;                             // mm — parede

      var mSup=mTubo*pctSup/100;                             // suportes, flanges, curvas

      var rhoD=RHOD[matD]||940;

      var mCab=(!isNaN(mCabIn)&&mCabIn>0)?mCabIn:mCabEst;
      var mRet=(!isNaN(mRetIn)&&mRetIn>0)?mRetIn:mRetEst;
      var mCh1=(!isNaN(mChIn)&&mChIn>0)?mChIn:mChEst;
      var nCh=parseFloat($("#tcNch")?$("#tcNch").value:"1")||1;
      var mChutes=mCh1*nCh;

      var mMot=massaMotor(sew.mot.kw), mRed=massaRedutor(sew);

      var mVazio=mTubo+mSup+mCorr+mDiscos+mCab+mRet+mChutes+mAcion;
      var mOper=mVazio+mMatOp;
      /* ---- CARGAS PONTUAIS PARA A ESTRUTURA DE APOIO ---- */
      var qDist=(qTubo*(1+pctSup/100)+qCorr*2+mDisco1*2/pDisc)*g/1000;   // kN/m (vazio)
      var qDistOp=qDist+qm*g/1000;                                        // kN/m (operação)
      var PentradaV=(mRet+mChutes)*g/1000;                                 // kN — extremidade de entrada
      var PentradaO=PentradaV+(qm*2)*g/1000;                               // + acúmulo local de material
      var PsaidaV=(mCab+mAcion)*g/1000;                                    // kN — extremidade de descarga
      var PsaidaO=PsaidaV+(qm*2)*g/1000;
      var Pmotor=mAcion*g/1000;                                            // kN — só motor + redutor

      var Treac=(nspr>0)?(9550*Pmaj/nspr):0;                               // N·m

         T1 = F + T0  (ramo tracionado, entra na roda motriz)
         T2 = T0      (ramo frouxo, sai da roda motriz)
         · Na ESTAÇÃO DE ACIONAMENTO o eixo recebe os DOIS ramos: H = T1 + T2 = F + 2·T0.
           É a carga local que dimensiona mancais, eixo, carcaça e chumbadores da estação.

         · Na ANCORAGEM do conjunto o que a estrutura de apoio precisa reter é a REAÇÃO

      var kT0=parseFloat($("#tcT0")?$("#tcT0").value:"0.5")||0.5;
      var FkN=F/1000;
      var T0=kT0*FkN, T1=FkN+T0, T2=T0;
      var Hacion=T1+T2;                                                    // kN — eixo do acionamento

      var menorTubo=null;

      }
      var OUT=[

        {k:"Seção geométrica do tubo  A = π·d²/4",v:(Ag*1e4).toFixed(0)+" cm²"},

  elevador_canecas:{

    referencia:"Método CEMA (Bucket Elevators) e velocidades de descarga · canecas tipo 4B/Tapco/Maxi-Lift (volume e espaçamento) · referência de mineração pesada BEUMER (correia) e AUMUND (corrente central forjada BWZ) · acionamento SEW-EURODRIVE",
    campos:[

      {id:"ecH",label:"Altura de elevação",unidade:"m",tipo:"number",valor:25},
      {id:"ecFill",label:"Fator de enchimento da caneca",tipo:"select",valor:"0.75",opcoes:[

      {id:"ecBucket",label:"Caneca (catálogo)",tipo:"select",valor:"auto",opcoes:[

        {v:"6",t:"6 (corrente leve)"},{v:"8",t:"8 (normal)"},{v:"10",t:"10 (correia/severo)"}]}
    ],
    calcular:function(){
      var g=9.81, eta=0.9;
      var Q=num("ecQ"),rho=num("ecRho"),H=num("ecH"),D=num("ecD");
      var fill=parseFloat($("#ecFill").value),disc=$("#ecDisc").value,trac=$("#ecTrac").value,SF=parseFloat($("#ecSF").value);
      if([Q,rho,H,D].some(function(x){return isNaN(x);})||Q<=0||rho<=0||H<=0||D<=0) return null;
      var BK=[
        {n:"C2",Vb:2.0,hb:0.16,w:0.20},{n:"C5",Vb:5.0,hb:0.20,w:0.30},{n:"C10",Vb:10,hb:0.25,w:0.40},
        {n:"C20",Vb:20,hb:0.32,w:0.50},{n:"C40",Vb:40,hb:0.40,w:0.65},{n:"C80",Vb:80,hb:0.50,w:0.80}
      ];
      var vnat=2.215*Math.sqrt(D), nnat=42.3/Math.sqrt(D);
      var v=(disc==="centrifuga")?Math.min(vnat,1.8):0.9;
      var n=v*60/(Math.PI*D);
      function spac(bk){ return (disc==="centrifuga"?2.4:1.1)*bk.hb; }
      function capBk(bk){ return 3.6*(bk.Vb/spac(bk))*v*rho*fill; }
      var sel=$("#ecBucket").value, BK0=null, insuf=false;
      if(sel!=="auto"){ for(var i=0;i<BK.length;i++){ if(BK[i].n===sel){ BK0=BK[i]; break; } } }
      if(!BK0){ for(var i=0;i<BK.length;i++){ if(capBk(BK[i])>=Q){ BK0=BK[i]; break; } } if(!BK0){ BK0=BK[BK.length-1]; insuf=true; } }
      var a=spac(BK0), capsel=capBk(BK0); if(capsel<Q) insuf=true;
      var qmat=Q/(3.6*v), Nbk=Math.ceil(2*(H+1)/a);
      var fd=(disc==="centrifuga")?1.15:1.10;
      var Plift=Q*H/(367*eta), Peff=Plift*fd, Pmaj=Peff*1.20;
      var sew=selSEW(Pmaj,n);
      var Fwork=Pmaj*1000/v;
      var beltB=0, epClass=0, BLreq=0;
      if(trac==="correia"){
        beltB=Math.ceil((BK0.w*1000+50)/50)*50;
        var EPc=[250,400,500,630,800,1000,1250], req=(Fwork/beltB)*SF;
        epClass=EPc[EPc.length-1]; for(var e=0;e<EPc.length;e++){ if(EPc[e]>=req){ epClass=EPc[e]; break; } }
      } else { BLreq=Fwork*SF; }
      var discOK=(disc==="centrifuga")?(Math.abs(v-vnat)/vnat<0.15):true;
      var OUT=[
        {sec:"Capacidade e caneca"},
        {k:"Vazão de projeto",v:Q.toFixed(0)+" t/h"},
        {k:"Vazão volumétrica  Q/ρ",v:(Q/rho).toFixed(1).replace(".",",")+" m³/h"},
        {k:"Tipo de descarga",v:(disc==="centrifuga"?"Centrífuga (alta velocidade)":"Contínua (baixa velocidade)")},
        {k:"Caneca selecionada",v:"Tipo "+BK0.n+" · "+BK0.Vb.toFixed(1).replace(".",",")+" L · largura "+(BK0.w*1000).toFixed(0)+" mm",hi:true},
        {k:"Espaçamento entre canecas",v:(a*1000).toFixed(0)+" mm"+(insuf?"  ⚠ acima da capacidade — usar caneca/elevador maior":"")},
        {k:"Capacidade da configuração",v:capsel.toFixed(1).replace(".",",")+" t/h · "+(capsel/rho).toFixed(1).replace(".",",")+" m³/h  (enchimento "+(fill*100).toFixed(0)+"%)"},
        {k:"Número aproximado de canecas (2 ramais)",v:Nbk+" un"},
        {sec:"Velocidade e descarga"},
        {k:"Diâmetro do tambor/roda da cabeça",v:(D*1000).toFixed(0)+" mm"},
        {k:"Velocidade da correia/corrente",v:v.toFixed(2).replace(".",",")+" m/s",hi:true},
        {k:"Rotação da cabeça",v:n.toFixed(1).replace(".",",")+" rpm"},
        {k:"Velocidade natural de descarga (centrífuga)",v:vnat.toFixed(2).replace(".",",")+" m/s · "+nnat.toFixed(1).replace(".",",")+" rpm  ("+(disc==="centrifuga"?(discOK?"OK":"⚠ ajustar Ø do tambor"):"ref. — descarga contínua usa v menor")+")"},
        {sec:"Potência e acionamento SEW"},
        {k:"Potência de elevação  P = Q·H/(367·η)",v:Plift.toFixed(2).replace(".",",")+" kW"},
        {k:"Resistência de escavação no boot (×"+fd.toFixed(2).replace(".",",")+")",v:Peff.toFixed(2).replace(".",",")+" kW · "+(Peff/0.7457).toFixed(1).replace(".",",")+" HP",hi:true},
        {k:"Potência final majorada (+20%)",v:Pmaj.toFixed(2).replace(".",",")+" kW",hi:true},
        {k:"Momento no eixo do redutor  T = 9550·P/n",v:fmt(Math.round(sew.T))+" N·m"},
        {k:"Torque de seleção (T · fB)",v:fmt(Math.round(sew.Tsel))+" N·m"},
        {k:"Relação de redução  i = n_motor / n_saída",v:"≈ "+sew.i.toFixed(1).replace(".",",")+" : 1"},
        {k:"Motor SEW (4 polos, ~1750 rpm)",v:sew.mot.kw.toString().replace(".",",")+" kW · "+sew.mot.d,hi:true},
        {k:"Motoredutor SEW recomendado",v:sewDrive(sew,Pmaj),hi:true}
      ];
      if(trac==="correia"){
        OUT.push({sec:"Tração — correia (EP)"});
        OUT.push({k:"Tração de trabalho  F = P/v",v:fmt(Math.round(Fwork))+" N"});
        OUT.push({k:"Largura da correia (caneca + folga)",v:beltB+" mm"});
        OUT.push({k:"Tração por largura",v:(Fwork/beltB).toFixed(1).replace(".",",")+" N/mm"});
        OUT.push({k:"Classe da correia (EP) com FS "+SF.toFixed(0),v:"EP "+epClass+" N/mm",hi:true});
        OUT.push({k:"Observação",v:"Pré-dimensionamento — para abrasivos (minério, clínquer, escória) a correia (BEUMER) tem maior vida útil. Confirmar canecas no catálogo (4B/Tapco/Maxi-Lift) e velocidades CEMA."});
      } else {
        OUT.push({sec:"Tração — corrente central"});
        OUT.push({k:"Tração de trabalho  F = P/v",v:fmt(Math.round(Fwork))+" N"});
        OUT.push({k:"Carga de ruptura requerida  F·FS",v:fmt(Math.round(BLreq/1000))+" kN  (FS "+SF.toFixed(0)+")",hi:true});
        OUT.push({k:"Recomendação da corrente",v:"Corrente central forjada (tipo AUMUND BWZ) ou de elos redondos RUD com carga de ruptura ≥ "+(BLreq/1000).toFixed(0)+" kN."});
        OUT.push({k:"Observação",v:"Pré-dimensionamento — corrente central (AUMUND) indicada para granel grosso/quente/abrasivo. Confirmar canecas (4B/Tapco) e velocidades CEMA."});
      }
      OUT.geo={tipo:"canecas",H:H,v:v,D:D,bucket:BK0.n,Vb:BK0.Vb,cap:capsel,Pmaj:Pmaj,motorkw:sew.mot.kw,motord:sew.mot.d,disc:(disc==="centrifuga"?"Centrífuga":"Contínua"),trac:(trac==="correia"?("Correia EP "+epClass):("Corrente BL≥"+Math.round(BLreq/1000)+" kN")),Nbk:Nbk};
      return OUT;
    }
  },

    calcular:function(){
      var Q=num("pnQ"),rho=num("pnRho"),ab=num("pnAb"),over=num("pnOver"),half=num("pnHalf"),P=num("pnP"),S=num("pnS");
      var Q2=parseFloat($("#pnForma").value),Q4=parseFloat($("#pnUmidade").value),Q5=parseFloat($("#pnTela").value),Q1=parseFloat($("#pnDecks").value);

      function interp(t,x){ if(x<=t[0][0])return t[0][1]; if(x>=t[t.length-1][0])return t[t.length-1][1]; for(var i=1;i<t.length;i++){ if(x<=t[i][0]){ var f=(x-t[i-1][0])/(t[i][0]-t[i-1][0]); return t[i-1][1]+f*(t[i][1]-t[i-1][1]); } } return t[t.length-1][1]; }
      // Gráfico B — capacidade básica C (m³/h·m²) x abertura (mm)
      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];
      // Gráfico C — fator de material retido M x % oversize
      var TM=[[0,0.92],[10,0.97],[20,1.0],[30,1.04],[40,1.10],[50,1.18],[60,1.28],[65,1.35],[70,1.46],[75,1.60],[78,1.80],[80,2.0],[85,2.7],[90,3.8]];
      // Gráfico D — fator K x % de material < ½ da abertura

      function q3wet(a){ if(a<=6)return 1.4; if(a<=12)return 1.3; if(a<=25)return 1.25; if(a<=40)return 1.2; if(a<=50)return 1.1; if(a<=75)return 1.15; return 1.0; }
      var C=interp(TC,ab), M=interp(TM,over), K=interp(TK,half);
      var Q3=(umido==="sim")?q3wet(ab):1.0, Q6=1.1; // movimento linear (peneira horizontal)
      var Qn=Q1*Q2*Q3*Q4*Q5*Q6;
      var T=Q/rho;                          // alimentação volumétrica (m³/h)
      var A=(T*P)/(C*M*K*Qn);               // área necessária (m²)
      // Seleção do modelo Metso pela área ativa (m²) — largura W (m), comprimento L (m)
      var MOD=[{n:"4×10",a:3.24,w:1.2,l:3.0},{n:"4×12",a:3.9,w:1.2,l:3.6},{n:"5×12",a:5.0,w:1.5,l:3.6},{n:"5×14",a:5.83,w:1.5,l:4.2},{n:"6×16",a:8.2,w:1.8,l:4.9},{n:"8×16",a:11.0,w:2.45,l:4.9},{n:"7×20",a:11.9,w:2.15,l:6.1},{n:"8×20",a:13.8,w:2.45,l:6.1},{n:"8×24",a:16.5,w:2.45,l:7.3},{n:"10×20",a:17.4,w:3.05,l:6.1},{n:"10×24",a:21.0,w:3.05,l:7.3}];
      var sel=null; for(var i=0;i<MOD.length;i++){ if(MOD[i].a>=A){ sel=MOD[i]; break; } }

        {k:"Modelo selecionado (área ativa Metso)",v:sel.n+" · "+sel.a.toFixed(2).replace(".",",")+" m²"+(insuf?"  ⚠ maior modelo da tabela — área insuficiente, prever 2 peneiras em paralelo ou maior":""),hi:true},

      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];

        {n:"SH 8'×20'",lin:"SH",  a:14.9,w:2.445,l:6.100}
      ];
      var linha=$("#piLinha")?$("#piLinha").value:"SXPI";

      var nD=$("#piNd")?parseInt($("#piNd").value,10):1; if(isNaN(nD)||nD<1)nD=1;

      {id:"pbTela",label:"Tipo de tela / área aberta (Q5)",tipo:"select",valor:"0.85",opcoes:[
        {v:"1",t:"Arame — abertura quadrada (Q5 = 1,0)"},{v:"1.05",t:"Arame — abertura retangular (Q5 = 1,05)"},
        {v:"0.75",t:"Placa de aço — quadrada (Q5 = 0,75)"},{v:"0.8",t:"Placa de aço — retangular (Q5 = 0,80)"},
        {v:"0.85",t:"Poliuretano/borracha (Q5 = 0,85)"},{v:"0.9",t:"Poliuretano/borracha — retangular (Q5 = 0,90)"}]},
      {id:"pbDecks",label:"Posição do deck (Q1)",tipo:"select",valor:"1",opcoes:[
        {v:"1",t:"1º deck / deck único (Q1 = 1,0)"},{v:"0.9",t:"2º deck (Q1 = 0,9)"},{v:"0.8",t:"3º deck (Q1 = 0,8)"}]},
      {id:"pbP",label:"Fator de confiança P (1,0 a 1,4)",tipo:"number",valor:1.1,step:"0.05"},
      {tipo:"head",label:"Inclinação variável e verificação de camada"},
      {id:"pbInclE",label:"Inclinação de entrada (deck íngreme)",unidade:"graus",tipo:"number",valor:34,step:"1"},
      {id:"pbInclS",label:"Inclinação de descarga (deck suave)",unidade:"graus",tipo:"number",valor:12,step:"1"},
      {id:"pbS",label:"Velocidade de transporte do material  S",unidade:"m/min",tipo:"number",valor:33,step:"1"}
    ],
    calcular:function(){
      var Q=num("pbQ"),rho=num("pbRho"),ab=num("pbAb"),over=num("pbOver"),half=num("pbHalf"),P=num("pbP"),S=num("pbS"),inclE=num("pbInclE"),inclS=num("pbInclS");
      var Q2=parseFloat($("#pbForma").value),Q4=parseFloat($("#pbUmidade").value),Q5=parseFloat($("#pbTela").value),Q1=parseFloat($("#pbDecks").value);
      var umido=$("#pbUmido").value;
      if([Q,rho,ab,over,half,P,S].some(function(x){return isNaN(x);})||Q<=0||rho<=0||ab<=0||P<=0||S<=0) return null;
      function interp(t,x){ if(x<=t[0][0])return t[0][1]; if(x>=t[t.length-1][0])return t[t.length-1][1]; for(var i=1;i<t.length;i++){ if(x<=t[i][0]){ var f=(x-t[i-1][0])/(t[i][0]-t[i-1][0]); return t[i-1][1]+f*(t[i][1]-t[i-1][1]); } } return t[t.length-1][1]; }
      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];
      var TM=[[0,0.92],[10,0.97],[20,1.0],[30,1.04],[40,1.10],[50,1.18],[60,1.28],[65,1.35],[70,1.46],[75,1.60],[78,1.80],[80,2.0],[85,2.7],[90,3.8]];
      var TK=[[0,0.40],[10,0.52],[20,0.62],[25,0.70],[30,0.78],[40,0.93],[50,1.10],[60,1.25],[70,1.42],[80,1.60],[90,2.0]];
      var TQ6=[[30,1.0],[40,1.1],[50,1.2],[60,1.3],[70,1.4]]; // banana CBS — Q6 pelo % de material passante
      function q3wet(a){ if(a<=6)return 1.4; if(a<=12)return 1.3; if(a<=25)return 1.25; if(a<=40)return 1.2; if(a<=50)return 1.1; if(a<=75)return 1.15; return 1.0; }
      var C=interp(TC,ab), M=interp(TM,over), K=interp(TK,half);
      var passante=Math.max(0,Math.min(100,100-over));
      var Q6=interp(TQ6,passante);            // fator da peneira banana pelo % passante
      var Q3=(umido==="sim")?q3wet(ab):1.0;
      var Qn=Q1*Q2*Q3*Q4*Q5*Q6;
      var T=Q/rho;
      var A=(T*P)/(C*M*K*Qn);
      // Catálogo de peneiras banana Metso CBS — área ativa (m²), largura W (m), comprimento L (m)
      var MOD=[{n:"CBS 5'×14'",a:6.0,w:1.525,l:4.270},{n:"CBS 6'×16'",a:8.2,w:1.835,l:4.880},{n:"CBS 7'×20'",a:11.9,w:2.140,l:6.100},{n:"CBS 8'×20'",a:13.7,w:2.455,l:6.100},{n:"CBS 8'×24'",a:16.4,w:2.445,l:7.320},{n:"CBS 10'×24'",a:20.5,w:3.055,l:7.320}];
      var sel=null; for(var i=0;i<MOD.length;i++){ if(MOD[i].a>=A){ sel=MOD[i]; break; } }
      var insuf=false; if(!sel){ sel=MOD[MOD.length-1]; insuf=true; }
      var Dbed=100*T/(6*S*(sel.w-0.15));
      var limCam=4*ab, camOK=(Dbed<=limCam);
      var nModel=A/sel.a;
      var inclNote=(inclE<inclS)?"  ⚠ entrada deve ser mais íngreme que a descarga":"";
      var OUT=[
        {sec:"Alimentação"},
        {k:"Vazão de alimentação ao deck",v:Q.toFixed(0)+" t/h"},
        {k:"Densidade aparente",v:rho.toFixed(2).replace(".",",")+" t/m³"},
        {k:"Alimentação volumétrica  T = Q / ρ",v:T.toFixed(1).replace(".",",")+" m³/h",hi:true},
        {k:"Abertura desejada (separação)",v:ab.toFixed(0)+" mm"},
        {k:"% de oversize na alimentação",v:over.toFixed(0)+" %"},
        {k:"% de material passante na alimentação",v:passante.toFixed(0)+" %  (rege o fator Q6 da banana)"},
        {k:"% de material < ½ da abertura",v:half.toFixed(0)+" %"},
        {sec:"Fatores do método (VSMA / Metso)"},
        {k:"Capacidade básica  C (gráfico B)",v:C.toFixed(1).replace(".",",")+" m³/h·m²",hi:true},
        {k:"Fator de material retido  M (gráfico C — oversize)",v:M.toFixed(2).replace(".",",")},
        {k:"Fator  K (gráfico D — % < ½ abertura)",v:K.toFixed(2).replace(".",",")},
        {k:"Fator de confiança  P",v:P.toFixed(2).replace(".",",")},
        {k:"Q1 — posição do deck",v:Q1.toFixed(2).replace(".",",")},
        {k:"Q2 — forma da partícula",v:Q2.toFixed(2).replace(".",",")},
        {k:"Q3 — peneiramento via úmida",v:Q3.toFixed(2).replace(".",",")+(umido==="sim"?"  (via úmida)":"  (via seca)")},
        {k:"Q4 — umidade superficial",v:Q4.toFixed(2).replace(".",",")},
        {k:"Q5 — tipo de tela / área aberta",v:Q5.toFixed(2).replace(".",",")},
        {k:"Q6 — peneira banana (pelo % passante)",v:Q6.toFixed(2).replace(".",",")+"  ("+passante.toFixed(0)+"% passante)",hi:true},
        {k:"Produto de correção  Qn = Q1·Q2·Q3·Q4·Q5·Q6",v:Qn.toFixed(3).replace(".",","),hi:true},
        {sec:"Área e seleção da peneira"},
        {k:"Área necessária  A = (T·P)/(C·M·K·Qn)",v:A.toFixed(2).replace(".",",")+" m²",hi:true},
        {k:"Modelo selecionado (linha banana CBS)",v:sel.n+" · "+sel.a.toFixed(2).replace(".",",")+" m²"+(insuf?"  ⚠ maior modelo do catálogo — área insuficiente, prever 2 peneiras em paralelo":""),hi:true},
        {k:"Largura × comprimento do deck",v:sel.w.toFixed(2).replace(".",",")+" × "+sel.l.toFixed(2).replace(".",",")+" m"},
        {k:"Inclinação variável (entrada → descarga)",v:inclE.toFixed(0)+"° → "+inclS.toFixed(0)+"°"+inclNote},
        {k:"Ocupação da área ativa (A / área do modelo)",v:(nModel*100).toFixed(0)+" %"},
        {sec:"Camada de material e eficiência"},
        {k:"Velocidade de transporte  S",v:S.toFixed(0)+" m/min"},
        {k:"Espessura da camada na descarga  D = 100·T/(6·S·(W−0,15))",v:Dbed.toFixed(0)+" mm"+(camOK?"  (OK ≤ 4·abertura)":"  ⚠ > 4·abertura ("+limCam.toFixed(0)+" mm) — modelo mais largo"),hi:true},
        {k:"Limite recomendado da camada (≈ 3 a 4 × abertura)",v:limCam.toFixed(0)+" mm"},
        {k:"Eficiência assumida no método",v:"90% (contaminação ~5%)"},
        {k:"Para eficiência de 95%",v:"operar com 80% da capacidade calculada ou aumentar a área em 20%"},
        {k:"Observação",v:"Pré-dimensionamento de peneira banana CBS (inclinação variável, movimento circular). O deck mais íngreme na entrada mantém a camada fina e acelera a estratificação, elevando a capacidade — refletida no fator Q6 pelo % de material passante (0,30→1,0 a 0,70→1,4). Curvas de capacidade referidas a 1,6 t/m³. Confirmar tela, amplitude/frequência e o modelo na folha de dados do fabricante."}
      ];
      OUT.geo={tipo:"peneira",banana:true,model:sel.n,A:A,Amod:sel.a,W:sel.w,L:sel.l,ab:ab,C:C,M:M,K:K,Qn:Qn,T:T,Dbed:Dbed,decks:Q1,incl:inclE,inclS:inclS};
      return OUT;
    }
  },

  calha_vibratoria:{
    titulo:"Calha Vibratória (saída de silo) — pré-dimensionamento",
    referencia:"Manual de Britagem Metso/FAÇO — Alimentadores e Calhas Vibratórias: Q = 3600·φ1·φ2·V·L·H (m³/h), curva de velocidade V (rpm × amplitude 3–7 mm), fatores φ1 (granulometria) e φ2 (umidade), limites de altura de camada (H ≤ 0,5/0,3/0,2·L) e fator de inclinação descendente; catálogos de calhas CV (sob silo) e alimentadores suspensos MVS",

        {v:"sim",t:"Com comporta e manga flexível"},{v:"nao",t:"Sem comporta (vazão só por rotação)"}]},
      {tipo:"head",label:"Catálogo"},
      {id:"cvModel",label:"Modelo (calhas CV / suspensos MVS / Vibraline)",tipo:"select",valor:"auto",opcoes:[
        {v:"auto",t:"Automático (pela capacidade)"},
        {v:"CV-1308",t:"CV-1308 · 110–240 t/h"},{v:"CV-1510",t:"CV-1510 · 160–320 t/h"},
        {v:"MVS-25070",t:"MVS-25070 · 70–350 t/h"},{v:"MVS-35090",t:"MVS-35090 · 190–590 t/h"},
        {v:"MVS-35120",t:"MVS-35120 · 290–830 t/h"},{v:"MVS-50158",t:"MVS-50158 · 420–1040 t/h"},
        {v:'Vibraline 36"×60"',t:'Vibraline 36"×60" · 80–320 t/h'},{v:'Vibraline 60"×72"',t:'Vibraline 60"×72" · 240–770 t/h'},
        {v:'Vibraline 72"×96"',t:'Vibraline 72"×96" · 290–960 t/h'},{v:'Vibraline 84"×120"',t:'Vibraline 84"×120" · 320–1280 t/h'}]}
    ],
    calcular:function(){
      var Q=num("cvQ"),rho=num("cvRho"),Fmax=num("cvFmax"),amp=num("cvAmp"),rpm=num("cvRpm");
      var f1=parseFloat($("#cvGran").value),f2=parseFloat($("#cvUmid").value),incl=parseFloat($("#cvIncl").value);
      if([Q,rho,Fmax,amp,rpm].some(function(x){return isNaN(x);})||Q<=0||rho<=0||amp<=0||rpm<=0) return null;
      // Curva de velocidade V (m/s) — linhas por amplitude (mm) × rotação (rpm) — gráfico do manual
      var RP=[500,600,700,800,900];
      var VA={3:[0.07,0.11,0.17,0.22,0.27],4:[0.10,0.15,0.21,0.25,0.28],5:[0.13,0.18,0.23,0.28,0.31],6:[0.15,0.21,0.26,0.30,0.34],7:[0.23,0.29,0.33,0.37,0.40]};
      function interp1(xs,ys,x){ if(x<=xs[0])return ys[0]; if(x>=xs[xs.length-1])return ys[ys.length-1]; for(var i=1;i<xs.length;i++){ if(x<=xs[i]){ var t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]); } } return ys[ys.length-1]; }
      var aC=Math.max(3,Math.min(7,amp)), nC=Math.max(500,Math.min(900,rpm));
      var aLo=Math.floor(aC), aHi=Math.ceil(aC); if(aLo<3)aLo=3; if(aHi>7)aHi=7;
      var vLo=interp1(RP,VA[aLo],nC), vHi=interp1(RP,VA[aHi],nC);
      var V0=(aHi===aLo)?vLo:vLo+(vHi-vLo)*(aC-aLo)/(aHi-aLo);
      var fIncl=(incl>=10)?1.6:(incl>=5)?1.3:1.0; if(incl>0&&incl<5)fIncl=1+0.3*(incl/5); else if(incl>5&&incl<10)fIncl=1.3+0.3*((incl-5)/5);
      var V=V0*fIncl;
      var Tvol=Q/rho;                       // m³/h requerido
      var hmaxF=(f1>=1)?0.2:(f1>=0.85)?0.3:0.5;   // H ≤ 0,2/0,3/0,5·L pela granulometria
      // Catálogo — calhas CV (sob silo) e alimentadores suspensos MVS
      var MOD=[
        {n:"CV-1308",L:0.70,C:1.28,cmin:110,cmax:240,kw:3.7,fmax:203,boca:"800 × 700"},
        {n:"CV-1510",L:0.90,C:1.48,cmin:160,cmax:320,kw:3.7,fmax:305,boca:"900 × 900"},
        {n:'Vibraline 36"×60"',L:0.90,C:1.50,cmin:80,cmax:320,kw:7.4,fmax:150,boca:"bica sob projeto",vib:true},
        {n:"MVS-25070",L:0.70,C:2.50,cmin:70,cmax:350,kw:7.5,fmax:355,boca:"1100 × 1000"},
        {n:"MVS-35090",L:0.90,C:3.50,cmin:190,cmax:590,kw:11.9,fmax:510,boca:"1900 × 1570"},
        {n:'Vibraline 60"×72"',L:1.50,C:1.80,cmin:240,cmax:770,kw:7.4,fmax:250,boca:"bica sob projeto",vib:true},
        {n:"MVS-35120",L:1.20,C:3.50,cmin:290,cmax:830,kw:23.9,fmax:510,boca:"1800 × 1800"},
        {n:'Vibraline 72"×96"',L:1.80,C:2.40,cmin:290,cmax:960,kw:14.7,fmax:300,boca:"bica sob projeto",vib:true},
        {n:"MVS-50158",L:1.50,C:5.00,cmin:420,cmax:1040,kw:29.8,fmax:610,boca:"2800 × 1450"},
        {n:'Vibraline 84"×120"',L:2.10,C:3.00,cmin:320,cmax:1280,kw:22.1,fmax:400,boca:"bica sob projeto",vib:true}
      ];
      var sel=$("#cvModel").value, M=null;
      if(sel!=="auto"){ for(var i=0;i<MOD.length;i++){ if(MOD[i].n===sel){ M=MOD[i]; break; } } }
      var insufCat=false; if(!M){ for(var i=0;i<MOD.length;i++){ if(MOD[i].cmax>=Q){ M=MOD[i]; break; } } if(!M){ M=MOD[MOD.length-1]; insufCat=true; } }
      var L=M.L, Hmax=hmaxF*L;
      var Hreq=Tvol/(3600*f1*f2*V*L);        // m — altura de camada (abertura de comporta) necessária
      var capMaxGeom=3600*f1*f2*V*L*Hmax*rho; // t/h máx. da mesa nesta condição (V, material, Hmax)
      var camadaOK=(Hreq<=Hmax), blocoOK=(Fmax<=M.fmax), qBaixa=(Q<M.cmin*0.999), qAlta=(Q>M.cmax*1.001);
      /* ===================== PESO ESTIMADO DO CONJUNTO =====================
         Mesa (fundo + duas laterais) em chapa, mais reforços e berço; motovibrador(es)
         conforme a potência de catálogo do modelo; molas de suspensão; comporta e manga.
         O material sobre a mesa entra só no peso em operação. */
      var espCh=num("chEsp"); if(!isFinite(espCh)||espCh<=0)espCh=8;
      var pctRefCh=num("chRef"); if(!isFinite(pctRefCh)||pctRefCh<0)pctRefCh=45;
      var latIn=num("chLat");
      var hLat=(isFinite(latIn)&&latIn>0)?(latIn/1000):Math.max(0.30,1.6*Hmax);   // m
      var Afundo=M.C*L, Alat2=2*M.C*hLat;
      var mChapaCh=(Afundo+Alat2)*(espCh/1000)*7850;                 // kg
      var mMesa=mChapaCh*(1+pctRefCh/100);
      /* motovibradores: até 7 kW o catálogo indica 1 unidade; acima, 2 unidades */
      var nVib=(M.kw<7)?1:2, kwUn=M.kw/nVib;
      var mVibIn=num("chMvib");
      /* correlação empírica para motovibradores pesados: m ≈ 95 · P^0,85 (kg, kW) */
      var mVibUn=(isFinite(mVibIn)&&mVibIn>0)?mVibIn:(95*Math.pow(kwUn,0.85));
      var mVibTot=nVib*mVibUn;
      /* molas e berço de apoio */
      var nMolCh=selvN("chNmol",4);
      var mMolas=nMolCh*(6+0.012*(mMesa+mVibTot));                   // kg — molas + suportes
      /* comporta e vedação */
      var temComp=(selv("chComp","sim")==="sim");
      var mComp=temComp?(0.35*L*M.C*100+45):0;                       // kg — comporta + manga
      var mVazioCh=mMesa+mVibTot+mMolas+mComp;
      var mMatMesa=Tvol/3600*(M.C/Math.max(V,0.01))*rho*1000;        // kg sobre a mesa
      if(!isFinite(mMatMesa)||mMatMesa<0)mMatMesa=0;
      var mOperCh=mVazioCh+mMatMesa;
      /* cargas na estrutura de apoio */
      var gCh=9.80665;
      var Pest_ch=mOperCh*gCh/1000;                                  // kN — estática
      var FcCh=1.5*(mMesa+mVibTot+0.5*mMatMesa)*gCh/1000;            // kN — dinâmica (ka ≈ 1,5)
      var PporMola=Pest_ch/nMolCh;
      var OUT=[
        {sec:"Requisito de descarga"},
        {k:"Vazão de projeto",v:Q.toFixed(0)+" t/h"},
        {k:"Densidade aparente",v:rho.toFixed(2).replace(".",",")+" t/m³"},
        {k:"Vazão volumétrica  T = Q / ρ",v:Tvol.toFixed(1).replace(".",",")+" m³/h",hi:true},
        {k:"Maior bloco do material  F_máx",v:fmt(Math.round(Fmax))+" mm"},
        {k:"Material selecionado",v:(function(){var m=CALHA_MAT[selv("chMat","custom")];
           return m?(m.nota||("preset — ρ "+m.rho.toFixed(2).replace(".",",")+" t/m³ · bloco "+m.d+" mm")):"personalizado (valores informados manualmente)";})()},
        {k:"Alerta de degradação",v:(function(){var m=CALHA_MAT[selv("chMat","custom")];
           if(!m||!m.briq) return "—";
           return "⚠ BRIQUETE — peça prensada e friável. A vibração gera finos por atrito e impacto: usar a MENOR amplitude que atenda à vazão (3 a 4 mm), evitar altura de camada excessiva na comporta, revestir a mesa com poliuretano ou UHMW-PE e limitar a queda na transferência. Vibração contínua com o silo cheio compacta e quebra o briquete — acionar de forma intermitente e somente com o equipamento a jusante em operação.";})(),
         hi:(function(){var m=CALHA_MAT[selv("chMat","custom")];return !!(m&&m.briq);})()},
        {sec:"Fatores e velocidade do material"},
        {k:"Fator de granulometria  φ1",v:f1.toFixed(2).replace(".",",")},
        {k:"Fator de umidade  φ2",v:f2.toFixed(2).replace(".",",")},
        {k:"Amplitude · rotação",v:aC.toFixed(1).replace(".",",")+" mm · "+Math.round(nC)+" rpm"+((amp<3||amp>7)?"  (amplitude fora de 3–7 mm — limitada)":"")+((rpm<500||rpm>900)?"  (rpm fora de 500–900 — extrapolado)":"")},
        {k:"Velocidade base do material (curva)  V0",v:V0.toFixed(3).replace(".",",")+" m/s"},
        {k:"Fator de inclinação descendente",v:fIncl.toFixed(2).replace(".",",")+"  ("+incl.toFixed(0)+"°)"},
        {k:"Velocidade do material adotada  V",v:V.toFixed(3).replace(".",",")+" m/s",hi:true},
        {sec:"Seleção do alimentador e geometria"},
        {k:"Modelo selecionado (catálogo)",v:M.n+" · "+M.cmin+"–"+M.cmax+" t/h"+(insufCat?"  ⚠ acima do maior modelo — prever 2 unidades ou maior":qAlta?"  ⚠ acima da faixa do modelo":qBaixa?"  (vazão baixa p/ o modelo — regular por rotação/amplitude)":""),hi:true},
        {k:"Linha do equipamento",v:M.vib?"Vibraline — calha vibrante sob silo/pilha (movimento linear, 2 vibradores)":(M.n.indexOf("MVS")===0?"MVS — alimentador vibratório suspenso (sob silo/pilha)":"CV — calha vibratória (sob silo/pilha)")},
        {k:"Largura da mesa  L",v:L.toFixed(2).replace(".",",")+" m"},
        {k:"Comprimento da mesa  C",v:M.C.toFixed(2).replace(".",",")+" m",hi:true},
        {k:"Área útil da mesa  C × L",v:(M.C*L).toFixed(2).replace(".",",")+" m²"},
        {k:"Inclinação da mesa",v:incl.toFixed(0)+"°"+(incl>0?" descendente  (fator "+fIncl.toFixed(2).replace(".",",")+" na velocidade)":"  (horizontal)")+((M.vib&&incl<10)?"  ⚠ a capacidade de catálogo Vibraline é referida a 10° — com menos inclinação, reduzir a capacidade ou compensar por rotação/amplitude":""),hi:true},
        {k:"Tempo de residência na mesa  C / V",v:(M.C/V).toFixed(1).replace(".",",")+" s"},
        {k:"Altura de camada máxima  H_máx = "+hmaxF.toFixed(2).replace(".",",")+"·L",v:(Hmax*1000).toFixed(0)+" mm"},
        {k:"Altura de camada necessária  H = T/(3600·φ1·φ2·V·L)",v:(Hreq*1000).toFixed(0)+" mm"+(camadaOK?"  (OK ≤ H_máx — ajustar a comporta)":"  ⚠ acima de H_máx — usar modelo mais largo, maior V ou reduzir a vazão"),hi:true},
        {k:"Capacidade máx. da mesa nesta condição (V, H_máx)",v:capMaxGeom.toFixed(0)+" t/h"},
        {k:"Boca de saída do silo compatível (catálogo)",v:M.vib?"Bica/tremonha não é componente padrão do Vibraline — projetar para a instalação":M.boca+" mm"},
        {k:"Tamanho máx. de bloco do modelo",v:fmt(Math.round(M.fmax))+" mm"+(blocoOK?"  (atende F_máx)":"  ⚠ menor que F_máx — usar modelo maior")},
        {k:"Motorização do vibrador (catálogo)",v:M.kw.toFixed(1).replace(".",",")+" kW"+(M.kw<7?"  (~"+(M.kw/0.7457).toFixed(0)+" HP)":"  (2 vibradores, ~"+(M.kw/0.7457).toFixed(0)+" HP no total)"),hi:true},
        {sec:"Peso estimado do conjunto"},
        {k:"Mesa — fundo "+Afundo.toFixed(2).replace(".",",")+" m² + laterais "+Alat2.toFixed(2).replace(".",",")+" m² × "+espCh.toFixed(1).replace(".",",")+" mm",v:fmt(Math.round(mChapaCh))+" kg   (laterais de "+(hLat*1000).toFixed(0)+" mm"+((latIn>0)?", informada":", automática")+")"},
        {k:"Mesa com reforços, berço e travessas  (+"+pctRefCh.toFixed(0)+"%)",v:fmt(Math.round(mMesa))+" kg",hi:true},
        {k:"Motovibrador(es)  ("+nVib+" × "+kwUn.toFixed(1).replace(".",",")+" kW)",v:fmt(Math.round(mVibTot))+" kg   ("+Math.round(mVibUn)+" kg cada"+((mVibIn>0)?", informada":", estimada por m ≈ 95·P^0,85")+")",hi:true},
        {k:"Molas de suspensão e suportes  ("+nMolCh+" un)",v:fmt(Math.round(mMolas))+" kg"},
        {k:"Comporta de regulagem e manga flexível",v:temComp?(fmt(Math.round(mComp))+" kg"):"—  (sem comporta)"},
        {k:"PESO TOTAL ESTIMADO — VAZIO",v:fmt(Math.round(mVazioCh))+" kg  ·  "+(mVazioCh/1000).toFixed(2).replace(".",",")+" t",hi:true},
        {k:"Material sobre a mesa em operação",v:fmt(Math.round(mMatMesa))+" kg"},
        {k:"PESO TOTAL ESTIMADO — EM OPERAÇÃO",v:fmt(Math.round(mOperCh))+" kg  ·  "+(mOperCh/1000).toFixed(2).replace(".",",")+" t",hi:true},
        {k:"CARGA ESTÁTICA na estrutura de apoio",v:kNkg(Pest_ch),hi:true},
        {k:"CARGA DINÂMICA alternada  (± Fc, ka ≈ 1,5)",v:"± "+kNkg(FcCh)+"   a "+(rpm/60).toFixed(1).replace(".",",")+" Hz",hi:true},
        {k:"Carga por mola  (estática)",v:kNkg(PporMola)},
        {k:"Observação de pesos",v:"Estimativa de pré-projeto. A massa da mesa vem da geometria do modelo de catálogo e da espessura informada; a do motovibrador, de correlação empírica com a potência — substituir pelo peso real da folha de dados assim que o fornecedor for definido. As molas devem ser selecionadas em catálogo pela carga estática por unidade e pela frequência natural (f_op/f_n ≥ 4)."},
        {k:"Controle da vazão",v:"Regulável pela rotação (inversor de frequência), pela amplitude (contrapesos do vibrador) e pela posição da comporta (altura de camada H)."},
        {k:"Observação",v:"Pré-dimensionamento de calha/alimentador vibratório sob a boca do silo. A capacidade cresce com V (rpm/amplitude/inclinação), L e H, e é reduzida por φ1 (granulometria) e φ2 (umidade). Confirmar câmara/boca do silo, ângulo de fluxo (fluxo de massa) e o modelo na folha de dados do fabricante."}
      ];

  britador_conico:{
    titulo:"Britador Cônico — pré-dimensionamento",
    referencia:"Lei de Bond (3ª teoria da cominuição); método de capacidade do Manual de Britagem Metso/FAÇO (Q = QT·A·B·C·D, densidade ref. 1,6 t/m³) e tabela de capacidade × APF dos cones MP800/MP1000; catálogo Nordberg cônicos HP/MP; regras de câmara (Standard secundário / Cabeça curta terciário) e razão de redução; refs. Wills' Mineral Processing Technology, Gupta & Yan, 911Metallurgist, AMIT-135",
    campos:[
      {tipo:"head",label:"Alimentação e produto"},
      {id:"bcCham",label:"Câmara / estágio",tipo:"select",valor:"sec",onchange:"runCalc('britador_conico')",opcoes:[
        {v:"sec",t:"Standard / grossa — secundário (redução 4:1 a 6:1)"},
        {v:"ter",t:"Cabeça curta / fina — terciário (produto fino)"}]},
      {id:"bcFmax",label:"Maior bloco da alimentação  F_máx",unidade:"mm",tipo:"number",valor:180},
      {id:"bcF80",label:"F80 da alimentação (80% passante)",unidade:"mm",tipo:"number",valor:130},
      {id:"bcCSS",label:"APF — abertura na posição fechada (CSS)",unidade:"mm",tipo:"number",valor:25},
      {id:"bcQ",label:"Vazão de projeto",unidade:"t/h",tipo:"number",valor:400},
      {id:"bcRho",label:"Densidade aparente",unidade:"t/m³",tipo:"number",valor:1.6,step:"0.05"},
      {tipo:"head",label:"Material (Work Index de Bond)"},
      {id:"bcMat",label:"Material (preset — preenche o Wi)",tipo:"select",valor:"custom",onchange:"conePreset()",opcoes:[
        {v:"custom",t:"Personalizado"},
        {v:"calcario",t:"Calcário (Wi ~11)"},{v:"dolomita",t:"Dolomita (Wi ~11)"},{v:"carvao",t:"Carvão (Wi ~11)"},
        {v:"quartzito",t:"Quartzito (Wi ~12)"},{v:"minerio_ferro",t:"Minério de ferro (Wi ~13)"},{v:"minerio_cobre",t:"Minério de cobre (Wi ~14)"},
        {v:"gnaisse",t:"Gnaisse (Wi ~15)"},{v:"granito",t:"Granito (Wi ~16)"},{v:"basalto",t:"Basalto (Wi ~19)"}]},
      {id:"bcWi",label:"Work Index  Wi",unidade:"kWh/t",tipo:"number",valor:15,step:"0.5"},
      {tipo:"head",label:"Catálogo"},
      {id:"bcModel",label:"Modelo (Nordberg HP / MP)",tipo:"select",valor:"auto",opcoes:[
        {v:"auto",t:"Automático (pela boca e capacidade)"},
        {v:"HP200",t:"HP200 · 132 kW"},{v:"HP300",t:"HP300 · 220 kW"},{v:"HP400",t:"HP400 · 315 kW"},
        {v:"HP500",t:"HP500 · 355 kW"},{v:"HP800",t:"HP800 · 600 kW"},{v:"MP800",t:"MP800 · 600 kW"},{v:"MP1000",t:"MP1000 · 750 kW"}]}
    ],
    calcular:function(){
      var Fmax=num("bcFmax"),F80=num("bcF80"),CSS=num("bcCSS"),Q=num("bcQ"),rho=num("bcRho"),Wi=num("bcWi");
      var cham=$("#bcCham").value;
      if([Fmax,F80,CSS,Q,rho,Wi].some(function(x){return isNaN(x);})||Fmax<=0||F80<=0||CSS<=0||Q<=0||rho<=0||Wi<=0) return null;
      // Catálogo Nordberg cônicos HP/MP — boca da câmara (mm), potência (kW) e capacidade (t/h) × APF (ref. 1,6 t/m³)
      // MP800/MP1000: pontos médios da tabela do Manual de Britagem (Metso/FAÇO)
      var CN=[
        {n:"HP200",fo:185,foF:105,kw:132,cap:[[13,110],[16,140],[22,190],[25,215],[32,270]]},
        {n:"HP300",fo:230,foF:115,kw:220,cap:[[16,210],[19,250],[25,320],[32,410],[38,470]]},
        {n:"HP400",fo:285,foF:135,kw:315,cap:[[19,330],[25,450],[32,580],[38,680],[45,790]]},
        {n:"HP500",fo:300,foF:145,kw:355,cap:[[19,430],[25,590],[32,760],[38,890],[45,1030]]},
        {n:"HP800",fo:380,foF:180,kw:600,cap:[[25,900],[32,1120],[38,1300],[50,1600]]},
        {n:"MP800",fo:380,foF:200,kw:600,cap:[[13,540],[19,635],[25,858],[38,1193],[50,1698]]},
        {n:"MP1000",fo:430,foF:230,kw:750,cap:[[13,673],[19,810],[25,1063],[38,1563],[50,2125]]}
      ];
      function foOf(m){ return (cham==="ter")?m.foF:m.fo; }
      function capTab(m){ var c=m.cap,a0=c[0][0],aN=c[c.length-1][0],v; if(CSS<=a0)v=c[0][1]; else if(CSS>=aN)v=c[c.length-1][1]; else{ for(var j=1;j<c.length;j++){ if(CSS<=c[j][0]){ var t=(CSS-c[j-1][0])/(c[j][0]-c[j-1][0]); v=c[j-1][1]+t*(c[j][1]-c[j-1][1]); break; } } } return {q:v*(rho/1.6),amin:a0,amax:aN}; }
      var foReq=Fmax/0.8; // boca da câmara ≥ F_máx/0,8 (alimentação ≤ 80% da boca)
      var sel=$("#bcModel").value, M=null;
      if(sel!=="auto"){ for(var i=0;i<CN.length;i++){ if(CN[i].n===sel){ M=CN[i]; break; } } }
      if(!M){
        for(var i=0;i<CN.length;i++){ if(foOf(CN[i])>=foReq && capTab(CN[i]).q>=Q){ M=CN[i]; break; } }
        if(!M){ M=CN[CN.length-1]; }
      }
      var fo=foOf(M), ct=capTab(M), capM=ct.q;
      var insufFo=(fo<foReq), insufQ=(capM<Q);
      var cssNote=(CSS<ct.amin)?"  ⚠ APF abaixo do mínimo tabelado ("+ct.amin+" mm)":(CSS>ct.amax)?"  ⚠ APF acima do máximo tabelado ("+ct.amax+" mm)":"";
      var p80f=(cham==="ter")?0.85:1.0;
      var P80=p80f*CSS, topProd=1.7*CSS, R80=F80/P80, Rmax=(cham==="ter")?5:6;
      var P80um=P80*1000, F80um=F80*1000;
      var Wbond=10*Wi*(1/Math.sqrt(P80um)-1/Math.sqrt(F80um));
      var Pbond=Wbond*Q, potOK=(Pbond<=M.kw);
      var estagio=(cham==="ter")?"terciário (cabeça curta / fina)":"secundário (Standard / grossa)";
      var OUT=[
        {sec:"Câmara, alimentação e seleção"},
        {k:"Estágio / câmara",v:estagio,hi:true},
        {k:"Maior bloco da alimentação  F_máx",v:fmt(Math.round(Fmax))+" mm"},
        {k:"Boca da câmara requerida  ≥ F_máx/0,8",v:fmt(Math.round(foReq))+" mm  (alimentação ≤ 80% da boca)"},
        {k:"F80 da alimentação",v:fmt(Math.round(F80))+" mm"},
        {k:"Modelo selecionado (Nordberg HP/MP)",v:M.n+" · boca "+fo+" mm · motor "+M.kw+" kW"+(insufFo?"  ⚠ boca insuficiente p/ o bloco — usar maior":""),hi:true},
        {sec:"Razão de redução e produto"},
        {k:"APF (CSS) — abertura na posição fechada",v:fmt(Math.round(CSS))+" mm"},
        {k:"P80 estimado do produto  ≈ "+(p80f.toFixed(2).replace(".",","))+"·CSS",v:P80.toFixed(0)+" mm",hi:true},
        {k:"Top size estimado do produto  ≈ 1,7·CSS",v:topProd.toFixed(0)+" mm"},
        {k:"Razão de redução  R80 = F80 / P80",v:R80.toFixed(1).replace(".",",")+" : 1"+(R80>Rmax?"  ⚠ acima de ~"+Rmax+":1 — prever estágio adicional":"")},
        {sec:"Capacidade"},
        {k:"Capacidade (catálogo, interpolada por APF)",v:capM.toFixed(0)+" t/h"+(insufQ?"  ⚠ abaixo da vazão de projeto — usar modelo maior":"")+cssNote,hi:true},
        {k:"Faixa de APF tabelada do modelo ("+M.n+")",v:ct.amin+" a "+ct.amax+" mm"},
        {k:"Vazão de projeto",v:Q.toFixed(0)+" t/h"},
        {k:"Observação de capacidade",v:"Capacidade de catálogo (ref. 1,6 t/m³, alimentação afogada/choke feed), interpolada pela APF e corrigida pela densidade. O método do manual aplica ainda fatores A·B·C·D (umidade, argila, finos e britabilidade) — reduzir a capacidade conforme o material."},
        {sec:"Potência (lei de Bond)"},
        {k:"Work Index  Wi",v:Wi.toFixed(1).replace(".",",")+" kWh/t"},
        {k:"Consumo específico  W = 10·Wi·(1/√P80 − 1/√F80)",v:Wbond.toFixed(3).replace(".",",")+" kWh/t"},
        {k:"Potência de britagem  P = W · Q",v:Pbond.toFixed(1).replace(".",",")+" kW · "+(Pbond/0.7457).toFixed(0)+" HP",hi:true},
        {k:"Potência do motor de catálogo ("+M.n+")",v:M.kw+" kW"+(potOK?"  (atende)":"  ⚠ abaixo da potência de Bond — rever modelo/CSS"),hi:true},
        {k:"Observação",v:"Pré-dimensionamento — britador cônico por compressão (câmara afogada). Manter alimentação distribuída em 360° e ≤ 80% da boca; confirmar câmara, APF, curva granulométrica e motorização no catálogo do fabricante. P80 depende da câmara e do perfil dos revestimentos."}
      ];
      OUT.geo={tipo:"conico",model:M.n,fo:fo,CSS:CSS,Fmax:Fmax,R80:R80,cap:capM,Pbond:Pbond,kw:M.kw,P80:P80,estagio:(cham==="ter")?"terciário":"secundário"};
      return OUT;
    }
  },

        {k:"Rotação do rotor  n = v·60/(π·D)",v:n_rpm.toFixed(0)+" rpm"},

        {k:"Capacidade nominal do modelo (catálogo)",v:M.cap.toFixed(0)+" t/h"+(insufQ?"  ⚠ abaixo da vazão de projeto — usar modelo maior":""),hi:true},
        {k:"Vazão de projeto",v:Q.toFixed(0)+" t/h"},
        {k:"Observação de capacidade",v:"Capacidade de catálogo (ref. baixa dureza, seco, 1,6 t/m³) — confirmar no fabricante (FLSmidth EV, Hazemag, thyssenkrupp)."},
        {sec:"Potência (lei de Bond)"},
        {k:"Work Index  Wi",v:Wi.toFixed(1).replace(".",",")+" kWh/t"},
        {k:"Consumo específico  W = 10·Wi·(1/√P80 − 1/√F80)",v:Wbond.toFixed(3).replace(".",",")+" kWh/t"},
        {k:"Potência de britagem  P = W · Q",v:Pbond.toFixed(1).replace(".",",")+" kW · "+(Pbond/0.7457).toFixed(0)+" HP",hi:true},
        {k:"Potência instalada do modelo (" +M.n+")",v:M.kw+" kW"+(potOK?"  (atende)":"  ⚠ abaixo da potência de Bond"),hi:true},
        {k:"Observação",v:"A potência instalada cobre a ineficiência do impacto/atrito e a inércia do rotor. Britador de martelos só para materiais NÃO abrasivos (calcário, gesso, carvão, cal)."}
      ];
      OUT.geo={tipo:"martelo",model:M.n,D:M.D,L:M.L,Fmax:Fmax,grelha:grelha,R80:R80,cap:M.cap,Pbond:Pbond,kw:M.kw,P80:P80,nrpm:n_rpm};
      return OUT;
    }
  }
};

/* Restaura todos os campos de uma calculadora aos valores padrão do registro CALCS */
function resetCampos(id){
  var calc=CALCS[id]; if(!calc) return;
  calc.campos.forEach(function(f){
    if(!f.id||f.tipo==="head") return;
    var el=document.getElementById(f.id); if(!el) return;
    if(f.valor!==undefined&&f.valor!==null) el.value=f.valor;
  });
  runCalc(id);
}

/* ---------- Proteção dos campos numéricos contra a roda do mouse ----------
   Em <input type="number"> com foco, o navegador incrementa/decrementa o valor quando a
   roda do mouse passa por cima. Em formulários longos como os das calculadoras isso muda
   dados de entrada silenciosamente durante a rolagem da página. O listener abaixo tira o
   foco do campo no início da rolagem, impedindo a alteração. */
document.addEventListener("wheel",function(ev){
  var el=document.activeElement;
  if(el&&el.tagName==="INPUT"&&el.type==="number"){ el.blur(); }
},{passive:true,capture:true});
document.addEventListener("focusin",function(ev){
  var el=ev.target;
  if(el&&el.tagName==="INPUT"&&el.type==="number"&&!el.dataset.nw){
    el.dataset.nw="1";
    el.addEventListener("wheel",function(e){ e.preventDefault(); this.blur(); },{passive:false});
  }
});

  LANG=l; try{ localStorage.setItem("pa_lang",l); }catch(e){}

function buildMenu(){
  const menu=DB.meta.menu||[];
  const nG=x=>DB.equipamentos.filter(e=>e.grupo===x).length;
  const nS=(x,y)=>DB.equipamentos.filter(e=>e.grupo===x&&e.subgrupo===y).length;
  $("#menu").innerHTML=menu.map(g=>{
    const subs=(g.subgrupos||[]).map(s=>`<button class="navitem" data-grupo="${g.grupo}" data-sub="${s}"><span>${nomeSub(s)}</span><span class="n">${nS(g.grupo,s)}</span></button>`).join("");
    return `<div class="grp open" data-grp="${g.grupo}"><button class="grphead" data-grupo="${g.grupo}"><span class="navdot" style="--gc:${corGrupo(g.grupo)}"></span><span>${nomeGrupo(g.grupo)}</span><span class="n">${nG(g.grupo)}</span><span class="arrow">›</span></button><div class="subs">${subs}</div></div>`;
  }).join("");
  document.querySelectorAll(".grphead").forEach(b=>b.addEventListener("click",()=>{b.closest(".grp").classList.toggle("open");selectFilter(b.dataset.grupo,"");}));
  document.querySelectorAll(".subs .navitem").forEach(b=>b.addEventListener("click",()=>{selectFilter(b.dataset.grupo,b.dataset.sub);closeDrawer();}));
  $(".navitem.all").addEventListener("click",()=>{selectFilter("","");closeDrawer();});

function selectFilter(g,s){
  curGrupo=g;curSub=s;
  document.querySelectorAll(".navitem,.grp").forEach(n=>n.classList.remove("active"));
  if(!g){$(".navitem.all").classList.add("active");}
  else{const grp=document.querySelector(`.grp[data-grp="${CSS.escape(g)}"]`);if(grp)grp.classList.add("active","open");
    if(s){const el=document.querySelector(`.subs .navitem[data-grupo="${CSS.escape(g)}"][data-sub="${CSS.escape(s)}"]`);if(el)el.classList.add("active");}}
  render();
}

var curBusca="";
function render(){
  const q=curBusca.trim().toLowerCase();
  const list=DB.equipamentos.filter(e=>{
    if(curGrupo&&e.grupo!==curGrupo) return false;
    if(curSub&&e.subgrupo!==curSub) return false;
    if(!q) return true;
    const alvo=[e.modelo,e.modelo_en,e.grupo,nomeGrupo(e.grupo),e.subgrupo,nomeSub(e.subgrupo),e.subtipo,e.resumo,e.resumo_en,(e.normas||[]).join(" ")].join(" ").toLowerCase();
    return q.split(/\s+/).every(t=>alvo.indexOf(t)>=0);
  });
  $("#count").textContent=list.length+" "+(list.length!==1?t("up"):t("un"));
  $("#title").textContent=q?(t("buscaT")+curBusca):(curSub?nomeSub(curSub):(curGrupo?nomeGrupo(curGrupo):t("titulo")));
  $("#subtitle").textContent=q?(list.length+" "+(list.length!==1?t("resN"):t("res1"))):t("sub");
  $("#grid").innerHTML=list.map(e=>{
    const idx=DB.equipamentos.indexOf(e);
    const nrm=(e.normas||[]).map(n=>`<span>${n}</span>`).join("");
    return `<div class="card" style="--acc:${corGrupo(e.grupo)};animation-delay:${(-idx*0.37).toFixed(2)}s" onclick="openItem(${idx})">
      <div class="top"><div class="icon">${icon(e)}</div>
        <div style="min-width:0"><div class="cat">${nomeGrupo(e.grupo)} · ${nomeSub(e.subgrupo)}</div><h3>${nomeModelo(e)}</h3></div></div>
      <div class="desc">${resumoDe(e)}</div>
      <div class="norms">${nrm}</div>
      ${e.calculadora
        ?'<div class="go"><span>'+t("abrir")+'</span><span class="arw">→</span></div>'
        :'<div class="go soon"><span>'+t("soon")+'</span><span class="arw">⋯</span></div>'}
    </div>`;
  }).join("")||'<div class="empty">'+(q?(t("vazioQ")+curBusca+'".'):t("vazioG"))+'</div>';
}

function openItem(i){
  const e=DB.equipamentos[i];
  CUR_EQ=e;
  const calc=CALCS[e.calculadora];
  if(!calc){
    $("#sheet").innerHTML=`
      <div class="head"><div class="ic">${icon(e)}</div>
        <div><h2>${e.modelo}</h2><div class="sub">${e.subtipo}</div></div>
        <button class="close" onclick="closeModal()">×</button></div>
      <div class="calcbody"><div class="inputs">
        <div class="placeholder" style="padding:8px 0"><b>Calculadora em desenvolvimento.</b><br>${e.descricao||""}</div>
        <div class="note">Referência prevista: ${e.referencia||"—"}</div>
      </div></div>`;
    $("#modal").classList.add("open");
    return;
  }
  if(!calc.campos[0]||calc.campos[0].id!=="eqTag"){ calc.campos.unshift({id:"eqTag",label:"TAG (identificação do equipamento)",tipo:"text",valor:"",placeholder:"ex.: PN-101 / TC-201"}); }
  const campos=calc.campos.map(f=>{
    if(f.tipo==="head"){return `<div class="fhead">${f.label}</div>`;}
    if(f.tipo==="text"){
      return `<div class="field"><label>${f.label}</label><input id="${f.id}" type="text" value="${f.valor||""}" placeholder="${f.placeholder||""}"/></div>`;
    }
    const auto=`runCalc('${e.calculadora}')`, autoSoft=`runCalc('${e.calculadora}',1)`;
    if(f.tipo==="select"){
      const eatt=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const ops=f.opcoes.map(o=>`<option value="${eatt(o.v)}"${o.v===f.valor?" selected":""}>${o.t}</option>`).join("");
      return `<div class="field"><label>${f.label}</label><select id="${f.id}" onchange="${f.onchange||auto}">${ops}</select></div>`;
    }
    return `<div class="field"><label>${f.label} ${f.unidade?`<span class="u">(${f.unidade})</span>`:""}</label>
      <input id="${f.id}" type="number" value="${f.valor}" step="${f.step||"any"}" oninput="${autoSoft}" onchange="${auto}"/></div>`;
  }).join("");
  $("#sheet").innerHTML=`
    <div class="head"><div class="ic">${icon(e)}</div>
      <div><h2>${e.modelo}</h2><div class="sub">${e.subtipo} · pré-dimensionamento</div></div>
      <button class="close" onclick="closeModal()">×</button></div>
    <div class="calcbody">
      <div class="inputs"><div class="sec-t">Dados de entrada</div>${campos}
        <button class="btn" onclick="runCalc('${e.calculadora}')">Calcular</button>
        <button class="btn btn2" onclick="gerarRelatorio()">Gerar relatório (PDF)</button>
        <button class="btn btn2" onclick="resetCampos('${e.calculadora}')" title="Restaura todos os campos aos valores padrão da calculadora">Restaurar padrões</button>
        ${ANIM[e.calculadora]||""}
      </div>
      <div class="results" id="results"><div class="sec-t">Resultados</div>
        <div class="placeholder">Preencha os dados e clique em <b>Calcular</b>.</div>
        <div class="note">Referência: ${calc.referencia}</div></div>
    </div>`;
  $("#modal").classList.add("open");
  runCalc(e.calculadora);
}
function runCalc(id,soft){
  const calc=CALCS[id];const r=calc.calcular();
  const box=$("#results");
  if(!r){if(soft&&box.querySelector("table.res"))return;box.innerHTML=`<div class="sec-t">Resultados</div><div class="placeholder">Verifique os dados de entrada (valores positivos).</div><div class="note">Referência: ${calc.referencia}</div>`;return;}
  const rows=r.map(x=> x.sec
    ? `<tr><td colspan="2" style="padding:16px 6px 6px;color:var(--teal-d);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--teal)">${x.sec}</td></tr>`
    : `<tr class="${x.hi?"highlight":""}"><td class="k">${x.k}</td><td class="v">${x.v}</td></tr>`).join("");
  box.innerHTML=`<div class="sec-t">Resultados</div><table class="res">${rows}</table>
    <div class="note">Estimativa de <b>pré-dimensionamento</b>. A seleção SEW usa torques nominais aproximados de catálogo — confirmar a escolha final no <a href="https://www.sew-eurodrive.com" target="_blank" rel="noopener">configurador oficial SEW</a>.<br><b>Resultado final majorado em 20%</b> (margem de projeto) — a seleção do motor/redutor SEW considera a potência majorada.<br>Referência: ${calc.referencia} · SEW-EURODRIVE (série R / motores DRN).</div>`;
}
