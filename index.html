    // linhas de cota
    doc.setDrawColor(30,155,196); doc.setLineWidth(0.3); doc.setTextColor(30,120,150); doc.setFontSize(8);
    var dy=topY-7; doc.line(cx-wH,dy,cx+wH,dy); doc.line(cx-wH,dy-1.6,cx-wH,dy+1.6); doc.line(cx+wH,dy-1.6,cx+wH,dy+1.6);
    doc.text((G.tipo==="ret"?"a = ":"D = ")+san(G.D.toFixed(2))+" m",cx,dy-1.2,{align:"center"});
    var rx=cx+wH+9; doc.line(rx,topY,rx,transY); doc.line(rx-1.6,topY,rx+1.6,topY); doc.line(rx-1.6,transY,rx+1.6,transY);
    doc.text("H = "+san(G.Hcil.toFixed(2))+" m",rx+2,(topY+transY)/2+1);
    doc.line(rx,transY,rx,botY); doc.line(rx-1.6,transY,rx+1.6,transY); doc.line(rx-1.6,botY,rx+1.6,botY);
    doc.text("hc = "+san(G.hc.toFixed(2))+" m",rx+2,(transY+botY)/2+1);
    var lx=cx-wH-9; doc.line(lx,topY,lx,botY); doc.line(lx-1.6,topY,lx+1.6,topY); doc.line(lx-1.6,botY,lx+1.6,botY);
    doc.text("Htot = "+san(G.Htot.toFixed(2))+" m",lx-2,(topY+botY)/2+1,{align:"right"});
    var by=botY+7; doc.line(cx-oH,by,cx+oH,by); doc.line(cx-oH,by-1.6,cx-oH,by+1.6); doc.line(cx+oH,by-1.6,cx+oH,by+1.6);
    doc.text("B = "+san(String(Math.round(G.Brec*1000)))+(G.tipo==="ret"&&G.cunha?(" x "+String(Math.round(G.Bl*1000))):"")+" mm",cx,by+4,{align:"center"});
    if(G.tipo==="ret"){
      // cotas extras do retangular: angulos de face, vale, chapas, cintas e montantes
      doc.text("face "+san(G.alfaB.toFixed(0))+"°",cx+oH+4,botY-3);
      doc.setTextColor(G.flowShallow?200:30,G.flowShallow?60:120,G.flowShallow?60:150);
      doc.text((G.regPlano?"FACE ":"VALE ")+san(G.alfaGov.toFixed(0))+"° (exig. "+san(G.alfaFlow.toFixed(0))+"°)",cx-oH-4,botY-3,{align:"right"});
      doc.setTextColor(30,120,150);
      // CINTAS horizontais (traço cheio, ultrapassando a parede) — a cada s
      doc.setDrawColor(200,120,40); doc.setLineWidth(0.7);
      var nc=Math.max(1,Math.min(G.nCintas,12)), passo=(transY-topY)/(nc+1);
      for(var ic=1;ic<=nc;ic++){ var yc=topY+passo*ic; doc.line(cx-wH-2.5,yc,cx+wH+2.5,yc); }
      doc.setFontSize(6.5); doc.setTextColor(190,110,30);
      doc.text(san(String(G.nCintas))+" cintas @ "+san(G.sst.toFixed(2))+" m",cx+wH+4,topY+passo+2);
      doc.text(san(G.perfilCinta),cx+wH+4,topY+passo+6);
      // ENRIJECEDORES verticais (tracejado fino entre as cintas)
      doc.setDrawColor(90,120,150); doc.setLineWidth(0.35);
      var nv=5;
      for(var iv=1;iv<=nv;iv++){ var xv=cx-wH+(2*wH)*iv/(nv+1); for(var yy=topY+1;yy<transY-1;yy+=3){ doc.line(xv,yy,xv,Math.min(yy+1.6,transY-1)); } }
      doc.setFontSize(6.5); doc.setTextColor(80,110,140);
      doc.text("enrijecedores verticais: "+san(G.perfilEnr),cx-wH-3,transY+4,{align:"right"});
      // montantes
      doc.setDrawColor(20,40,60); doc.setLineWidth(0.9);
      doc.line(cx-wH+3,botY,cx-wH+3,botY+G_LEG); doc.line(cx+wH-3,botY,cx+wH-3,botY+G_LEG);
      doc.setFontSize(6.5); doc.setTextColor(110,140,165);
      doc.text(san(String(G.Ncol))+" montantes · L = "+san(G.Hleg.toFixed(1))+" m",cx,botY+G_LEG+4,{align:"center"});
      doc.text(san(G.perfilCol),cx,botY+G_LEG+8,{align:"center"});
      // espessuras indicadas na parede e na tremonha
      doc.setFontSize(6.5); doc.setTextColor(60,90,120);
      doc.text("chapa "+san(G.tcom.toFixed(1))+" mm",cx-wH-3,(topY+transY)/2,{align:"right",angle:90});
      doc.text("chapa "+san(G.thopcom.toFixed(1))+" mm",cx+oH+6,(transY+botY)/2+4);
      doc.setFontSize(8); doc.setTextColor(30,120,150);
    } else {
      doc.text("ang. moega "+san(G.alfa.toFixed(0))+"°",cx+oH+4,botY-3);
    }
    // legenda com as medidas resultantes
    var legBody=[];
    if(G.tipo==="ret"){
      legBody.push([san("Seção interna  a × b"),san(G.D.toFixed(2))+" × "+san(G.b.toFixed(2))+" m"]);
      legBody.push([san("Altura 1 — parte reta  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura 2 — tremonha  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Tipo de tremonha"),G.cunha?"Cunha (fenda) — fluxo plano":"Piramidal — fluxo cônico"]);
      legBody.push([san("Boca de descarga"),G.cunha?(san(String(Math.round(G.Brec*1000)))+" × "+san(String(Math.round(G.Bl*1000)))+" mm"):(san(String(Math.round(G.Brec*1000)))+" mm")]);
      legBody.push([san("Ângulo de face (a / b)"),san(G.alfaA.toFixed(0))+"° / "+san(G.alfaB.toFixed(0))+"°"]);
      legBody.push([san("GOVERNA O FLUXO — "+G.govNome+(G.regPlano?" (regime plano)":" (axissimetrico)")),san(G.alfaGov.toFixed(0))+"°  (exigido "+san(G.alfaFlow.toFixed(0))+"°)"+(G.flowShallow?"  (!) RASO":"  OK")]);
      legBody.push([san("Volume útil requerido / da geometria"),san(G.Vutil.toFixed(1))+" / "+san(G.Vgeo.toFixed(1))+" m³"]);
      legBody.push([san("Pressão horizontal de projeto  ph,d"),san(G.phD.toFixed(1))+" kPa"]);
      legBody.push([san("Chapa da parede (lado a / lado b)"),san(G.tA.toFixed(1))+" / "+san(G.tB.toFixed(1))+" mm"]);
      legBody.push([san("Chapa da tremonha"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Enrijecedores — espaçamento  s"),san(G.sst.toFixed(2))+" m"+(G.otimS?"  (otimizado)":"")]);
      legBody.push([san("Cintas — quantidade / W requerido"),san(String(G.nCintas))+" un / "+san(String(Math.round(G.Wreq)))+" cm³"]);
      legBody.push([san("PERFIL DA CINTA"),san(G.perfilCinta)]);
      legBody.push([san("Cinta — alternativas"),san(G.altCinta||"-")]);
      legBody.push([san("PERFIL DO ENRIJECEDOR VERTICAL"),san(G.perfilEnr)]);
      legBody.push([san("Enrijecedor — alternativas"),san(G.altEnr||"-")]);
      legBody.push([san("Cinta — inércia p/ pressão externa  I"),san(G.Ireq.toFixed(0))+" cm⁴"]);
      legBody.push([san("Vento (Vk) · sucção · vácuo"),san(G.Vk.toFixed(1))+" m/s · "+san(G.pvento.toFixed(2))+" · "+san(G.pvac.toFixed(1))+" kPa"]);
      legBody.push([san("Pressão externa de projeto  q_ext"),san(G.qext.toFixed(2))+" kPa"]);
      legBody.push([san("Montantes — quantidade"),san(String(G.Ncol))+(G.otimN?"  (otimizado)":"")]);
      legBody.push([san("Montante — carga / área / raio de giração"),san(String(Math.round(G.Pcol)))+" kN / "+san(G.Areq.toFixed(0))+" cm² / "+san(G.imin.toFixed(1))+" cm"]);
      legBody.push([san("PERFIL DO MONTANTE"),san(G.perfilCol)]);
      legBody.push([san("Montante — alternativas"),san(G.altMont||"-")]);
      legBody.push([san("PESO SECO DO SILO (estrutura)"),san((G.pesoSeco/1000).toFixed(1))+" t"]);
      legBody.push([san("Material armazenado (cheio)"),san((G.pesoMat/1000).toFixed(1))+" t"]);
      legBody.push([san("PESO TOTAL COM SILO CHEIO"),san((G.pesoCheio/1000).toFixed(1))+" t"]);
      legBody.push([san("Altura livre dos montantes  L"),san(G.Hleg.toFixed(1))+" m"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }else{
      legBody.push([san("Diâmetro interno  D"),san(G.D.toFixed(2))+" m"]);
      legBody.push([san("Altura cilíndrica  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura da moega (tremonha)  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Lado da boca de descarga  B"),san(String(Math.round(G.Brec*1000)))+" mm"]);
      legBody.push([san("Ângulo da moega (com a horizontal)"),san(G.alfa.toFixed(0))+"°"]);
      legBody.push([san("Volume útil de armazenagem"),san(G.Vutil.toFixed(1))+" m³"]);
      legBody.push([san("Espessura da chapa do corpo"),san(G.tcom.toFixed(1))+" mm"]);
      legBody.push([san("Espessura da chapa da moega"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }
    doc.autoTable({startY:botY+(G.tipo==="ret"?26:16),theme:"grid",margin:{left:14,right:14},
      head:[["Medida resultante do cálculo","Valor"]],
      body:legBody,
      headStyles:{fillColor:[22,38,60],textColor:255,fontSize:9},bodyStyles:{fontSize:8.5},
      alternateRowStyles:{fillColor:[244,247,250]},
      columnStyles:{0:{cellWidth:120},1:{cellWidth:62,halign:"right",fontStyle:"bold"}}});
    doc.setFontSize(7); doc.setTextColor(110);
    doc.text(san("Croqui esquemático (fora de escala) — medidas resultantes do pré-dimensionamento."),14,doc.lastAutoTable.finalY+6);
    }
    doc.setFontSize(7); doc.setTextColor(150);
    doc.text("ProjectARK Engenharia · Dimensionamento de Equipamentos",14,290);
  }
  doc.save("ProjectARK-"+CUR_EQ.calculadora+".pdf");
}
function closeModal(){$("#modal").classList.remove("open");}
var _bt=null;
$("#busca").addEventListener("input",function(){
  clearTimeout(_bt); var v=this.value;
  _bt=setTimeout(function(){ curBusca=v; if(v.trim()){curGrupo="";curSub="";
    document.querySelectorAll(".navitem,.grp").forEach(n=>n.classList.remove("active"));} render(); },120);
});
$("#lang-pt").addEventListener("click",function(){setLang("pt");});
$("#lang-en").addEventListener("click",function(){setLang("en");});
$("#burger").addEventListener("click",openDrawer);
$("#overlay").addEventListener("click",closeDrawer);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();}});

fetch("equipamentos.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  DB=d;
  $("#hver").textContent=d.meta.versao;
  setLang(LANG);
  $("#foot").textContent="ProjectARK · Pré-dimensionamento de Equipamentos · v"+d.meta.versao;
  buildMenu();render();
}).catch(()=>{$("#grid").innerHTML='<p style="color:#b33">Erro ao carregar equipamentos.json — abra via servidor (GitHub Pages).</p>';});
</script>
