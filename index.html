<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectARK · Pré-dimensionamento de Equipamentos</title>
<style>
  :root{
    --navy:#0E1B2E; --navy2:#16263d; --navy3:#1d3047;
    --teal:#1E9BC4; --teal-d:#16789a; --gold:#D9A94A;
    --bg:#eef1f4; --card:#ffffff; --ink:#1c2733; --muted:#5f6b78; --line:#d7dde3;
    --ok:#2e8b4f; --okbg:#e7f4ec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:var(--teal-d)}
  header{position:sticky;top:0;z-index:40;background:#0e1b2e;border-bottom:3px solid var(--gold);padding:7px 18px;display:flex;align-items:center;gap:18px}
  .emblem{height:58px;display:block;flex:none}
  .wm .l1{font-size:1.32rem;font-weight:800;line-height:1.08;letter-spacing:.2px}
  .wm .l1 .p{color:#f4f7fa}.wm .l1 .a{color:#1E9BC4}.wm .l1 .e{color:#D9A94A}
  .wm .l2{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:#1E9BC4;margin-top:2px}
  .burger{display:none;background:var(--navy2);border:1px solid var(--navy3);color:#fff;width:40px;height:40px;border-radius:7px;font-size:1.2rem;cursor:pointer;flex:none}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:42px;height:42px;flex:none}
  .brand .t1{font-size:1.25rem;font-weight:800}
  .brand .t1 .p{color:#f4f7fa}.brand .t1 .a{color:var(--teal)}
  .brand .t2{font-size:.62rem;letter-spacing:.26em;color:var(--gold);font-weight:600}
  .htag{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#9fb2c4;font-size:.72rem;text-align:right}
  .layout{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:30}
  .overlay.open{display:block}
  aside{width:264px;flex:none;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 65px);padding:14px 0}
  aside h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 16px 8px}
  .navitem{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:8px 16px;cursor:pointer;font-size:.9rem;border-left:3px solid transparent}
  .navitem.all{font-weight:700}
  .navitem:hover{background:#f1f5f8;color:var(--teal-d)}
  .navitem.active{background:#eaf4f8;color:var(--teal-d);border-left-color:var(--gold);font-weight:600}
  .grphead{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;color:var(--ink);padding:10px 16px;cursor:pointer;font-size:.92rem;font-weight:700;border-left:3px solid transparent}
  .grphead:hover{background:#f1f5f8}
  .grp.active>.grphead{border-left-color:var(--gold);color:var(--teal-d)}
  .grp.open .arrow{transform:rotate(90deg)}
  .arrow{color:var(--muted);transition:.15s;font-size:.8rem}
  .subs{display:none}.grp.open .subs{display:block}
  .subs .navitem{padding-left:34px;font-size:.85rem;color:var(--muted)}
  .subs .navitem.active{color:var(--teal-d)}
  main{flex:1;min-width:0;padding:0 20px 60px}
  .crumb{padding:14px 2px 6px;color:var(--muted);font-size:.82rem}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .toolbar h1{font-size:1.25rem;margin:0;flex:1;min-width:200px}
  .count{color:var(--muted);font-size:.84rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start}
  .card:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(14,27,46,.08);transform:translateY(-2px)}
  .card .icon{width:46px;height:46px;flex:none;color:var(--navy);background:#eef4f8;border:1px solid var(--line);border-radius:8px;padding:7px}
  .card .cat{font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-d);font-weight:700}
  .card h3{margin:2px 0 4px;font-size:1.02rem}
  .card .desc{color:var(--muted);font-size:.82rem}
  .card .calcflag{display:inline-block;margin-top:7px;font-size:.68rem;font-weight:700;color:var(--teal-d);background:#e8f5fa;border:1px solid #bfe3f0;border-radius:20px;padding:2px 8px}
  .card .calcflag.soon{color:#8a6d1f;background:#fbf3df;border-color:#ecd9a6}

  .modal{position:fixed;inset:0;background:rgba(14,27,46,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
  .modal.open{display:flex}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:880px;width:100%;padding:0;overflow:hidden}
  .sheet .head{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px}
  .sheet .head .ic{width:40px;height:40px;color:var(--gold)}
  .sheet .head h2{margin:0;font-size:1.2rem}
  .sheet .head .sub{color:#9fb2c4;font-size:.82rem}
  .sheet .head .close{margin-left:auto;background:none;border:none;color:#9fb2c4;font-size:1.7rem;cursor:pointer;line-height:1}
  .calcbody{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .inputs{padding:20px 24px;border-right:1px solid var(--line)}
  .results{padding:20px 24px;background:#f7f9fb}
  .sec-t{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);font-weight:700;margin:0 0 12px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
  .fhead{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);font-weight:700;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .field .u{color:#9aa6b2;font-weight:400}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:.92rem;color:var(--ink);background:#fff}
  .field input:focus,.field select:focus{outline:2px solid var(--teal)}
  .btn{width:100%;margin-top:6px;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.95rem;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--teal-d)}
  .btn2{background:#fff;color:var(--teal-d);border:1px solid var(--teal);margin-top:8px}
  .btn2:hover{background:#eef7fb}
  .vid{margin-top:18px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0e1b2e}
  .vid svg{width:100%;height:auto;display:block}
  .vid .cap{color:#9fb2c4;font-size:.72rem;text-align:center;padding:7px 8px;border-top:1px solid #22344a}
  table.res{width:100%;border-collapse:collapse;font-size:.9rem}
  table.res td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.res td.k{color:var(--muted)}
  table.res td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .highlight td{background:#eef9f1}
  .highlight td.v{color:var(--ok)}
  .placeholder{color:var(--muted);font-size:.9rem;text-align:center;padding:30px 10px}
  .note{font-size:.76rem;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  footer{background:var(--navy);color:#9fb2c4;font-size:.8rem;padding:16px 20px;text-align:center;border-top:3px solid var(--gold)}
  @media(max-width:900px){.burger{display:block}.emblem{height:46px}.wm .l1{font-size:1.05rem}.wm .l2{font-size:.62rem}aside{position:fixed;top:72px;left:0;height:calc(100% - 72px);transform:translateX(-100%);transition:.22s;z-index:35}aside.open{transform:translateX(0)}.htag{display:none}.calcbody{grid-template-columns:1fr}.inputs{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <button class="burger" id="burger">☰</button>
  <div class="brand">
    <img class="emblem" src="logo1.png.png?v=2" alt="ProjectArk" />
    <div class="wm">
      <div class="l1"><span class="p">Project</span><span class="a">ARK</span> <span class="e">Engenharia</span></div>
    </div>
  </div>
  <div class="htag" id="htag"></div>
</header>

<div class="overlay" id="overlay"></div>
<div class="layout">
  <aside id="drawer">
    <h2>Equipamentos</h2>
    <button class="navitem all active" data-all="1">Todos</button>
    <div id="menu"></div>
  </aside>
  <main>
    <div class="toolbar"><h1 id="title">Dimensionamento de Equipamentos</h1><span class="count" id="count"></span></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<footer id="foot">ProjectARK · Pré-dimensionamento de Equipamentos</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
let DB={meta:{},equipamentos:[]};
let curGrupo="",curSub="",CUR_EQ=null;
const REPORT_LOGO=new Image(); REPORT_LOGO.src="logo2.png";
const $=s=>document.querySelector(s);
const ICON_SCREW='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="18" width="36" height="12" rx="6"/><path d="M10 24c3-5 6 5 9 0s6 5 9 0 6 5 9 0"/></svg>';
const ICON_BELT='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="13" cy="28" r="6"/><circle cx="35" cy="28" r="6"/><path d="M13 22 H35 M13 34 H35"/><path d="M18 18 l4 4 4-4" /></svg>';
const ICON_FLEX='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="35" r="5"/><circle cx="37" cy="13" r="5"/><path d="M12 30 L37 8 M12 40 L37 18"/><path d="M22 31 l3 4 4-3"/></svg>';
const ICON_SILO='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 16 v20 M34 16 v20"/><path d="M14 16 a10 5 0 0 1 20 0"/><path d="M14 36 l10 8 10 -8"/><path d="M19 16 v20 M24 16 v22 M29 16 v20"/></svg>';
const ICON_TUBE='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="32" width="14" height="9" rx="4.5"/><rect x="28" y="9" width="14" height="9" rx="4.5" transform="rotate(32 35 13.5)"/><path d="M16 34 L30 18"/><circle cx="11" cy="36.5" r="1.6" fill="currentColor"/><circle cx="20" cy="29" r="1.6" fill="currentColor"/><circle cx="28" cy="20" r="1.6" fill="currentColor"/></svg>';
const ICON_BUCKET='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 8 v32 M32 8 v32"/><path d="M16 14 h7 a4 4 0 0 1 4 4 v3 h-11 z"/><path d="M16 26 h7 a4 4 0 0 1 4 4 v3 h-11 z"/><path d="M32 18 h6 a4 4 0 0 1 4 4 v3 h-10 z"/></svg>';
const ICON_JAW='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 10 L18 30 L18 38"/><path d="M38 10 L26 30 L26 38"/><path d="M10 10 L38 10"/><circle cx="14" cy="20" r="1.6" fill="currentColor"/><circle cx="24" cy="16" r="1.6" fill="currentColor"/><circle cx="34" cy="20" r="1.6" fill="currentColor"/></svg>';
const ICON_IMPACT='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="24" cy="26" r="11"/><path d="M24 26 L24 17 M24 26 L32 31 M24 26 L16 31"/><path d="M22 8 h4 v6 h-4 z"/><path d="M40 24 l4 -2 M40 30 l4 2 M8 24 l-4 -2"/></svg>';
const ICON_HAMMER='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="24" cy="22" r="10"/><circle cx="24" cy="22" r="2.4" fill="currentColor"/><path d="M24 12 l5 -5 M24 32 l-5 5 M34 22 l5 -5 M14 22 l-5 5"/><path d="M12 40 h24 M14 40 v-2 M20 40 v-2 M26 40 v-2 M32 40 v-2"/></svg>';
const ICON_CONE='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 12 L39 12 L30 30 L18 30 Z"/><path d="M24 8 L24 12 M20 33 L28 33 L26 40 L22 40 Z"/><path d="M18 30 L24 18 L30 30" fill="currentColor" fill-opacity="0.15"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/><circle cx="24" cy="8" r="1.4" fill="currentColor"/><circle cx="34" cy="9" r="1.4" fill="currentColor"/></svg>';
/* Materiais típicos para arraste tubular (densidade aparente e atritos) */
const TUB_MAT={
  briq_bar:{rho:1.70,mum:"0.5",muc:"0.3",dim:60},
  briq_bricao:{rho:1.30,mum:"0.5",muc:"0.3",dim:120},
  briq_carb:{rho:0.80,mum:"0.5",muc:"0.3",dim:50},
  briq_ferro:{rho:2.50,mum:"0.6",muc:"0.35",dim:100},
  carvao:{rho:0.85,mum:"0.5",muc:"0.3",dim:50},
  coque:{rho:0.50,mum:"0.5",muc:"0.3",dim:60},
  calcario:{rho:1.50,mum:"0.6",muc:"0.3",dim:25},
  fe_fino:{rho:2.60,mum:"0.6",muc:"0.35",dim:10},
  cal:{rho:1.00,mum:"0.4",muc:"0.3",dim:10},
  cimento:{rho:1.30,mum:"0.4",muc:"0.3",dim:1}
};
function tubPreset(){var p=TUB_MAT[$("#tcMat").value]; if(!p){runCalc("arraste_tubular");return;} $("#tcRho").value=p.rho; $("#tcMum").value=p.mum; $("#tcMuc").value=p.muc; if(p.dim!=null)$("#tcDim").value=p.dim; runCalc("arraste_tubular");}
const ICON_FEEDER='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 6 L36 6 L30 20 L18 20 Z"/><rect x="10" y="26" width="30" height="7" rx="2" transform="rotate(-6 25 29)"/><path d="M11 36 l3 3 M39 34 l-3 3"/><path d="M20 22 l2 3 M27 22 l-1 3" stroke-width="1.4"/><circle cx="42" cy="30" r="2.2"/></svg>';
const ICON_SCREEN_H='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="14" width="36" height="9" rx="2"/><rect x="6" y="27" width="36" height="9" rx="2"/><path d="M12 14 v9 M18 14 v9 M24 14 v9 M30 14 v9 M36 14 v9" stroke-width="1.2"/><path d="M12 27 v9 M18 27 v9 M24 27 v9 M30 27 v9 M36 27 v9" stroke-width="1.2"/><path d="M8 40 l4 -2 M40 40 l-4 -2"/></svg>';
const ICON_SCREEN_I='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 16 L40 28"/><path d="M8 22 L40 34"/><path d="M12 17.4 l1 5.2 M18 19.7 l1 5.2 M24 21.9 l1 5.2 M30 24.1 l1 5.2 M36 26.4 l1 5.2"/><path d="M40 28 l4 1 M8 16 l-3 -1.2"/></svg>';
const ICON_SCREEN_B='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 14 C18 20 30 30 40 34"/><path d="M8 20 C18 26 30 36 40 40"/><path d="M13 16.5 l1.4 5 M20 21 l1.2 5.2 M27 26 l1 5.2 M34 30.5 l0.8 5.2"/><path d="M40 34 l4 1.2 M8 14 l-3 -1.2"/></svg>';
const CRUSHER_MAT={calcario:11,minerio_ferro:13,granito:16,basalto:19,quartzito:12,gnaisse:15,dolomita:11,bauxita:9,minerio_cobre:14,carvao:11,concreto:10,arenito:8,gesso:7,cal:9};
/* Densidade aparente típica (t/m³) para peneiramento */
/* Materiais para peneiramento — densidade aparente (t/m³), forma da partícula (Q2),
   tipo de tela sugerido (Q5, primeiro valor disponível no seletor) e dimensional da peça.
   Briquetes: valores ESTIMADOS de forma conservadora (não constam de tabela de catálogo);
   a tela de poliuretano/borracha é indicada para reduzir a degradação da peça. */
const SCREEN_MAT={
  brita:        {rho:1.6,q2:"1",  q5:["1"],            dim:100},
  granito:      {rho:1.6,q2:"1",  q5:["1"],            dim:100},
  calcario:     {rho:1.5,q2:"1",  q5:["1"],            dim:80},
  agregado:     {rho:1.6,q2:"1",  q5:["1"],            dim:80},
  areia:        {rho:1.5,q2:"1",  q5:["1"],            dim:5},
  minerio_ferro:{rho:2.5,q2:"1",  q5:["1"],            dim:100},
  carvao:       {rho:0.9,q2:"0.9",q5:["1"],            dim:50},
  coque:        {rho:0.5,q2:"0.9",q5:["1"],            dim:75},
  briq_bar:     {rho:1.7,q2:"1",  q5:["0.8b","0.85","0.8"],dim:57,
                 nota:"Briquete BAR 57 × 57 × 37,5 mm · 1,7 t/m³ — peça prensada, aproximadamente equidimensional (Q2 = 1,0). Tela de poliuretano/borracha indicada para reduzir a degradação e a geração de finos. Valores estimados de forma conservadora."},
  briq_bricao:  {rho:1.3,q2:"0.9",q5:["0.8b","0.85","0.8"],dim:120,
                 nota:"Briquete Bricão 120 × 108 × 87 mm · 1,3 t/m³ — peça grande e achatada (relação 1,4:1), tratada como alongada (Q2 = 0,9). Tela de poliuretano/borracha indicada para reduzir a degradação e a geração de finos. Valores estimados de forma conservadora."}
};
function scrSet(id,vals){
  var s=$("#"+id); if(!s||!vals) return;
  for(var v=0;v<vals.length;v++){ for(var i=0;i<s.options.length;i++){
    if(s.options[i].value===vals[v]){ s.value=vals[v]; return; } } }
}
function penApply(pref,sel,calc){
  var m=SCREEN_MAT[$("#"+sel).value]; if(!m) return;
  $("#"+pref+"Rho").value=m.rho;
  scrSet(pref+"Forma",[m.q2]); scrSet(pref+"Tela",m.q5);
  runCalc(CUR_EQ&&CUR_EQ.calculadora?CUR_EQ.calculadora:calc);
}
function penPreset(){ penApply("pn","pnMat","peneira_horizontal"); }
function penPresetI(){ penApply("pi","piMat","peneira_inclinada"); }
function penPresetB(){ penApply("pb","pbMat","peneira_banana"); }
function crusherPreset(){var w=CRUSHER_MAT[$("#bjMat").value]; if(w==null)return; $("#bjWi").value=w; runCalc(CUR_EQ&&CUR_EQ.calculadora?CUR_EQ.calculadora:"britador_mandibulas");}
function impactPreset(){var w=CRUSHER_MAT[$("#biMat").value]; if(w==null)return; $("#biWi").value=w; runCalc(CUR_EQ&&CUR_EQ.calculadora?CUR_EQ.calculadora:"britador_impacto");}
function hammerPreset(){var w=CRUSHER_MAT[$("#bhMat").value]; if(w==null)return; $("#bhWi").value=w; runCalc(CUR_EQ&&CUR_EQ.calculadora?CUR_EQ.calculadora:"britador_martelo");}
function conePreset(){var w=CRUSHER_MAT[$("#bcMat").value]; if(w==null)return; $("#bcWi").value=w; runCalc(CUR_EQ&&CUR_EQ.calculadora?CUR_EQ.calculadora:"britador_conico");}
function icon(e){if(e&&e.calculadora==="alimentador_correia")return ICON_BELT;if(e&&e.calculadora==="calha_vibratoria")return ICON_FEEDER;if(e&&e.calculadora==="britador_conico")return ICON_CONE;if(e&&e.calculadora==="peneira_banana")return ICON_SCREEN_B;if(e&&e.calculadora==="peneira_inclinada")return ICON_SCREEN_I;if(e&&e.calculadora==="peneira_horizontal")return ICON_SCREEN_H;if(e&&e.calculadora==="britador_martelo")return ICON_HAMMER;if(e&&e.calculadora==="britador_impacto")return ICON_IMPACT;if(e&&e.calculadora==="britador_mandibulas")return ICON_JAW;if(e&&e.calculadora==="elevador_canecas")return ICON_BUCKET;if(e&&e.calculadora==="arraste_tubular")return ICON_TUBE;if(e&&e.grupo==="Silos")return ICON_SILO;if(e&&e.calculadora==="belt_conveyor")return ICON_BELT;if(e&&e.calculadora==="flexowell")return ICON_FLEX;return ICON_SCREW;}

/* ---------- Registro de calculadoras ---------- */
const DIAM_STD=[100,150,200,250,300,350,400,450,500,600,700,800,900,1000];
function nextStd(mm){for(const d of DIAM_STD){if(d>=mm)return d;}return DIAM_STD[DIAM_STD.length-1];}
function num(id){return parseFloat($("#"+id).value);}
/* Pré-seleção de materiais típicos de mineração (valores representativos de literatura — confirmar em ensaio Jenike Shear) */
const SILO_MAT={
  fe_gran:{rho:2.5,phi:35,delta:25,c:0.3,d50:12},
  fe_fino:{rho:2.6,phi:42,delta:28,c:2.0,d50:0.1},
  pelota:{rho:2.3,phi:32,delta:22,c:0,d50:12},
  sinter:{rho:1.8,phi:38,delta:30,c:0.2,d50:20},

/* ---- Cálculo de propriedades ---- */
function _pI(n,d,bf,tw,tf){                   // seção I / H
  var hw=d-2*tf, A=(2*bf*tf+hw*tw)/100;
  var Ix=(bf*Math.pow(d,3)-(bf-tw)*Math.pow(hw,3))/12/1e4;
  var Iy=(2*tf*Math.pow(bf,3)+hw*Math.pow(tw,3))/12/1e4;
  return {fam:"W",n:n,A:A,Ix:Ix,W:Ix/(d/20),imin:Math.sqrt(Iy/A),kg:_massa(A)};
}
function _pL(a,b,t,n,fam){                    // cantoneira (a = aba maior, b = menor)
  var A1=a*t, A2=(b-t)*t, At=A1+A2, A=At/100;
  var y1=a/2, y2=t/2, x1=t/2, x2=(b+t)/2;
  var yg=(A1*y1+A2*y2)/At, xg=(A1*x1+A2*x2)/At;
  var Ix=(t*Math.pow(a,3)/12+A1*Math.pow(y1-yg,2)+(b-t)*Math.pow(t,3)/12+A2*Math.pow(y2-yg,2))/1e4;
  var Iy=(a*Math.pow(t,3)/12+A1*Math.pow(x1-xg,2)+t*Math.pow(b-t,3)/12+A2*Math.pow(x2-xg,2))/1e4;
  var Ixy=(A1*(x1-xg)*(y1-yg)+A2*(x2-xg)*(y2-yg))/1e4;
  var md=(Ix+Iy)/2, rd=Math.sqrt(Math.pow((Ix-Iy)/2,2)+Ixy*Ixy);
  return {fam:fam,n:n,A:A,Ix:Ix,W:Ix/((a-yg)/10),imin:Math.sqrt(Math.max(md-rd,1e-6)/A),kg:_massa(A)};
}
function _pT(h,b,t){                          // tubo estrutural retangular / quadrado
  var hi=h-2*t, bi=b-2*t, A=(h*b-hi*bi)/100;
  var Ix=(b*Math.pow(h,3)-bi*Math.pow(hi,3))/12/1e4;
  var Iy=(h*Math.pow(b,3)-hi*Math.pow(bi,3))/12/1e4;
  var q=(h===b)?"□":"▭";
  return {fam:(h===b)?"TQ":"TR",n:"Tubo "+q+" "+h+" x "+b+" x "+String(t).replace(".",",")+" mm",
          A:A,Ix:Ix,W:Ix/(h/20),imin:Math.sqrt(Math.min(Ix,Iy)/A),kg:_massa(A)};
}
function _pBC(h,t){                           // barra chata / chapa soldada
  var A=h*t/100, Ix=t*Math.pow(h,3)/12/1e4, Iy=h*Math.pow(t,3)/12/1e4;
  return {fam:"BC",n:"Barra chata "+h+" x "+String(t).replace(".",",")+" mm",
          A:A,Ix:Ix,W:Ix/(h/20),imin:Math.sqrt(Iy/A),kg:_massa(A)};
}
const CAT_PERFIS=(function(){
  var L=[],i;
  for(i=0;i<CAT_U.length;i++){ var u=CAT_U[i];
    L.push({fam:"U",n:u.n,A:u.A,Ix:u.Ix,W:u.W,imin:u.imin,kg:_massa(u.A)}); }
  for(i=0;i<DIM_W.length;i++){ var w=DIM_W[i]; L.push(_pI(w[0],w[1],w[2],w[3],w[4])); }
  for(i=0;i<DIM_LI.length;i++){ var li=DIM_LI[i]; L.push(_pL(li[0],li[0],li[1],li[2],"LI")); }
  for(i=0;i<DIM_LD.length;i++){ var ld=DIM_LD[i]; L.push(_pL(ld[0],ld[1],ld[2],ld[3],"LD")); }
  for(i=0;i<DIM_TUB.length;i++){ var tb=DIM_TUB[i]; L.push(_pT(tb[0],tb[1],tb[2])); }
  /* Barras chatas: elemento em balanço (soldado pela borda) — limite de flambagem
     local NBR 8800 para elemento AL: h/t ≤ 0,56·√(E/fy) ≈ 15 (aço A36/ASTM 250 MPa). */
  var esp=[6.3,8.0,9.5,12.7,16.0,19.0,25.4,31.5];
  for(var e=0;e<esp.length;e++){ for(var h=75;h<=600;h+=25){
    if(h/esp[e]<=15) L.push(_pBC(h,esp[e])); } }
  return L;
})();
const FAM_NOME={U:"Perfil U",W:"Perfil W (I/H)",LI:"Cantoneira abas iguais",
  LD:"Cantoneira abas desiguais",TQ:"Tubo quadrado",TR:"Tubo retangular",BC:"Barra chata"};
/* Seleciona o perfil mais leve que atende aos critérios.
   crit = {W: módulo requerido (cm³)} e/ou {A: área (cm²), i: raio de giração mín. (cm)}
   fam  = "" (todas as famílias) ou sigla da família imposta pelo usuário
   Retorna {best:perfil, alts:[um por família], dobro:bool} */
function selPerfil(crit,fam){
  function ok(p){
    if(crit.W&&p.W<crit.W) return false;
    if(crit.A&&p.A<crit.A) return false;
    if(crit.i&&p.imin<crit.i) return false;
    return true;
  }
  var pool=CAT_PERFIS.filter(function(p){ return (!fam||p.fam===fam)&&ok(p); });
  var porFam={};
  pool.forEach(function(p){ if(!porFam[p.fam]||p.kg<porFam[p.fam].kg) porFam[p.fam]=p; });
  var alts=Object.keys(porFam).map(function(k){ return porFam[k]; }).sort(function(x,y){ return x.kg-y.kg; });
  if(alts.length) return {best:alts[0],alts:alts,dobro:false};
  // Nenhum perfil isolado atende — propor seção composta com o maior perfil da família.
  var univ=CAT_PERFIS.filter(function(p){ return (!fam||p.fam===fam); });
  if(crit.i){
    // Critério de coluna: associar perfis NÃO aumenta i_min se eles forem justapostos;
    // é preciso afastá-los (seção composta em caixão / treliçada).
    var bi=univ.slice().sort(function(x,y){ return y.A-x.A; })[0];
    var nd2=Math.max(2,Math.ceil(crit.A/bi.A));

const N_MOTOR=1750, FB=1.4;
/* Redutores industriais SEW (acima da série R) — dados de catálogo SEW-EURODRIVE
   MC..  : MC.P (paralelo) / MC.R (cônico-helicoidal), 2-3 estágios, i 7,1–112, MN2 6–65 kN·m
   X..e  : X.F (paralelo) / X.K (cônico-helicoidal), 2-4 estágios, i 6,3–450, MN2 7,2–500 kN·m (23 tamanhos, 100e–320e)
           X.T (cônico-helicoidal, eixo de entrada em cima/embaixo), 3-4 estágios, i 12,5–450, MN2 7,2–185 kN·m */
const SEW_MC={min:6000,max:65000,imin:7.1,imax:112};
const SEW_X ={min:7200,max:500000,imin:6.3,imax:450,s0:100,s1:320};
function selInd(Tsel,i){
  // MC só é indicada se o torque E a relação de transmissão couberem na série;
  // acionamentos muito lentos (alimentadores) exigem i alto e caem na série X (até 450).
  if(Tsel<=SEW_MC.max&&i>=SEW_MC.imin&&i<=SEW_MC.imax){
    return {serie:"MC",nome:"MC.P (paralelo) / MC.R (cônico-helicoidal)",faixa:"6 – 65 kN·m",
            irange:"7,1 – 112",iok:true,tam:null,acima:false};
  }
  // X..e — tamanho estimado por interpolação geométrica entre 100e (7,2 kN·m) e 320e (500 kN·m)
  var t=Math.max(SEW_X.min,Math.min(Tsel,SEW_X.max));
  var f=Math.log(t/SEW_X.min)/Math.log(SEW_X.max/SEW_X.min);
  var sz=Math.round((SEW_X.s0+f*(SEW_X.s1-SEW_X.s0))/10)*10;
  sz=Math.max(SEW_X.s0,Math.min(SEW_X.s1,sz));
  return {serie:"X",nome:"X.F."+sz+"e (paralelo) / X.K."+sz+"e (cônico-helicoidal)",faixa:"7,2 – 500 kN·m",
          irange:"6,3 – 450",iok:(i>=SEW_X.imin&&i<=SEW_X.imax),tam:sz,acima:(Tsel>SEW_X.max)};
}
function fmt(x){return x.toLocaleString("pt-BR");}
function selSEW(Pdrive,nout){
  const T=9550*Pdrive/nout;                 // torque no eixo de saída (Nm)
  const Tsel=T*FB;                          // torque de seleção (com fator de serviço)
  const mot=SEW_MOTORS.find(m=>m.kw>=Pdrive)||SEW_MOTORS[SEW_MOTORS.length-1];
  const red=SEW_R.find(g=>g.t>=Tsel)||SEW_R[SEW_R.length-1];
  const i=N_MOTOR/nout;
  const foraR=(Tsel>SEW_R[SEW_R.length-1].t);          // acima do maior redutor da série R (R167)
  const ind=foraR?selInd(Tsel,i):null;
  return {T,Tsel,mot,red,i,foraR,ind};
}
/* Texto do acionamento recomendado: série R quando couber, senão redutor industrial (MC / X..e) */
function sewDrive(sew,Pmaj){
  if(!sew.foraR) return sew.red.s+" "+sew.mot.d+((sew.mot.kw<Pmaj)?"  ⚠ potência acima do maior motor DRN tabelado":"");

    (d.iok?"":"  ⚠ relação i = "+sew.i.toFixed(1).replace(".",",")+" fora da faixa da série ("+d.irange+
       ") — prever redução primária (motor de 6/8 polos, acoplamento por correias/corrente ou inversor com redução de rotação)");
}

      {id:"siSelf",label:"Fator de peso próprio + sobrecargas",unidade:"-",tipo:"number",valor:1.15,step:"0.05"},
      {tipo:"head",label:"Etapa 13 — Descarga excêntrica"},
      {id:"siEcc",label:"Excentricidade da boca de descarga  e0",unidade:"m",tipo:"number",valor:0,step:"0.1"},
      {tipo:"head",label:"Etapa 14 — Fadiga e dinâmica"},
      {id:"siVimp",label:"Velocidade do material no impacto  v",unidade:"m/s",tipo:"number",valor:5,step:"0.5"},
      {id:"siCi",label:"Fator de impacto  Ci",unidade:"-",tipo:"number",valor:2,step:"0.1"}
    ],
    calcular:function(){
      var g=9.81;
      var Q=num("siQ"),t=num("siT"),eta=num("siEta");
      var rho=num("siRho"),phi=num("siPhi"),delta=num("siDelta"),c=num("siCoes"),d50=num("siD50");
      var scMed=num("siSc"),s1=num("siS1"),D=num("siD");
      if([Q,t,eta,rho,phi,delta,c,d50,s1,D].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||t<=0||eta<=0||eta>1||rho<=0||phi<=0||phi>=90||delta<=0||delta>=90||s1<=0||D<=0) return null;
      // Etapa 2 — capacidade
      var massa=Q*t;
      var V=massa/(rho*eta);
      var gamma=rho*g; // kN/m³
      // Flow Function
      var pr=phi*Math.PI/180;
      var scEst=2*c*Math.cos(pr)/(1-Math.sin(pr));
      if(!isFinite(scEst)||scEst<0) scEst=0;
      var sc=(scMed>0)?scMed:scEst;
      var fonteSc=(scMed>0)?"ensaio Jenike (informado)":"estimado: σc = 2c·cosφi/(1−senφi)";
      var ffc=(sc>0.001)?s1/sc:999;
      var classe = ffc<1?"Não flui (endurecido)":ffc<2?"Muito coesivo":ffc<4?"Coesivo":ffc<10?"Fácil escoamento":"Livre escoamento (free-flowing)";
      var ffcTxt=(ffc>=100)?"> 100":ffc.toFixed(1).replace(".",",");
      // Etapa 4/5 — regime de fluxo e descarga (moega cônica)
      var thetaV=50-delta; if(thetaV<5)thetaV=5; if(thetaV>45)thetaV=45; // meia-abertura da vertical p/ fluxo de massa
      var thetaDes=thetaV-3; if(thetaDes<3)thetaDes=3; // margem de segurança
      var alfaFlow=90-thetaDes; // ângulo da moega recomendado p/ fluxo de massa (com horizontal)
      var Hf=2.0+thetaDes/60; // fator de Jenike H(θ) — moega cônica
      var Barco=(sc>0.001)?Hf*sc/gamma:0; // m
      var Bmec=8*d50/1000; // m  (≈ 8·d50 p/ evitar arco mecânico de blocos)
      var Bfloor=0.6; // mínimo prático em silos de minério (600 mm)
      var Brec=Math.max(Barco,Bmec,Bfloor);
      var coeso=(ffc<4);
      // Etapa 3 — geometria (cilindro + moega cônica/tronco de cone), com opção de alturas informadas
      var H1in=num("siH1"), H2in=num("siH2");
      var hasH1=(!isNaN(H1in)&&H1in>0), hasH2=(!isNaN(H2in)&&H2in>0);
      var alfa, hc;
      if(hasH2){ hc=H2in; alfa=Math.atan(2*hc/Math.max(0.001,(D-Brec)))*180/Math.PI; }
      else { alfa=alfaFlow; hc=(D-Brec)/2*Math.tan(alfa*Math.PI/180); if(hc<0)hc=0; }
      var arad=alfa*Math.PI/180;
      var flowShallow=(alfa<alfaFlow-0.5); // moega mais rasa que o recomendado p/ fluxo de massa
      var Vcone=Math.PI/12*hc*(D*D+D*Brec+Brec*Brec);
      var Vcil, Hcil, semCorpo;
      if(hasH1){ Hcil=H1in; Vcil=Math.PI*D*D/4*Hcil; semCorpo=false; }
      else { Vcil=V-Vcone; semCorpo=(Vcil<=0); Hcil=semCorpo?0:Vcil/(Math.PI*D*D/4); }
      var geoFixa=(hasH1||hasH2);
      var Vgeo=Vcil+Vcone;                 // capacidade real da geometria montada
      var autonGeo=(Q>0)?Vgeo*rho*eta/Q:0; // h de autonomia real
      var geoSub=(geoFixa&&Vgeo<V*0.999);
      var Htot=Hcil+hc;
      var esbeltez=Htot/D;
      // Etapas 5-6 — raio hidráulico e pressões de Janssen (enchimento)
      var Rh=D/4;
      var Kj=1.1*(1-Math.sin(pr));
      var mu=Math.tan(delta*Math.PI/180);
      var z=Hcil; // altura de enchimento no corpo (transição na base do cilindro)
      var pvAsym=gamma*Rh/(mu*Kj);
      var pv=pvAsym*(1-Math.exp(-mu*Kj*z/Rh));
      var ph=Kj*pv, pw=mu*ph;
      // Etapa 7 — fatores de descarga EN 1991-4 (parede vertical, Classe 2)
      var Ch=1.15, Cw=1.10;
      var phD=Ch*ph, pwD=Cw*pw;
      // Etapa 8 — distribuição de pressões (perfil de Janssen no enchimento)
      function jph(zz){return Kj*pvAsym*(1-Math.exp(-mu*Kj*zz/Rh));}
      var phMid=jph(z/2);
      // Etapa 9 — dimensionamento das chapas (tensão circunferencial de membrana)
      var Rc=D/2;
      var ntheta=phD*Rc;            // kN/m = N/mm  (esforço de membrana com pressão de descarga)
      var fy=parseFloat($("#siFy").value); if(isNaN(fy))fy=345;
      var abr=num("siAbr"); if(isNaN(abr))abr=0;
      var sadm=0.90*fy;             // MPa = N/mm²  (NBR 8800, escoamento, φ=0,90)
      var tcalc=ntheta/sadm;        // mm
      var tmin=6.0;                 // mm — mínimo prático em silos de minério
      var treq=Math.max(tcalc+abr,tmin);
      var COM=[6.3,8.0,9.5,12.5,16.0,19.0,22.4,25.0,31.5];
      var tcom=COM[COM.length-1]; for(var ti=0;ti<COM.length;ti++){ if(COM[ti]>=treq){ tcom=COM[ti]; break; } }
      var govMin=(tcalc+abr<tmin);
      // Etapa 10 — anéis de reforço (estabilidade do casco sob pressão externa, modo de anel n=2)
      var qext=num("siQext"); if(isNaN(qext)||qext<0)qext=0;
      var Ls=num("siLs"); if(isNaN(Ls)||Ls<=0)Ls=3;
      var Eaco=200e6;                       // kPa (200 GPa)
      var Ireq=qext*Math.pow(Rc,3)*Ls/(3*Eaco); // m⁴
      var Ireq_cm4=Ireq*1e8;                // cm⁴
      var nAneis=Math.max(1,Math.ceil(Hcil/Ls)-1);
      // Etapa 11 — montantes verticais (colunas de apoio)
      var Ncol=parseFloat($("#siNcol").value); if(isNaN(Ncol)||Ncol<1)Ncol=4;
      var Hleg=num("siHleg"); if(isNaN(Hleg)||Hleg<=0)Hleg=6;
      var fself=num("siSelf"); if(isNaN(fself)||fself<1)fself=1.15;
      var Wmat=massa*g;                      // kN (massa em t × g)
      var Wtot=Wmat*fself;                   // kN (material + peso próprio/sobrecargas)
      var Pcol=Wtot/Ncol;                    // kN por montante
      var chi=0.6;                           // redução de flambagem assumida (pré-dim)
      var fy_kNcm2=fy/10;                    // MPa → kN/cm²
      var Areq=Pcol/(chi*0.90*fy_kNcm2);     // cm²
      var lamMax=120, Kbuc=2.0;              // engastado-livre (montante em balanço)
      var imin=Kbuc*(Hleg*100)/lamMax;       // cm
      // Etapa 12 — dimensionamento da moega (tremonha cônica, membrana meridional)
      var Atrans=Math.PI*D*D/4;              // m²
      var Fv=pv*Atrans + Vcone*gamma;        // kN (carga vertical na transição: coluna + peso do cone)
      var senA=Math.sin(arad);
      var Tm=(senA>0)?Fv/(Math.PI*D*senA):0; // kN/m (tração meridional na transição)
      var thop=Tm/sadm;                      // mm (Tm[kN/m]=N/mm; sadm[MPa]=N/mm²)
      var thop_req=Math.max(thop+abr,tmin);
      var thopcom=COM[COM.length-1]; for(var th=0;th<COM.length;th++){ if(COM[th]>=thop_req){ thopcom=COM[th]; break; } }
      var pnHop=pv;                          // estimativa da pressão normal na parede (confirmar pico de switch — EN 1991-4)
      var thopMin=(thop+abr<tmin);
      // Etapa 13 — descarga excêntrica (EN 1991-4)
      var e0=num("siEcc"); if(isNaN(e0)||e0<0)e0=0;
      var ecc=e0/D;
      var eccClass=(e0<=0)?"Central (sem excentricidade)":(ecc<0.10)?"Pequena excentricidade":(ecc<0.25)?"Excentricidade moderada":"Excentricidade significativa";
      var eccCrit=(ecc>=0.25);
      // Etapa 14 — fadiga e dinâmica
      var vimp=num("siVimp"); if(isNaN(vimp)||vimp<0)vimp=0;
      var Ci=num("siCi"); if(isNaN(Ci)||Ci<1)Ci=1;
      var mdot=Q*1000/3600;                  // kg/s (vazão mássica)
      var Fimp=Ci*mdot*vimp/1000;            // kN (força de impacto da alimentação)
      var Icol_cm4=Areq*imin*imin;           // cm⁴ (I ≈ A·i²)
      var Icol=Icol_cm4*1e-8;                // m⁴
      var Edin=200e9;                        // Pa
      var klat=Ncol*3*Edin*Icol/Math.pow(Hleg,3); // N/m (apoio em colunas, modelo cantilever)
      var mvib=Wtot*1000/g;                  // kg (massa total vibrante)
      var fn=(klat>0&&mvib>0)?(1/(2*Math.PI))*Math.sqrt(klat/mvib):0; // Hz
      var OUT=[
        {sec:"Etapa 2 — Capacidade do silo"},
        {k:"Massa requerida  m = Q · t",v:fmt(Math.round(massa))+" t"},
        {k:"Volume útil  V = m / (ρ · η)",v:V.toFixed(1).replace(".",",")+" m³",hi:true},
        {k:"Peso específico  γ = ρ · g",v:gamma.toFixed(1).replace(".",",")+" kN/m³"},
        {sec:"Etapas 1 e 4 — Avaliação do material (Flow Function)"},
        {k:"Atrito interno φi · atrito de parede δ",v:phi.toFixed(0)+"° · "+delta.toFixed(0)+"°"},
        {k:"Resistência não confinada  σc",v:sc.toFixed(2).replace(".",",")+" kPa  ("+fonteSc+")"},
        {k:"Tensão de consolidação  σ1",v:s1.toFixed(1).replace(".",",")+" kPa"+(scMed>0?"":"  (referência — refinada pela Etapa 6/Janssen)")},
        {k:"Flow Function  ffc = σ1 / σc",v:ffcTxt},
        {k:"Classificação de fluidez",v:classe,hi:true},
        {sec:"Etapas 4 e 5 — Regime de fluxo e descarga"},
        {k:"Regime de fluxo recomendado",v:"Fluxo de massa (mass flow)",hi:true},
        {k:"Ângulo da moega recomendado (fluxo de massa)",v:alfaFlow.toFixed(0)+"°  (com a horizontal, moega cônica)",hi:true},
        {k:"Meia-abertura da vertical  θ · fator H(θ)",v:thetaDes.toFixed(0)+"° · "+Hf.toFixed(2).replace(".",",")},
        {k:"Descarga mín. anti-arco (Jenike) B = H·σc/γ",v:(Barco>0?(Math.round(Barco*1000)+" mm"):"≈ 0 (sem coesão relevante)")},
        {k:"Descarga mín. por granulometria  ≈ 8·d50",v:Math.round(Bmec*1000)+" mm"},
        {k:"Diâmetro de descarga recomendado",v:fmt(Math.round(Brec*1000))+" mm  (mín. prático 600–1200 mm)",hi:true},
        {sec:"Etapa 3 — Geometria preliminar (cilindro + moega cônica)"},
        {k:"Diâmetro interno  D",v:D.toFixed(2).replace(".",",")+" m"},
        {k:(hasH2?"Altura 2 — moega  hc (informada)":"Altura 2 — moega  hc = (D−B)/2 · tg α"),v:hc.toFixed(2).replace(".",",")+" m  (α = "+alfa.toFixed(0)+"°"+(flowShallow?"  ⚠ mais raso que "+alfaFlow.toFixed(0)+"° — risco p/ fluxo de massa":"")+")",hi:true},
        {k:"Volume da moega (tronco de cone)",v:Vcone.toFixed(1).replace(".",",")+" m³"},
        {k:(hasH1?"Altura 1 — parte reta  H (informada)":"Altura 1 — parte reta  H (pela capacidade)"),v:(semCorpo?"0  ⚠ moega já comporta o volume — reduzir D":Hcil.toFixed(2).replace(".",",")+" m"),hi:true},
        {k:"Altura total  Htot = H + hc",v:Htot.toFixed(2).replace(".",",")+" m"},
        {k:"Capacidade real da geometria  V_geo",v:Vgeo.toFixed(1).replace(".",",")+" m³"+(geoFixa?"  (autonomia ≈ "+autonGeo.toFixed(1).replace(".",",")+" h)":"")+(geoSub?"  ⚠ abaixo do volume útil requerido ("+V.toFixed(1).replace(".",",")+" m³) — aumentar H1 ou D":""),hi:geoFixa},
        {k:"Esbeltez  Htot / D",v:esbeltez.toFixed(2).replace(".",",")+(esbeltez>=2?"  (silo esbelto)":"  (silo baixo/intermediário)")},
        {sec:"Etapas 5 e 6 — Pressões de Janssen (enchimento)"},
        {k:"Raio hidráulico  R_h = D/4",v:Rh.toFixed(2).replace(".",",")+" m"},
        {k:"Razão de pressões  K = 1,1·(1−senφi)",v:Kj.toFixed(3).replace(".",",")},
        {k:"Coef. de atrito de parede  μ = tg δ",v:mu.toFixed(3).replace(".",",")},
        {k:"Pressão vertical na transição  pv",v:pv.toFixed(1).replace(".",",")+" kPa"},
        {k:"Pressão horizontal na parede  ph = K·pv",v:ph.toFixed(1).replace(".",",")+" kPa",hi:true},
        {k:"Atrito na parede  pw = μ·ph",v:pw.toFixed(1).replace(".",",")+" kPa"},
        {sec:"Etapa 7 — Pressões de descarga (EN 1991-4)"},
        {k:"Pressão horizontal de descarga  ph,d = Ch·ph  (Ch=1,15)",v:phD.toFixed(1).replace(".",",")+" kPa",hi:true},
        {k:"Atrito de parede na descarga  pw,d = Cw·pw  (Cw=1,10)",v:pwD.toFixed(1).replace(".",",")+" kPa"},
        {sec:"Etapa 8 — Distribuição de pressões na parede (perfil de Janssen)"},
        {k:"Pressão horizontal a meia altura  (z = H/2)",v:phMid.toFixed(1).replace(".",",")+" kPa"},
        {k:"Pressão horizontal na transição  (z = H, máx.)",v:ph.toFixed(1).replace(".",",")+" kPa"},
        {k:"Pressão de projeto na parede (descarga, transição)",v:phD.toFixed(1).replace(".",",")+" kPa",hi:true},
        {sec:"Etapa 9 — Dimensionamento das chapas (tensão circunferencial)"},
        {k:"Raio  R = D/2",v:Rc.toFixed(2).replace(".",",")+" m"},
        {k:"Esforço de membrana circunferencial  nθ = ph,d·R",v:ntheta.toFixed(1).replace(".",",")+" kN/m"},
        {k:"Tensão admissível  σadm = 0,90·fy  (NBR 8800)",v:fy+" MPa → "+sadm.toFixed(0)+" MPa"},
        {k:"Espessura por tração  t = nθ/σadm",v:tcalc.toFixed(2).replace(".",",")+" mm  (+ "+abr.toFixed(1).replace(".",",")+" mm abrasão/corrosão)"},
        {k:"Espessura recomendada (chapa comercial)",v:tcom.toFixed(1).replace(".",",")+" mm"+(govMin?"  (governada pelo mínimo prático 6 mm)":""),hi:true},
        {sec:"Etapa 10 — Anéis de reforço (estabilidade sob pressão externa)"},
        {k:"Pressão externa de projeto (vento/vácuo)",v:qext.toFixed(1).replace(".",",")+" kPa"},
        {k:"Espaçamento entre anéis  L_s",v:Ls.toFixed(1).replace(".",",")+" m"},
        {k:"Momento de inércia requerido  I = q·R³·L_s/(3E)",v:Ireq_cm4.toFixed(1).replace(".",",")+" cm⁴  (E = 200 GPa)",hi:true},
        {k:"Número estimado de anéis no corpo",v:nAneis.toFixed(0)},
        {k:"Recomendação do anel",v:"Barra chata / cantoneira soldada com I ≥ I_req; verificar também ação do vento (NBR 8800)."},
        {sec:"Etapa 11 — Montantes verticais (colunas de apoio)"},
        {k:"Peso do material  W = m·g",v:fmt(Math.round(Wmat))+" kN"},
        {k:"Carga total (× peso próprio/sobrecargas)",v:fmt(Math.round(Wtot))+" kN  (fator "+fself.toFixed(2).replace(".",",")+")"},
        {k:"Carga por montante  P = Wtot / N",v:fmt(Math.round(Pcol))+" kN  ("+Ncol.toFixed(0)+" montantes)",hi:true},
        {k:"Área bruta requerida  A ≈ P/(χ·0,90·fy)",v:Areq.toFixed(0)+" cm²  (χ ≈ 0,6)"},
        {k:"Raio de giração mínimo  i = K·L/λ  (K=2, λ=120)",v:imin.toFixed(1).replace(".",",")+" cm"},
        {k:"Recomendação do montante",v:"Perfil tubular ou I com A ≥ "+Areq.toFixed(0)+" cm² e i ≥ "+imin.toFixed(1).replace(".",",")+" cm; verificar flambagem, excentricidade, vento e sismo (NBR 8800)."},
        {sec:"Etapa 12 — Dimensionamento da moega (tremonha cônica)"},
        {k:"Carga vertical na transição  Fv = pv·A + W_cone",v:fmt(Math.round(Fv))+" kN"},
        {k:"Tração meridional  Tm = Fv/(π·D·sen α)",v:Tm.toFixed(1).replace(".",",")+" kN/m",hi:true},
        {k:"Pressão normal na parede (estim.)  pn ≈ pv",v:pnHop.toFixed(1).replace(".",",")+" kPa"},
        {k:"Espessura por tração  t = Tm/σadm  (+ "+abr.toFixed(1).replace(".",",")+" mm abrasão)",v:thop.toFixed(2).replace(".",",")+" mm"},
        {k:"Espessura recomendada da moega (chapa comercial)",v:thopcom.toFixed(1).replace(".",",")+" mm"+(thopMin?"  (mínimo prático)":""),hi:true},
        {k:"Observação da moega",v:"⚠ Verificar o pico de pressão na transição (switch, EN 1991-4) e a abrasão — moegas de minério costumam usar chapa/revestimento mais espessos."},
        {sec:"Etapa 13 — Descarga excêntrica (EN 1991-4)"},
        {k:"Excentricidade da boca  e0",v:e0.toFixed(2).replace(".",",")+" m"},
        {k:"Razão de excentricidade  e0/D",v:ecc.toFixed(3).replace(".",",")},
        {k:"Classificação",v:eccClass,hi:true},
        {k:"Recomendação",v:eccCrit?"⚠ e0/D ≥ 0,25: a EN 1991-4 exige análise do canal de fluxo excêntrico — pressões assimétricas, flexão/ovalização do casco e reforços verticais.":(e0>0?"Efeitos de excentricidade reduzidos; manter a boca o mais centrada possível e verificar a assimetria conforme EN 1991-4.":"Descarga central — sem efeitos de excentricidade. Manter a boca centrada favorece o fluxo de massa.")},
        {sec:"Etapa 14 — Fadiga e dinâmica"},
        {k:"Vazão mássica  ṁ = Q/3,6",v:mdot.toFixed(0)+" kg/s"},
        {k:"Força de impacto da alimentação  F = Ci·ṁ·v",v:Fimp.toFixed(1).replace(".",",")+" kN  (Ci="+Ci.toFixed(1).replace(".",",")+", v="+vimp.toFixed(1).replace(".",",")+" m/s)",hi:true},
        {k:"Massa total vibrante  m = Wtot/g",v:fmt(Math.round(mvib))+" kg"},
        {k:"Rigidez lateral estimada do apoio  k = N·3EI/L³",v:(klat/1e6).toFixed(2).replace(".",",")+" MN/m  (I ≈ A·i²)"},
        {k:"Frequência natural estimada  f = (1/2π)·√(k/m)",v:fn.toFixed(2).replace(".",",")+" Hz",hi:true},
        {k:"Verificação de ressonância",v:"Manter f afastada das frequências de excitação (alimentadores vibratórios ~10-25 Hz; folga ≥ ±20%); verificar fadiga das soldas sob carga cíclica e impacto."},
        {k:"Observação estrutural",v:"⚠ Pré-dimensionamento — não substitui o projeto estrutural detalhado nem a folha de dados; confirmar todas as etapas conforme NBR 8800 / EN 1991-4."},
        {k:"Observação de fluxo",v:coeso?"⚠ Material coesivo (ffc < 4): confirmar σc e σ1 em ensaio Jenike Shear e priorizar fluxo de massa.":"Material de bom escoamento — fluxo de massa com a moega indicada tende a ser suficiente."}
      ];
      OUT.geo={tipo:"circ",D:D,Hcil:Hcil,hc:hc,Htot:Htot,Brec:Brec,alfa:alfa,tcom:tcom,thopcom:thopcom,fy:fy,Vutil:V};
      return OUT;
    }
  },
  silo_retangular:{
    titulo:"Silo Retangular — projeto executivo (roteiro completo)",
    referencia:"FLUXO: A. W. Jenike (Bulletin 123) — Flow Function, ábaco de fluxo de massa (θ × δ × φw) para tremonha cônica e plana, abertura anti-arco B = H(θ)·σc/γ; vazão de descarga por gravidade pela correlação de Beverloo. AÇÕES: EN 1991-4 (Eurocode 1, Parte 4) e ABNT NBR 11700 — classes de esbeltez, limites superior/inferior de K e μ com os três casos de carga (pressão máxima na parede, atrito máximo, pressão vertical máxima na tremonha), carga localizada (patch load), pressões de tremonha por Walker/Enstad no enchimento e na descarga, pressão de switch na transição, ações térmicas. VENTO: ABNT NBR 6123 (S1, S2 pela Tabela 2, S3, coeficiente de arrasto e força global). SISMO: ABNT NBR 15421. ESTRUTURA: ABNT NBR 8800 — combinações de ELU e ELS, chapa a flexão, enrijecedores, cintas, anel de transição, montantes com curva de flambagem, flambagem local da parede sob compressão de atrito, placa de base, chumbadores e fadiga (Anexo K / EN 1993-1-9).",
    campos:[
      {tipo:"head",label:"Etapa 1 — Dados operacionais"},
      {id:"siQ",label:"Produção da planta  Q",unidade:"t/h",tipo:"number",valor:100},
      {id:"siT",label:"Tempo de autonomia  t",unidade:"h",tipo:"number",valor:1,step:"0.5"},
      {id:"siEta",label:"Fator de enchimento  η",unidade:"-",tipo:"number",valor:0.9,step:"0.05"},
      {id:"rAAC",label:"Classe de avaliação de ações (EN 1991-4)",tipo:"select",valor:"2",opcoes:[
        {v:"1",t:"Classe 1 — capacidade < 100 t (regras simplificadas)"},
        {v:"2",t:"Classe 2 — 100 a 10.000 t (padrão industrial)"},
        {v:"3",t:"Classe 3 — acima de 10.000 t ou excentricidade elevada"}]},
      {tipo:"head",label:"Etapa 1 — Propriedades do minério"},
      {id:"siMat",label:"Material (pré-seleção típica — preenche ρ, φi, φw, c, d50)",tipo:"select",valor:"briq_bar",onchange:"siloPreset()",opcoes:[

    calcular:function(){
      var g=9.81;
      var Q=num("siQ"),t=num("siT"),eta=num("siEta");
      var rho=num("siRho"),phi=num("siPhi"),deltaIn=num("siDelta"),c=num("siCoes"),d50=num("siD50");
      var scMed=num("siSc"),s1=num("siS1"),a=num("rA"),b=num("rB");
      if([Q,t,eta,rho,phi,deltaIn,c,d50,s1,a,b].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||t<=0||eta<=0||eta>1||rho<=0||phi<=0||phi>=90||deltaIn<=0||deltaIn>=90||s1<=0||a<=0||b<=0) return null;
      var massa=Q*t, V=massa/(rho*eta), gamma=rho*g;
      var pr=phi*Math.PI/180;
      /* ===== ETAPA 3a — REVESTIMENTO: altera o atrito de parede φw ===== */
      var LINER={none:{d:0,t:0,rho:0,n:"sem revestimento (aço carbono)"},
                 hardox:{d:0,t:8,rho:7850,n:"chapa antidesgaste Hardox 400/450, 8 mm"},
                 inox:{d:-5,t:3,rho:7900,n:"aço inoxidável 304 2B, 3 mm"},
                 uhmw:{d:-10,t:12,rho:940,n:"UHMW-PE, 12 mm"},
                 ceram:{d:-3,t:20,rho:3600,n:"cerâmica de alumina, 20 mm"}};
      var LN=LINER[$("#rLiner")?$("#rLiner").value:"none"]||LINER.none;
      var delta=Math.max(5,deltaIn+LN.d);          // φw efetivo com revestimento
      /* ===== ETAPA 1 — FLOW FUNCTION (com tempo de consolidação) ===== */
      var fTemp=parseFloat($("#rTcons")?$("#rTcons").value:"1.0")||1.0;
      var scEst=2*c*Math.cos(pr)/(1-Math.sin(pr)); if(!isFinite(scEst)||scEst<0)scEst=0;
      var sc0=(scMed>0)?scMed:scEst, sc=sc0*fTemp;
      var fonteSc=(scMed>0)?"ensaio Jenike (informado)":"estimado: σc = 2c·cosφi/(1−senφi)";
      var ffc=(sc>0.001)?s1/sc:999;
      var classe=ffc<1?"Não flui (endurecido)":ffc<2?"Muito coesivo":ffc<4?"Coesivo":ffc<10?"Fácil escoamento":"Livre escoamento (free-flowing)";
      var ffcTxt=(ffc>=100)?"> 100":ffc.toFixed(1).replace(".",",");
      var coeso=(ffc<4);
      /* ===== ETAPA 4 — ÁBACO DE JENIKE (fluxo de massa) =====
         θ = meio-ângulo da tremonha medido a partir da VERTICAL, no limite do fluxo de massa,
         em função do atrito de parede φw e do ângulo efetivo de atrito interno δ.
         Tabelas digitalizadas de Jenike (Bulletin 123): cônica (axissimétrica) e plana (cunha).
         Prática de projeto: adotar 3° mais íngreme que o limite (margem de segurança). */
      var JEN_D=[30,40,50,60,70], JEN_W=[0,10,20,30,40];
      var JEN_CON=[[33,24,13, 0, 0],[35,28,19, 7, 0],[36,30,23,13, 0],[37,32,26,18, 7],[38,33,28,22,13]];
      var JEN_PLA=[[49,41,31,17, 0],[50,44,36,25, 8],[51,46,39,31,18],[52,47,42,35,25],[52,48,44,38,30]];
      function bilin(TB,xs,ys,x,y){
        function idx(v,arr){ if(v<=arr[0])return [0,0,0]; if(v>=arr[arr.length-1])return [arr.length-1,arr.length-1,0];
          for(var i=1;i<arr.length;i++){ if(v<=arr[i]) return [i-1,i,(v-arr[i-1])/(arr[i]-arr[i-1])]; } return [arr.length-1,arr.length-1,0]; }
        var ix=idx(x,xs), iy=idx(y,ys);
        var v00=TB[ix[0]][iy[0]],v01=TB[ix[0]][iy[1]],v10=TB[ix[1]][iy[0]],v11=TB[ix[1]][iy[1]];
        var v0=v00+(v01-v00)*iy[2], v1=v10+(v11-v10)*iy[2];
        return v0+(v1-v0)*ix[2];
      }
      var deffIn=num("siDeff");
      var deff=(!isNaN(deffIn)&&deffIn>0)?deffIn:phi;    // ângulo efetivo de atrito interno δ
      var cunha=($("#rHop").value==="cunha");
      var thetaLim=bilin(cunha?JEN_PLA:JEN_CON,JEN_D,JEN_W,deff,delta);
      var margJ=3.0;
      var thetaDes=Math.max(3,thetaLim-margJ);          // θ de projeto (da vertical)
      var alfaJen=90-thetaDes;                           // ângulo de FACE exigido pelo ábaco
      /* Limite construtivo: faces acima de ~70° tornam a tremonha alta demais e o silo
         inviável. Se o ábaco exigir mais que isso, o fluxo de massa NÃO é atingível com
         a geometria — o silo passa a operar em FLUXO DE FUNIL e a boca precisa ser maior
         que o diâmetro de rathole (tubulação) de Jenike, não apenas que o arco. */
      var alfaCapLim=70;
      var alfaCap=(alfaJen>alfaCapLim);
      var alfaFlow=alfaCap?alfaCapLim:alfaJen;
      var semFluxoMassa=(thetaLim<=0.5)||alfaCap;
      /* Diâmetro de rathole (fluxo de funil): Df = G(φt)·σc/γ  — Jenike */
      var GT_X=[30,40,50,60], GT_Y=[2.0,3.3,5.0,7.5];
      function interpG(x){ if(x<=GT_X[0])return GT_Y[0]; if(x>=GT_X[3])return GT_Y[3];
        for(var i=1;i<4;i++){ if(x<=GT_X[i]) return GT_Y[i-1]+(GT_Y[i]-GT_Y[i-1])*(x-GT_X[i-1])/(GT_X[i]-GT_X[i-1]); } return GT_Y[3]; }
      var Gfun=interpG(deff);
      /* ===== ETAPA 4 — ABERTURA ANTI-ARCO ===== */
      var Hf=(cunha?1.0:2.0)+thetaDes/60;               // fator H(θ) de Jenike
      var Barco=(sc>0.001)?Hf*sc/gamma:0, Bmec=(cunha?6:8)*d50/1000, Bfloor=cunha?0.4:0.6;
      var Drat=(sc>0.001)?Gfun*sc/gamma:0;              // diâmetro de rathole (fluxo de funil)
      var Brec=Math.max(Barco,Bmec,Bfloor);
      if(semFluxoMassa) Brec=Math.max(Brec,Drat);       // em fluxo de funil o rathole governa
      /* ===== ETAPA 3 — GEOMETRIA ===== */
      var Lmax=Math.max(a,b), Lmin=Math.min(a,b);
      var H1in=num("rH1"), H2in=num("rH2");
      var hasH1=(!isNaN(H1in)&&H1in>0), hasH2=(!isNaN(H2in)&&H2in>0);
      var BwIn=num("rBw"), BlIn=num("rBl");
      var hasBw=(!isNaN(BwIn)&&BwIn>0), hasBl=(!isNaN(BlIn)&&BlIn>0);
      var Bw=hasBw?(BwIn/1000):Brec;
      var Bl=hasBl?(BlIn/1000):(cunha?Lmax:Bw);
      if(Bw>Lmin*0.95)Bw=Lmin*0.95; if(Bl>Lmax*0.99)Bl=Lmax*0.99;
      var bocaUser=(hasBw||hasBl);
      var bocaCurta=(Bw<Brec-0.001);
      var bocaNota=bocaCurta?("  ⚠ abaixo do mínimo exigido ("+Math.round(Brec*1000)+" mm) — risco de arco/entupimento"):"";
      var ta=(a-Bw)/2, tb=(b-Bw)/2;
      var hc;
      if(hasH2){ hc=H2in; }
      else if(cunha){ hc=(Lmin-Bw)/2*Math.tan(alfaFlow*Math.PI/180); }
      else { hc=Math.sqrt(ta*ta+tb*tb)*Math.tan(alfaFlow*Math.PI/180); }
      if(!(hc>0))hc=0;
      function angFace(tt){ return (tt<=0.0005)?90:Math.atan(hc/tt)*180/Math.PI; }
      var alfaA,alfaB,alfaVale;
      if(cunha){ alfaA=90; alfaB=angFace((Lmin-Bw)/2); alfaVale=alfaB; }
      else { alfaA=angFace(ta); alfaB=angFace(tb);
             alfaVale=(hc>0)?Math.atan(hc/Math.sqrt(ta*ta+tb*tb))*180/Math.PI:0; }
      var flowShallow=(alfaVale<alfaFlow-0.5);
      var valeGap=alfaFlow-alfaVale;
      var alfa=alfaVale, arad=alfa*Math.PI/180;
      var betaHop=90-alfa;                               // meio-ângulo da tremonha (da vertical)
      var A1=a*b, A2=cunha?(Bw*Bl):(Bw*Bw);
      var Vpir=cunha?(hc/2)*(Lmin+Bw)*Lmax:(hc/3)*(A1+A2+Math.sqrt(A1*A2));
      /* Cone de empilhamento no topo (ângulo de repouso) — volume adicional armazenável */
      var rep=num("rRep"); if(isNaN(rep)||rep<=0||rep>=60)rep=35;
      var hCone=(Lmin/2)*Math.tan(rep*Math.PI/180);
      var Vcone=(a*b*hCone)/3;
      var Vcil, Hcil, semCorpo;
      if(hasH1){ Hcil=H1in; Vcil=a*b*Hcil; semCorpo=false; }
      else { Vcil=V-Vpir-Vcone*0.5; semCorpo=(Vcil<=0); Hcil=semCorpo?0:Vcil/(a*b); }
      var geoFixa=(hasH1||hasH2);
      var Vgeo=Vcil+Vpir, VgeoC=Vgeo+Vcone;
      var autonGeo=(Q>0)?Vgeo*rho*eta/Q:0;
      var geoSub=(geoFixa&&Vgeo<V*0.999);
      var Htot=Hcil+hc, esbeltez=Htot/Lmin;
      /* ===== CLASSE DE ESBELTEZ (EN 1991-4) ===== */
      var Rh=(a*b)/(2*(a+b)), dc=4*Rh;                   // dimensão característica

    calcular:function(){
      var g=9.81, eta=0.85;
      var Q=num("tcQ"),rho=num("tcRho"),Lh1=num("tcLh1"),Li=num("tcLi"),theta=num("tcTheta"),Lh2=num("tcLh2"),Nb=num("tcNb"),fillPc=num("tcFill"),dim=num("tcDim");
      var mum=parseFloat($("#tcMum").value),muc=parseFloat($("#tcMuc").value),SF=parseFloat($("#tcSF").value);
      if([Q,rho,Lh1,Li,theta,Lh2,Nb,fillPc].some(function(x){return isNaN(x);})||Q<=0||rho<=0||Lh1<0||Li<0||Lh2<0||theta<0||theta>90||Nb<0||fillPc<=0||fillPc>100) return null;
      if(isNaN(dim)||dim<0)dim=0;
      var KLUMP=3;   // Ø interno recomendado >= 3 x dimensional (passagem livre da peça no tubo)
      var fill=fillPc/100;
      // Tubos de aço conforme ASME B36.10 (Sch 40) — Ø interno (mm); corrente de elos redondos por faixa
      var TC=[
        {n:"4",dn:100,di:102.3,de:114.3,vmax:0.50,d:14,qc:4.31,pcd:0.35},
        {n:"5",dn:125,di:128.2,de:141.3,vmax:0.50,d:14,qc:4.31,pcd:0.35},
        {n:"6",dn:150,di:154.1,de:168.3,vmax:0.45,d:18,qc:7.13,pcd:0.40},
        {n:"8",dn:200,di:202.7,de:219.1,vmax:0.45,d:18,qc:7.13,pcd:0.40},
        {n:"10",dn:250,di:254.5,de:273.0,vmax:0.54,d:26,qc:14.87,pcd:0.49},
        {n:"12",dn:300,di:303.2,de:323.9,vmax:0.54,d:26,qc:14.87,pcd:0.49},
        {n:"14",dn:350,di:333.3,de:355.6,vmax:0.54,d:30,qc:19.80,pcd:0.55},
        {n:"16",dn:400,di:381.0,de:406.4,vmax:0.54,d:30,qc:19.80,pcd:0.55}
      ];
      function ageom(s){return Math.PI*Math.pow(s.di/1000,2)/4;}      // m² — seção do tubo
      function autil(s){return ageom(s)*fill;}                        // m² — seção ocupada pelo material
      function cap(s){return autil(s)*s.vmax*3600;}                   // m³/h
      var Qv=Q/rho;
      var sel=$("#tcDN").value, S=null, insuf=false;
      if(sel!=="auto"){ for(var i=0;i<TC.length;i++){ if(TC[i].n===sel){ S=TC[i]; break; } } }
      if(!S){ for(var i=0;i<TC.length;i++){ if(cap(TC[i])>=Qv && TC[i].di>=KLUMP*dim){ S=TC[i]; break; } } if(!S){ S=TC[TC.length-1]; insuf=true; } }
      var Ag=ageom(S), Au=autil(S);
      var rLump=(dim>0)?S.di/dim:0;
      var lumpNote=(dim<=0)?"":(rLump>=KLUMP)?"  (OK ≥ "+KLUMP+"× — passagem livre)":(rLump>=2)?"  ⚠ entre 2× e "+KLUMP+"× — confirmar disco/passo com o fabricante":"  ⚠ abaixo de 2× — tubo incompatível com o dimensional; usar diâmetro maior";
      var V=Qv/(Au*3600); if(V>S.vmax){ insuf=true; }
      var Vshow=Math.min(V,S.vmax);
      var fillNote=(fillPc>70)?"  ⚠ acima de 70% — risco de compactação/sobrecarga da corrente":(fillPc<30)?"  (baixa — tubo subutilizado)":"";
      var qm=rho*Au*1000, qc=S.qc;
      var th=theta*Math.PI/180, H=Li*Math.sin(th), Lcos=Li*Math.cos(th);
      var Lhoriz=Lh1+Lh2+Lcos, Lpath=Lh1+Li+Lh2;
      var Fhor=g*(qc*muc+qm*mum)*(Lh1+Lh2);
      var Finc=g*((qc*muc+qm*mum)*Math.cos(th)+(qc+qm)*Math.sin(th))*Li;
      var Fret=g*qc*muc*Lpath;
      var F0=Fhor+Finc+Fret, F=F0*(1+0.08*Nb);
      var Peff=F*Vshow/eta/1000, Pmaj=Peff*1.20;
      var nspr=Vshow*60/(Math.PI*S.pcd), sew=selSEW(Pmaj,nspr);
      var Rm=800, BLreq=F*SF, dreq=Math.sqrt(BLreq/(2*(Math.PI/4)*Rm));
      var CH=[14,16,18,20,22,26,30,34];
      var dsel=CH[CH.length-1]; for(var ci=0;ci<CH.length;ci++){ if(CH[ci]>=Math.max(dreq,S.d)){ dsel=CH[ci]; break; } }
      var BLsel=2*(Math.PI/4)*dsel*dsel*Rm;
      var OUT=[
        {sec:"Geometria e capacidade"},
        {k:"Ângulo de inclinação",v:theta.toFixed(0)+"°"},
        {k:"Elevação total  H = L_incl·senθ",v:H.toFixed(2).replace(".",",")+" m"},
        {k:"Comprimento horizontal total",v:Lhoriz.toFixed(1).replace(".",",")+" m"},
        {k:"Comprimento total do percurso",v:Lpath.toFixed(1).replace(".",",")+" m"},
        {k:"Vazão volumétrica requerida",v:Qv.toFixed(1).replace(".",",")+" m³/h"},
        {sec:"Tubo conforme norma (ASME B36.10 · Sch 40)"},
        {k:"Diâmetro nominal do tubo",v:S.n+" pol  ·  DN "+S.dn+"  (Ø ext. "+S.de.toFixed(1).replace(".",",")+" mm)",hi:true},
        {k:"Diâmetro interno do tubo",v:S.di.toFixed(1).replace(".",",")+" mm"},
        {k:"Dimensional / maior peça do material",v:(dim>0?fmt(Math.round(dim))+" mm":"—")},
        {k:"Relação Ø interno / dimensional",v:(dim>0?rLump.toFixed(1).replace(".",",")+" ×"+lumpNote:"—  (dimensional não informado)"),hi:dim>0},
        {k:"Seção geométrica do tubo  A = π·d²/4",v:(Ag*1e4).toFixed(0)+" cm²"},
        {k:"Taxa de preenchimento adotada",v:fillPc.toFixed(0)+" %"+fillNote,hi:true},
        {k:"Seção útil de material  A_útil = A · taxa",v:(Au*1e4).toFixed(0)+" cm²",hi:true},
        {sec:"Velocidade e capacidade"},
        {k:"Velocidade da corrente requerida",v:Vshow.toFixed(2).replace(".",",")+" m/s"+(insuf?"  ⚠ acima da capacidade — usar diâmetro maior ou aumentar a taxa":"  (máx. "+S.vmax.toFixed(2).replace(".",",")+" m/s)")},
        {k:"Capacidade máx. do tubo (na taxa adotada)",v:cap(S).toFixed(1).replace(".",",")+" m³/h · "+(cap(S)*rho).toFixed(1).replace(".",",")+" t/h"},
        {k:"Massa por metro: material · corrente",v:qm.toFixed(1).replace(".",",")+" · "+qc.toFixed(1).replace(".",",")+" kg/m"},
        {sec:"Tração na corrente"},
        {k:"Resist. trechos horizontais",v:fmt(Math.round(Fhor))+" N"},
        {k:"Resist. trecho inclinado (atrito + elevação)",v:fmt(Math.round(Finc))+" N"},

    calcular:function(){
      var g=9.81, eta=0.9;
      var Q=num("ecQ"),rho=num("ecRho"),H=num("ecH"),D=num("ecD");
      var fill=parseFloat($("#ecFill").value),disc=$("#ecDisc").value,trac=$("#ecTrac").value,SF=parseFloat($("#ecSF").value);
      if([Q,rho,H,D].some(function(x){return isNaN(x);})||Q<=0||rho<=0||H<=0||D<=0) return null;
      var BK=[
        {n:"C2",Vb:2.0,hb:0.16,w:0.20},{n:"C5",Vb:5.0,hb:0.20,w:0.30},{n:"C10",Vb:10,hb:0.25,w:0.40},
        {n:"C20",Vb:20,hb:0.32,w:0.50},{n:"C40",Vb:40,hb:0.40,w:0.65},{n:"C80",Vb:80,hb:0.50,w:0.80}
      ];
      var vnat=2.215*Math.sqrt(D), nnat=42.3/Math.sqrt(D);
      var v=(disc==="centrifuga")?Math.min(vnat,1.8):0.9;
      var n=v*60/(Math.PI*D);
      function spac(bk){ return (disc==="centrifuga"?2.4:1.1)*bk.hb; }
      function capBk(bk){ return 3.6*(bk.Vb/spac(bk))*v*rho*fill; }
      var sel=$("#ecBucket").value, BK0=null, insuf=false;
      if(sel!=="auto"){ for(var i=0;i<BK.length;i++){ if(BK[i].n===sel){ BK0=BK[i]; break; } } }
      if(!BK0){ for(var i=0;i<BK.length;i++){ if(capBk(BK[i])>=Q){ BK0=BK[i]; break; } } if(!BK0){ BK0=BK[BK.length-1]; insuf=true; } }
      var a=spac(BK0), capsel=capBk(BK0); if(capsel<Q) insuf=true;
      var qmat=Q/(3.6*v), Nbk=Math.ceil(2*(H+1)/a);
      var fd=(disc==="centrifuga")?1.15:1.10;
      var Plift=Q*H/(367*eta), Peff=Plift*fd, Pmaj=Peff*1.20;
      var sew=selSEW(Pmaj,n);
      var Fwork=Pmaj*1000/v;
      var beltB=0, epClass=0, BLreq=0;
      if(trac==="correia"){
        beltB=Math.ceil((BK0.w*1000+50)/50)*50;
        var EPc=[250,400,500,630,800,1000,1250], req=(Fwork/beltB)*SF;
        epClass=EPc[EPc.length-1]; for(var e=0;e<EPc.length;e++){ if(EPc[e]>=req){ epClass=EPc[e]; break; } }
      } else { BLreq=Fwork*SF; }
      var discOK=(disc==="centrifuga")?(Math.abs(v-vnat)/vnat<0.15):true;
      var OUT=[
        {sec:"Capacidade e caneca"},
        {k:"Vazão de projeto",v:Q.toFixed(0)+" t/h"},
        {k:"Vazão volumétrica  Q/ρ",v:(Q/rho).toFixed(1).replace(".",",")+" m³/h"},
        {k:"Tipo de descarga",v:(disc==="centrifuga"?"Centrífuga (alta velocidade)":"Contínua (baixa velocidade)")},
        {k:"Caneca selecionada",v:"Tipo "+BK0.n+" · "+BK0.Vb.toFixed(1).replace(".",",")+" L · largura "+(BK0.w*1000).toFixed(0)+" mm",hi:true},
        {k:"Espaçamento entre canecas",v:(a*1000).toFixed(0)+" mm"+(insuf?"  ⚠ acima da capacidade — usar caneca/elevador maior":"")},
        {k:"Capacidade da configuração",v:capsel.toFixed(1).replace(".",",")+" t/h · "+(capsel/rho).toFixed(1).replace(".",",")+" m³/h  (enchimento "+(fill*100).toFixed(0)+"%)"},
        {k:"Número aproximado de canecas (2 ramais)",v:Nbk+" un"},
        {sec:"Velocidade e descarga"},
        {k:"Diâmetro do tambor/roda da cabeça",v:(D*1000).toFixed(0)+" mm"},
        {k:"Velocidade da correia/corrente",v:v.toFixed(2).replace(".",",")+" m/s",hi:true},
        {k:"Rotação da cabeça",v:n.toFixed(1).replace(".",",")+" rpm"},
        {k:"Velocidade natural de descarga (centrífuga)",v:vnat.toFixed(2).replace(".",",")+" m/s · "+nnat.toFixed(1).replace(".",",")+" rpm  ("+(disc==="centrifuga"?(discOK?"OK":"⚠ ajustar Ø do tambor"):"ref. — descarga contínua usa v menor")+")"},
        {sec:"Potência e acionamento SEW"},
        {k:"Potência de elevação  P = Q·H/(367·η)",v:Plift.toFixed(2).replace(".",",")+" kW"},
        {k:"Resistência de escavação no boot (×"+fd.toFixed(2).replace(".",",")+")",v:Peff.toFixed(2).replace(".",",")+" kW · "+(Peff/0.7457).toFixed(1).replace(".",",")+" HP",hi:true},
        {k:"Potência final majorada (+20%)",v:Pmaj.toFixed(2).replace(".",",")+" kW",hi:true},
        {k:"Momento no eixo do redutor  T = 9550·P/n",v:fmt(Math.round(sew.T))+" N·m"},
        {k:"Torque de seleção (T · fB)",v:fmt(Math.round(sew.Tsel))+" N·m"},
        {k:"Relação de redução  i = n_motor / n_saída",v:"≈ "+sew.i.toFixed(1).replace(".",",")+" : 1"},
        {k:"Motor SEW (4 polos, ~1750 rpm)",v:sew.mot.kw.toString().replace(".",",")+" kW · "+sew.mot.d,hi:true},
        {k:"Motoredutor SEW recomendado",v:sewDrive(sew,Pmaj),hi:true}
      ];
      if(trac==="correia"){
        OUT.push({sec:"Tração — correia (EP)"});
        OUT.push({k:"Tração de trabalho  F = P/v",v:fmt(Math.round(Fwork))+" N"});
        OUT.push({k:"Largura da correia (caneca + folga)",v:beltB+" mm"});
        OUT.push({k:"Tração por largura",v:(Fwork/beltB).toFixed(1).replace(".",",")+" N/mm"});
        OUT.push({k:"Classe da correia (EP) com FS "+SF.toFixed(0),v:"EP "+epClass+" N/mm",hi:true});
        OUT.push({k:"Observação",v:"Pré-dimensionamento — para abrasivos (minério, clínquer, escória) a correia (BEUMER) tem maior vida útil. Confirmar canecas no catálogo (4B/Tapco/Maxi-Lift) e velocidades CEMA."});
      } else {
        OUT.push({sec:"Tração — corrente central"});
        OUT.push({k:"Tração de trabalho  F = P/v",v:fmt(Math.round(Fwork))+" N"});
        OUT.push({k:"Carga de ruptura requerida  F·FS",v:fmt(Math.round(BLreq/1000))+" kN  (FS "+SF.toFixed(0)+")",hi:true});
        OUT.push({k:"Recomendação da corrente",v:"Corrente central forjada (tipo AUMUND BWZ) ou de elos redondos RUD com carga de ruptura ≥ "+(BLreq/1000).toFixed(0)+" kN."});

      }
      OUT.geo={tipo:"canecas",H:H,v:v,D:D,bucket:BK0.n,Vb:BK0.Vb,cap:capsel,Pmaj:Pmaj,motorkw:sew.mot.kw,motord:sew.mot.d,disc:(disc==="centrifuga"?"Centrífuga":"Contínua"),trac:(trac==="correia"?("Correia EP "+epClass):("Corrente BL≥"+Math.round(BLreq/1000)+" kN")),Nbk:Nbk};
      return OUT;
    }

    calcular:function(){

      // Gráfico B — capacidade básica C (m³/h·m²) x abertura (mm)
      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];

      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];

    calcular:function(){
      var Q=num("pbQ"),rho=num("pbRho"),ab=num("pbAb"),over=num("pbOver"),half=num("pbHalf"),P=num("pbP"),S=num("pbS"),inclE=num("pbInclE"),inclS=num("pbInclS");
      var Q2=parseFloat($("#pbForma").value),Q4=parseFloat($("#pbUmidade").value),Q5=parseFloat($("#pbTela").value),Q1=parseFloat($("#pbDecks").value);
      var umido=$("#pbUmido").value;
      if([Q,rho,ab,over,half,P,S].some(function(x){return isNaN(x);})||Q<=0||rho<=0||ab<=0||P<=0||S<=0) return null;
      function interp(t,x){ if(x<=t[0][0])return t[0][1]; if(x>=t[t.length-1][0])return t[t.length-1][1]; for(var i=1;i<t.length;i++){ if(x<=t[i][0]){ var f=(x-t[i-1][0])/(t[i][0]-t[i-1][0]); return t[i-1][1]+f*(t[i][1]-t[i-1][1]); } } return t[t.length-1][1]; }
      var TC=[[0.838,3.5],[1.168,4.5],[1.651,5.5],[2.362,6.5],[3.327,8],[4.699,10],[6.35,12],[9.525,16],[12.70,20],[15.875,24],[19.05,27],[22.2,30],[25.4,33],[38.1,43],[50.8,49],[63.5,55],[76.2,60],[88.9,65],[101.6,69],[114.3,72],[127,76],[139.7,80],[152.4,85],[165.1,92],[177.8,101]];
      var TM=[[0,0.92],[10,0.97],[20,1.0],[30,1.04],[40,1.10],[50,1.18],[60,1.28],[65,1.35],[70,1.46],[75,1.60],[78,1.80],[80,2.0],[85,2.7],[90,3.8]];
      var TK=[[0,0.40],[10,0.52],[20,0.62],[25,0.70],[30,0.78],[40,0.93],[50,1.10],[60,1.25],[70,1.42],[80,1.60],[90,2.0]];
      var TQ6=[[30,1.0],[40,1.1],[50,1.2],[60,1.3],[70,1.4]]; // banana CBS — Q6 pelo % de material passante
      function q3wet(a){ if(a<=6)return 1.4; if(a<=12)return 1.3; if(a<=25)return 1.25; if(a<=40)return 1.2; if(a<=50)return 1.1; if(a<=75)return 1.15; return 1.0; }
      var C=interp(TC,ab), M=interp(TM,over), K=interp(TK,half);
      var passante=Math.max(0,Math.min(100,100-over));
      var Q6=interp(TQ6,passante);            // fator da peneira banana pelo % passante
      var Q3=(umido==="sim")?q3wet(ab):1.0;
      var Qn=Q1*Q2*Q3*Q4*Q5*Q6;
      var T=Q/rho;
      var A=(T*P)/(C*M*K*Qn);
      // Catálogo de peneiras banana Metso CBS — área ativa (m²), largura W (m), comprimento L (m)
      var MOD=[{n:"CBS 5'×14'",a:6.0,w:1.525,l:4.270},{n:"CBS 6'×16'",a:8.2,w:1.835,l:4.880},{n:"CBS 7'×20'",a:11.9,w:2.140,l:6.100},{n:"CBS 8'×20'",a:13.7,w:2.455,l:6.100},{n:"CBS 8'×24'",a:16.4,w:2.445,l:7.320},{n:"CBS 10'×24'",a:20.5,w:3.055,l:7.320}];
      var sel=null; for(var i=0;i<MOD.length;i++){ if(MOD[i].a>=A){ sel=MOD[i]; break; } }
      var insuf=false; if(!sel){ sel=MOD[MOD.length-1]; insuf=true; }
      var Dbed=100*T/(6*S*(sel.w-0.15));
      var limCam=4*ab, camOK=(Dbed<=limCam);
      var nModel=A/sel.a;
      var inclNote=(inclE<inclS)?"  ⚠ entrada deve ser mais íngreme que a descarga":"";
      var OUT=[
        {sec:"Alimentação"},
        {k:"Vazão de alimentação ao deck",v:Q.toFixed(0)+" t/h"},
        {k:"Densidade aparente",v:rho.toFixed(2).replace(".",",")+" t/m³"},
        {k:"Alimentação volumétrica  T = Q / ρ",v:T.toFixed(1).replace(".",",")+" m³/h",hi:true},
        {k:"Abertura desejada (separação)",v:ab.toFixed(0)+" mm"},
        {k:"% de oversize na alimentação",v:over.toFixed(0)+" %"},
        {k:"% de material passante na alimentação",v:passante.toFixed(0)+" %  (rege o fator Q6 da banana)"},
        {k:"% de material < ½ da abertura",v:half.toFixed(0)+" %"},
        {sec:"Fatores do método (VSMA / Metso)"},
        {k:"Capacidade básica  C (gráfico B)",v:C.toFixed(1).replace(".",",")+" m³/h·m²",hi:true},
        {k:"Fator de material retido  M (gráfico C — oversize)",v:M.toFixed(2).replace(".",",")},
        {k:"Fator  K (gráfico D — % < ½ abertura)",v:K.toFixed(2).replace(".",",")},
        {k:"Fator de confiança  P",v:P.toFixed(2).replace(".",",")},
        {k:"Q1 — posição do deck",v:Q1.toFixed(2).replace(".",",")},
        {k:"Q2 — forma da partícula",v:Q2.toFixed(2).replace(".",",")},
        {k:"Q3 — peneiramento via úmida",v:Q3.toFixed(2).replace(".",",")+(umido==="sim"?"  (via úmida)":"  (via seca)")},
        {k:"Q4 — umidade superficial",v:Q4.toFixed(2).replace(".",",")},
        {k:"Q5 — tipo de tela / área aberta",v:Q5.toFixed(2).replace(".",",")},
        {k:"Q6 — peneira banana (pelo % passante)",v:Q6.toFixed(2).replace(".",",")+"  ("+passante.toFixed(0)+"% passante)",hi:true},
        {k:"Produto de correção  Qn = Q1·Q2·Q3·Q4·Q5·Q6",v:Qn.toFixed(3).replace(".",","),hi:true},
        {sec:"Área e seleção da peneira"},
        {k:"Área necessária  A = (T·P)/(C·M·K·Qn)",v:A.toFixed(2).replace(".",",")+" m²",hi:true},
        {k:"Modelo selecionado (linha banana CBS)",v:sel.n+" · "+sel.a.toFixed(2).replace(".",",")+" m²"+(insuf?"  ⚠ maior modelo do catálogo — área insuficiente, prever 2 peneiras em paralelo":""),hi:true},
        {k:"Largura × comprimento do deck",v:sel.w.toFixed(2).replace(".",",")+" × "+sel.l.toFixed(2).replace(".",",")+" m"},
        {k:"Inclinação variável (entrada → descarga)",v:inclE.toFixed(0)+"° → "+inclS.toFixed(0)+"°"+inclNote},
        {k:"Ocupação da área ativa (A / área do modelo)",v:(nModel*100).toFixed(0)+" %"},
        {sec:"Camada de material e eficiência"},
        {k:"Velocidade de transporte  S",v:S.toFixed(0)+" m/min"},
        {k:"Espessura da camada na descarga  D = 100·T/(6·S·(W−0,15))",v:Dbed.toFixed(0)+" mm"+(camOK?"  (OK ≤ 4·abertura)":"  ⚠ > 4·abertura ("+limCam.toFixed(0)+" mm) — modelo mais largo"),hi:true},
        {k:"Limite recomendado da camada (≈ 3 a 4 × abertura)",v:limCam.toFixed(0)+" mm"},
        {k:"Eficiência assumida no método",v:"90% (contaminação ~5%)"},
        {k:"Para eficiência de 95%",v:"operar com 80% da capacidade calculada ou aumentar a área em 20%"},
        {k:"Observação",v:"Pré-dimensionamento de peneira banana CBS (inclinação variável, movimento circular). O deck mais íngreme na entrada mantém a camada fina e acelera a estratificação, elevando a capacidade — refletida no fator Q6 pelo % de material passante (0,30→1,0 a 0,70→1,4). Curvas de capacidade referidas a 1,6 t/m³. Confirmar tela, amplitude/frequência e o modelo na folha de dados do fabricante."}
      ];
      OUT.geo={tipo:"peneira",banana:true,model:sel.n,A:A,Amod:sel.a,W:sel.w,L:sel.l,ab:ab,C:C,M:M,K:K,Qn:Qn,T:T,Dbed:Dbed,decks:Q1,incl:inclE,inclS:inclS};
      return OUT;
    }
  },

    calcular:function(){
      var Q=num("cvQ"),rho=num("cvRho"),Fmax=num("cvFmax"),amp=num("cvAmp"),rpm=num("cvRpm");
      var f1=parseFloat($("#cvGran").value),f2=parseFloat($("#cvUmid").value),incl=parseFloat($("#cvIncl").value);
      if([Q,rho,Fmax,amp,rpm].some(function(x){return isNaN(x);})||Q<=0||rho<=0||amp<=0||rpm<=0) return null;
      // Curva de velocidade V (m/s) — linhas por amplitude (mm) × rotação (rpm) — gráfico do manual
      var RP=[500,600,700,800,900];
      var VA={3:[0.07,0.11,0.17,0.22,0.27],4:[0.10,0.15,0.21,0.25,0.28],5:[0.13,0.18,0.23,0.28,0.31],6:[0.15,0.21,0.26,0.30,0.34],7:[0.23,0.29,0.33,0.37,0.40]};
      function interp1(xs,ys,x){ if(x<=xs[0])return ys[0]; if(x>=xs[xs.length-1])return ys[ys.length-1]; for(var i=1;i<xs.length;i++){ if(x<=xs[i]){ var t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]); } } return ys[ys.length-1]; }
      var aC=Math.max(3,Math.min(7,amp)), nC=Math.max(500,Math.min(900,rpm));
      var aLo=Math.floor(aC), aHi=Math.ceil(aC); if(aLo<3)aLo=3; if(aHi>7)aHi=7;
      var vLo=interp1(RP,VA[aLo],nC), vHi=interp1(RP,VA[aHi],nC);
      var V0=(aHi===aLo)?vLo:vLo+(vHi-vLo)*(aC-aLo)/(aHi-aLo);
      var fIncl=(incl>=10)?1.6:(incl>=5)?1.3:1.0; if(incl>0&&incl<5)fIncl=1+0.3*(incl/5); else if(incl>5&&incl<10)fIncl=1.3+0.3*((incl-5)/5);
      var V=V0*fIncl;
      var Tvol=Q/rho;                       // m³/h requerido
      var hmaxF=(f1>=1)?0.2:(f1>=0.85)?0.3:0.5;   // H ≤ 0,2/0,3/0,5·L pela granulometria

        {n:'Vibraline 60"×72"',L:1.50,C:1.80,cmin:240,cmax:770,kw:7.4,fmax:250,boca:"bica sob projeto",vib:true},
        {n:"MVS-35120",L:1.20,C:3.50,cmin:290,cmax:830,kw:23.9,fmax:510,boca:"1800 × 1800"},
        {n:'Vibraline 72"×96"',L:1.80,C:2.40,cmin:290,cmax:960,kw:14.7,fmax:300,boca:"bica sob projeto",vib:true},
        {n:"MVS-50158",L:1.50,C:5.00,cmin:420,cmax:1040,kw:29.8,fmax:610,boca:"2800 × 1450"},
        {n:'Vibraline 84"×120"',L:2.10,C:3.00,cmin:320,cmax:1280,kw:22.1,fmax:400,boca:"bica sob projeto",vib:true}
      ];
      var sel=$("#cvModel").value, M=null;

      var L=M.L, Hmax=hmaxF*L;
      var Hreq=Tvol/(3600*f1*f2*V*L);        // m — altura de camada (abertura de comporta) necessária
      var capMaxGeom=3600*f1*f2*V*L*Hmax*rho; // t/h máx. da mesa nesta condição (V, material, Hmax)
      var camadaOK=(Hreq<=Hmax), blocoOK=(Fmax<=M.fmax), qBaixa=(Q<M.cmin*0.999), qAlta=(Q>M.cmax*1.001);
      var OUT=[

        {k:"Linha do equipamento",v:M.vib?"Vibraline — calha vibrante sob silo/pilha (movimento linear, 2 vibradores)":(M.n.indexOf("MVS")===0?"MVS — alimentador vibratório suspenso (sob silo/pilha)":"CV — calha vibratória (sob silo/pilha)")},
