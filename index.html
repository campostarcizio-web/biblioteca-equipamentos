      var qDistOp=qDist+qm*g/1000;                                        // kN/m (operação)
      var PentradaV=(mRet+mChutes)*g/1000;                                 // kN — extremidade de entrada
      var PentradaO=PentradaV+(qm*2)*g/1000;                               // + acúmulo local de material
      var PsaidaV=(mCab+mAcion)*g/1000;                                    // kN — extremidade de descarga
      var PsaidaO=PsaidaV+(qm*2)*g/1000;
      var Pmotor=mAcion*g/1000;                                            // kN — só motor + redutor
      /* Torque de reação do acionamento na estrutura (braço = raio da roda dentada) */
      var Treac=(nspr>0)?(9550*Pmaj/nspr):0;                               // N·m

         · No ESTICADOR o dispositivo tensiona os dois ramos: H = 2·T0.
         · Na ANCORAGEM do conjunto o que a estrutura de apoio precisa reter é a REAÇÃO

    calcular:function(){
      var g=9.81, eta=0.9;
      var Q=num("ecQ"),rho=num("ecRho"),H=num("ecH"),D=num("ecD");
      var fill=parseFloat($("#ecFill").value),disc=$("#ecDisc").value,trac=$("#ecTrac").value,SF=parseFloat($("#ecSF").value);
      if([Q,rho,H,D].some(function(x){return isNaN(x);})||Q<=0||rho<=0||H<=0||D<=0) return null;
      var BK=[
        {n:"C2",Vb:2.0,hb:0.16,w:0.20},{n:"C5",Vb:5.0,hb:0.20,w:0.30},{n:"C10",Vb:10,hb:0.25,w:0.40},
        {n:"C20",Vb:20,hb:0.32,w:0.50},{n:"C40",Vb:40,hb:0.40,w:0.65},{n:"C80",Vb:80,hb:0.50,w:0.80}
      ];
      var vnat=2.215*Math.sqrt(D), nnat=42.3/Math.sqrt(D);

      var n=v*60/(Math.PI*D);
      function spac(bk){ return (disc==="centrifuga"?2.4:1.1)*bk.hb; }
      function capBk(bk){ return 3.6*(bk.Vb/spac(bk))*v*rho*fill; }

      var qmat=Q/(3.6*v), Nbk=Math.ceil(2*(H+1)/a);
      var fd=(disc==="centrifuga")?1.15:1.10;
      var Plift=Q*H/(367*eta), Peff=Plift*fd, Pmaj=Peff*1.20;
      var sew=selSEW(Pmaj,n);

        beltB=Math.ceil((BK0.w*1000+50)/50)*50;

      var OUT=[

        {sec:"Velocidade e descarga"},
        {k:"Diâmetro do tambor/roda da cabeça",v:(D*1000).toFixed(0)+" mm"},
        {k:"Velocidade da correia/corrente",v:v.toFixed(2).replace(".",",")+" m/s",hi:true},
        {k:"Rotação da cabeça",v:n.toFixed(1).replace(".",",")+" rpm"},
        {k:"Velocidade natural de descarga (centrífuga)",v:vnat.toFixed(2).replace(".",",")+" m/s · "+nnat.toFixed(1).replace(".",",")+" rpm  ("+(disc==="centrifuga"?(discOK?"OK":"⚠ ajustar Ø do tambor"):"ref. — descarga contínua usa v menor")+")"},
        {sec:"Potência e acionamento SEW"},
        {k:"Potência de elevação  P = Q·H/(367·η)",v:Plift.toFixed(2).replace(".",",")+" kW"},
        {k:"Resistência de escavação no boot (×"+fd.toFixed(2).replace(".",",")+")",v:Peff.toFixed(2).replace(".",",")+" kW · "+(Peff/0.7457).toFixed(1).replace(".",",")+" HP",hi:true},
        {k:"Potência final majorada (+20%)",v:Pmaj.toFixed(2).replace(".",",")+" kW",hi:true},

        {v:"CV-1308",t:"CV-1308 · 110–240 t/h"},{v:"CV-1510",t:"CV-1510 · 160–320 t/h"},

        {v:"MVS-35120",t:"MVS-35120 · 290–830 t/h"},{v:"MVS-50158",t:"MVS-50158 · 420–1040 t/h"},
        {v:'Vibraline 36"×60"',t:'Vibraline 36"×60" · 80–320 t/h'},{v:'Vibraline 60"×72"',t:'Vibraline 60"×72" · 240–770 t/h'},
        {v:'Vibraline 72"×96"',t:'Vibraline 72"×96" · 290–960 t/h'},{v:'Vibraline 84"×120"',t:'Vibraline 84"×120" · 320–1280 t/h'}]}
    ],
    calcular:function(){
      var Q=num("cvQ"),rho=num("cvRho"),Fmax=num("cvFmax"),amp=num("cvAmp"),rpm=num("cvRpm");
      var f1=parseFloat($("#cvGran").value),f2=parseFloat($("#cvUmid").value),incl=parseFloat($("#cvIncl").value);
      if([Q,rho,Fmax,amp,rpm].some(function(x){return isNaN(x);})||Q<=0||rho<=0||amp<=0||rpm<=0) return null;
      // Curva de velocidade V (m/s) — linhas por amplitude (mm) × rotação (rpm) — gráfico do manual
      var RP=[500,600,700,800,900];
      var VA={3:[0.07,0.11,0.17,0.22,0.27],4:[0.10,0.15,0.21,0.25,0.28],5:[0.13,0.18,0.23,0.28,0.31],6:[0.15,0.21,0.26,0.30,0.34],7:[0.23,0.29,0.33,0.37,0.40]};
      function interp1(xs,ys,x){ if(x<=xs[0])return ys[0]; if(x>=xs[xs.length-1])return ys[ys.length-1]; for(var i=1;i<xs.length;i++){ if(x<=xs[i]){ var t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ys[i-1]+t*(ys[i]-ys[i-1]); } } return ys[ys.length-1]; }
      var aC=Math.max(3,Math.min(7,amp)), nC=Math.max(500,Math.min(900,rpm));
      var aLo=Math.floor(aC), aHi=Math.ceil(aC); if(aLo<3)aLo=3; if(aHi>7)aHi=7;
      var vLo=interp1(RP,VA[aLo],nC), vHi=interp1(RP,VA[aHi],nC);
      var V0=(aHi===aLo)?vLo:vLo+(vHi-vLo)*(aC-aLo)/(aHi-aLo);
      var fIncl=(incl>=10)?1.6:(incl>=5)?1.3:1.0; if(incl>0&&incl<5)fIncl=1+0.3*(incl/5); else if(incl>5&&incl<10)fIncl=1.3+0.3*((incl-5)/5);
      var V=V0*fIncl;

      // Catálogo — calhas CV (sob silo) e alimentadores suspensos MVS
      var MOD=[
        {n:"CV-1308",L:0.70,C:1.28,cmin:110,cmax:240,kw:3.7,fmax:203,boca:"800 × 700"},

        {n:"MVS-35090",L:0.90,C:3.50,cmin:190,cmax:590,kw:11.9,fmax:510,boca:"1900 × 1570"},
        {n:'Vibraline 60"×72"',L:1.50,C:1.80,cmin:240,cmax:770,kw:7.4,fmax:250,boca:"bica sob projeto",vib:true},
        {n:"MVS-35120",L:1.20,C:3.50,cmin:290,cmax:830,kw:23.9,fmax:510,boca:"1800 × 1800"},
        {n:'Vibraline 72"×96"',L:1.80,C:2.40,cmin:290,cmax:960,kw:14.7,fmax:300,boca:"bica sob projeto",vib:true},
        {n:"MVS-50158",L:1.50,C:5.00,cmin:420,cmax:1040,kw:29.8,fmax:610,boca:"2800 × 1450"},
        {n:'Vibraline 84"×120"',L:2.10,C:3.00,cmin:320,cmax:1280,kw:22.1,fmax:400,boca:"bica sob projeto",vib:true}
      ];
      var sel=$("#cvModel").value, M=null;
      if(sel!=="auto"){ for(var i=0;i<MOD.length;i++){ if(MOD[i].n===sel){ M=MOD[i]; break; } } }
      var insufCat=false; if(!M){ for(var i=0;i<MOD.length;i++){ if(MOD[i].cmax>=Q){ M=MOD[i]; break; } } if(!M){ M=MOD[MOD.length-1]; insufCat=true; } }
      var L=M.L, Hmax=hmaxF*L;

      var nMolCh=selvN("chNmol",4);
      var mMolas=nMolCh*(6+0.012*(mMesa+mVibTot));                   // kg — molas + suportes

      var PporMola=Pest_ch/nMolCh;

        {k:"Velocidade base do material (curva)  V0",v:V0.toFixed(3).replace(".",",")+" m/s"},

        {k:"Linha do equipamento",v:M.vib?"Vibraline — calha vibrante sob silo/pilha (movimento linear, 2 vibradores)":(M.n.indexOf("MVS")===0?"MVS — alimentador vibratório suspenso (sob silo/pilha)":"CV — calha vibratória (sob silo/pilha)")},
        {k:"Largura da mesa  L",v:L.toFixed(2).replace(".",",")+" m"},
        {k:"Comprimento da mesa  C",v:M.C.toFixed(2).replace(".",",")+" m",hi:true},
        {k:"Área útil da mesa  C × L",v:(M.C*L).toFixed(2).replace(".",",")+" m²"},
        {k:"Inclinação da mesa",v:incl.toFixed(0)+"°"+(incl>0?" descendente  (fator "+fIncl.toFixed(2).replace(".",",")+" na velocidade)":"  (horizontal)")+((M.vib&&incl<10)?"  ⚠ a capacidade de catálogo Vibraline é referida a 10° — com menos inclinação, reduzir a capacidade ou compensar por rotação/amplitude":""),hi:true},

/* Restaura todos os campos de uma calculadora aos valores padrão do registro CALCS */
function resetCampos(id){
  var calc=CALCS[id]; if(!calc) return;
  calc.campos.forEach(function(f){
    if(!f.id||f.tipo==="head") return;
    var el=document.getElementById(f.id); if(!el) return;
    if(f.valor!==undefined&&f.valor!==null) el.value=f.valor;
  });
  runCalc(id);
}

/* ---------- Proteção dos campos numéricos contra a roda do mouse ----------
   Em <input type="number"> com foco, o navegador incrementa/decrementa o valor quando a
   roda do mouse passa por cima. Em formulários longos como os das calculadoras isso muda
   dados de entrada silenciosamente durante a rolagem da página. O listener abaixo tira o
   foco do campo no início da rolagem, impedindo a alteração. */
document.addEventListener("wheel",function(ev){
  var el=document.activeElement;
  if(el&&el.tagName==="INPUT"&&el.type==="number"){ el.blur(); }
},{passive:true,capture:true});
document.addEventListener("focusin",function(ev){
  var el=ev.target;
  if(el&&el.tagName==="INPUT"&&el.type==="number"&&!el.dataset.nw){
    el.dataset.nw="1";
    el.addEventListener("wheel",function(e){ e.preventDefault(); this.blur(); },{passive:false});
  }
});

/* ---------- Menu ---------- */
function buildMenu(){
  const menu=DB.meta.menu||[];
  $("#menu").innerHTML=menu.map(g=>{
    const subs=(g.subgrupos||[]).map(s=>`<button class="navitem" data-grupo="${g.grupo}" data-sub="${s}">${s}</button>`).join("");
    return `<div class="grp open" data-grp="${g.grupo}"><button class="grphead" data-grupo="${g.grupo}"><span>${g.grupo}</span><span class="arrow">›</span></button><div class="subs">${subs}</div></div>`;
  }).join("");
  document.querySelectorAll(".grphead").forEach(b=>b.addEventListener("click",()=>{b.closest(".grp").classList.toggle("open");selectFilter(b.dataset.grupo,"");}));
  document.querySelectorAll(".subs .navitem").forEach(b=>b.addEventListener("click",()=>{selectFilter(b.dataset.grupo,b.dataset.sub);closeDrawer();}));
  $(".navitem.all").addEventListener("click",()=>{selectFilter("","");closeDrawer();});
}
function selectFilter(g,s){
  curGrupo=g;curSub=s;
  document.querySelectorAll(".navitem,.grp").forEach(n=>n.classList.remove("active"));
  if(!g){$(".navitem.all").classList.add("active");}
  else{const grp=document.querySelector(`.grp[data-grp="${CSS.escape(g)}"]`);if(grp)grp.classList.add("active","open");
    if(s){const el=document.querySelector(`.subs .navitem[data-grupo="${CSS.escape(g)}"][data-sub="${CSS.escape(s)}"]`);if(el)el.classList.add("active");}}
  render();
}
function openDrawer(){$("#drawer").classList.add("open");$("#overlay").classList.add("open");}
function closeDrawer(){$("#drawer").classList.remove("open");$("#overlay").classList.remove("open");}

function render(){
  const list=DB.equipamentos.filter(e=>(!curGrupo||e.grupo===curGrupo)&&(!curSub||e.subgrupo===curSub));
  $("#count").textContent=list.length+" equipamento"+(list.length!==1?"s":"");
  $("#title").textContent=curSub||curGrupo||"Dimensionamento de Equipamentos";
  $("#grid").innerHTML=list.map(e=>{
    const idx=DB.equipamentos.indexOf(e);
    return `<div class="card" onclick="openItem(${idx})">
      <div class="icon">${icon(e)}</div>
      <div><div class="cat">${e.grupo} · ${e.subgrupo}</div>
      <h3>${e.modelo}</h3><div class="desc">${e.descricao||e.subtipo}</div>
      ${e.calculadora?'<span class="calcflag">▸ Abrir cálculo de pré-dimensionamento</span>':'<span class="calcflag soon">⋯ Calculadora em desenvolvimento</span>'}</div>
    </div>`;
  }).join("")||'<p style="color:var(--muted)">Nenhum equipamento neste grupo ainda.</p>';
}

function openItem(i){
  const e=DB.equipamentos[i];
  CUR_EQ=e;
  const calc=CALCS[e.calculadora];
  if(!calc){
    $("#sheet").innerHTML=`
      <div class="head"><div class="ic">${icon(e)}</div>
        <div><h2>${e.modelo}</h2><div class="sub">${e.subtipo}</div></div>
        <button class="close" onclick="closeModal()">×</button></div>
      <div class="calcbody"><div class="inputs">
        <div class="placeholder" style="padding:8px 0"><b>Calculadora em desenvolvimento.</b><br>${e.descricao||""}</div>
        <div class="note">Referência prevista: ${e.referencia||"—"}</div>
      </div></div>`;
    $("#modal").classList.add("open");
    return;
  }
  if(!calc.campos[0]||calc.campos[0].id!=="eqTag"){ calc.campos.unshift({id:"eqTag",label:"TAG (identificação do equipamento)",tipo:"text",valor:"",placeholder:"ex.: PN-101 / TC-201"}); }
  const campos=calc.campos.map(f=>{
    if(f.tipo==="head"){return `<div class="fhead">${f.label}</div>`;}
    if(f.tipo==="text"){
      return `<div class="field"><label>${f.label}</label><input id="${f.id}" type="text" value="${f.valor||""}" placeholder="${f.placeholder||""}"/></div>`;
    }
    const auto=`runCalc('${e.calculadora}')`, autoSoft=`runCalc('${e.calculadora}',1)`;
    if(f.tipo==="select"){
      const eatt=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const ops=f.opcoes.map(o=>`<option value="${eatt(o.v)}"${o.v===f.valor?" selected":""}>${o.t}</option>`).join("");
      return `<div class="field"><label>${f.label}</label><select id="${f.id}" onchange="${f.onchange||auto}">${ops}</select></div>`;
    }
    return `<div class="field"><label>${f.label} ${f.unidade?`<span class="u">(${f.unidade})</span>`:""}</label>
      <input id="${f.id}" type="number" value="${f.valor}" step="${f.step||"any"}" oninput="${autoSoft}" onchange="${auto}"/></div>`;
  }).join("");
  $("#sheet").innerHTML=`
    <div class="head"><div class="ic">${icon(e)}</div>
      <div><h2>${e.modelo}</h2><div class="sub">${e.subtipo} · pré-dimensionamento</div></div>
      <button class="close" onclick="closeModal()">×</button></div>
    <div class="calcbody">
      <div class="inputs"><div class="sec-t">Dados de entrada</div>${campos}
        <button class="btn" onclick="runCalc('${e.calculadora}')">Calcular</button>
        <button class="btn btn2" onclick="gerarRelatorio()">Gerar relatório (PDF)</button>
        <button class="btn btn2" onclick="resetCampos('${e.calculadora}')" title="Restaura todos os campos aos valores padrão da calculadora">Restaurar padrões</button>
        ${ANIM[e.calculadora]||""}
      </div>
      <div class="results" id="results"><div class="sec-t">Resultados</div>
        <div class="placeholder">Preencha os dados e clique em <b>Calcular</b>.</div>
        <div class="note">Referência: ${calc.referencia}</div></div>
    </div>`;
  $("#modal").classList.add("open");
  runCalc(e.calculadora);
}
function runCalc(id,soft){
  const calc=CALCS[id];const r=calc.calcular();
  const box=$("#results");
  if(!r){if(soft&&box.querySelector("table.res"))return;box.innerHTML=`<div class="sec-t">Resultados</div><div class="placeholder">Verifique os dados de entrada (valores positivos).</div><div class="note">Referência: ${calc.referencia}</div>`;return;}
  const rows=r.map(x=> x.sec
    ? `<tr><td colspan="2" style="padding:16px 6px 6px;color:var(--teal-d);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--teal)">${x.sec}</td></tr>`
    : `<tr class="${x.hi?"highlight":""}"><td class="k">${x.k}</td><td class="v">${x.v}</td></tr>`).join("");
  box.innerHTML=`<div class="sec-t">Resultados</div><table class="res">${rows}</table>
    <div class="note">Estimativa de <b>pré-dimensionamento</b>. A seleção SEW usa torques nominais aproximados de catálogo — confirmar a escolha final no <a href="https://www.sew-eurodrive.com" target="_blank" rel="noopener">configurador oficial SEW</a>.<br><b>Resultado final majorado em 20%</b> (margem de projeto) — a seleção do motor/redutor SEW considera a potência majorada.<br>Referência: ${calc.referencia} · SEW-EURODRIVE (série R / motores DRN).</div>`;
}
function san(s){return String(s==null?"":s).replace(/³/g,"3").replace(/²/g,"2").replace(/⁴/g,"4").replace(/·/g,"-").replace(/≥/g,">=").replace(/≤/g,"<=").replace(/≈/g,"~").replace(/→/g,"->").replace(/⚠/g,"(!)").replace(/×/g,"x").replace(/√/g,"raiz").replace(/[−–—]/g,"-").replace(/φi/g,"fi").replace(/σc/g,"sc").replace(/σ1/g,"s1").replace(/σadm/g,"sadm").replace(/ρ/g,"ro").replace(/φ/g,"phi").replace(/δ/g,"delta").replace(/η/g,"eta").replace(/σ/g,"sigma").replace(/θ/g,"teta").replace(/α/g,"alfa").replace(/λ/g,"lambda").replace(/γ/g,"gama").replace(/β/g,"beta").replace(/π/g,"pi").replace(/τ/g,"tau").replace(/ε/g,"eps").replace(/[μµ]/g,"u").replace(/[ΔΘ]/g,"D").replace(/[Øø]/g,"O").replace(/[^\x00-\xFF]/g,"");}
function inputVal(f){var el=document.getElementById(f.id);if(!el)return "";if(f.tipo==="select")return el.options[el.selectedIndex].text;return el.value+(f.unidade?" "+f.unidade:"");}

      var abody=[
        [san("Capacidade Q / resultante"),san(String(Math.round(G.Q)))+" / "+san(String(Math.round(G.Qreal)))+" t/h"],

        [san("Elevação  H"),san(G.H.toFixed(2))+" m"],

        [san("Correia / peso Wb"),san(String(G.Bpol))+'" ('+san(String(G.Bmm))+" mm) "+san(G.tipoC)+" · "+san(G.Wb.toFixed(1))+" kgf/m"],
        [san("Kx  ·  Ky  ·  Wm"),san(G.Kx.toFixed(2))+"  ·  "+san(G.Ky.toFixed(2))+"  ·  "+san(G.Wm.toFixed(1))+" kgf/m"],

        alternateRowStyles:{fillColor:[244,247,250]},
        columnStyles:{0:{cellWidth:104},1:{cellWidth:78,halign:"right",fontStyle:"bold"}}});
      doc.setFontSize(7); doc.setTextColor(110);
      doc.text(san("Croqui esquemático (fora de escala) conforme a figura da pág. 1-21 do Manual de Britagem — alimentador de correia sob moega de alimentação."),14,doc.lastAutoTable.finalY+6);
    } else if(G.tipo==="moega"){
      /* ============ CROQUI EXECUTIVO DA MOEGA DE ALIMENTAÇÃO ============
         Área útil da página: x de 14 a 196 mm, y de 26 a 285 mm. Todo rótulo passa por
         fx(), que o mantém dentro das margens. A escala é única para as duas vistas e
         considera a altura TOTAL (colarinho + tremonha + montantes), de modo que os
         montantes saiam na mesma proporção do resto — e não esticados. */
      var XL=15, XR=195;
      function fx(x,w){ var h=(w||0)/2; return Math.max(XL+h,Math.min(XR-h,x)); }
      function fxL(x,w){ return Math.max(XL,Math.min(XR-w,x)); }
      function nt(x,y,t,r,g2,b2,fs){ var f=fs||6.2; doc.setTextColor(r,g2,b2); doc.setFontSize(f);

      function ntc(x,y,t,r,g2,b2,fs){ var f=fs||6.2; doc.setTextColor(r,g2,b2); doc.setFontSize(f);
        var w=doc.getTextWidth(san(t)); doc.text(san(t),fx(x,w),y,{align:"center"}); }
      function cotaH(x1,x2,y,t){ doc.setDrawColor(30,155,196); doc.setLineWidth(0.25);
        doc.line(x1,y,x2,y); doc.line(x1,y-1.4,x1,y+1.4); doc.line(x2,y-1.4,x2,y+1.4);
        ntc((x1+x2)/2,y-1.3,t,30,120,150,6.2); }
      function cotaV(x,y1,y2,t){ doc.setDrawColor(30,155,196); doc.setLineWidth(0.25);
        var xc=fx(x); doc.line(xc,y1,xc,y2); doc.line(xc-1.4,y1,xc+1.4,y1); doc.line(xc-1.4,y2,xc+1.4,y2);
        nt(xc+1.5,(y1+y2)/2,t,30,120,150,6.2); }

      /* ---------- ESCALA ÚNICA ----------
         Duas vistas lado a lado, cada uma com 70 mm de campo de desenho e 18 mm de
         corredor de cotas. Altura disponível para a elevação: 96 mm. */
      var Lg=Math.min(G.Hleg,Math.max(G.Htot*1.2,2.0));   // altura de perna desenhada

      var hCol=G.Hc*esc, hTr=G.H*esc, hLg=Lg*esc;
      var yMid=yTop+hCol, yBot=yMid+hTr, yLeg=yBot+hLg;

      function vista(cx,dimTopo,dimBoca,rotulo,ang,angLab,verticalEnd){
        var wT=dimTopo*esc/2, wB=dimBoca*esc/2;
        /* granel */

        if(hCol>1) doc.rect(cx-wT,yTop+1.5,2*wT,hCol-1.5,"F");
        doc.triangle(cx-wT,yMid,cx+wT,yMid,cx,yMid+hTr*0.9,"F");
        doc.setFillColor(228,206,158);
        doc.triangle(cx-wT*0.5,yTop+1.5,cx+wT*0.5,yTop+1.5,cx,yTop-5,"F");
        /* casco */
        doc.setDrawColor(20,40,60); doc.setLineWidth(1.0);
        if(hCol>1){ doc.line(cx-wT,yTop,cx-wT,yMid); doc.line(cx+wT,yTop,cx+wT,yMid);
                    doc.line(cx-wT,yTop,cx+wT,yTop); }
        doc.line(cx-wT,yMid,cx-wB,yBot); doc.line(cx+wT,yMid,cx+wB,yBot);
        doc.line(cx-wB,yBot,cx+wB,yBot);
        doc.setLineWidth(0.35); doc.setDrawColor(150,168,186);
        doc.line(cx-wT-2,yMid,cx+wT+2,yMid);
        /* montantes — nas arestas do topo, largura proporcional */
        var wCol=Math.max(1.8,esc*0.16);
        doc.setFillColor(70,92,122); doc.setDrawColor(45,62,86); doc.setLineWidth(0.4);
        [-1,1].forEach(function(sg){ doc.rect(cx+sg*wT-wCol/2,yMid,wCol,hLg,"FD"); });
        /* viga de apoio sob a transição */
        doc.setFillColor(90,112,142);
        doc.rect(cx-wT-wCol/2,yMid-1.4,2*wT+wCol,2.8,"F");
        /* contraventamento */
        doc.setDrawColor(70,92,122); doc.setLineWidth(0.45);

        /* placa de base */
        doc.setFillColor(45,62,86);
        [-1,1].forEach(function(sg){ doc.rect(cx+sg*wT-3.2,yLeg,6.4,1.5,"F"); });
        doc.setDrawColor(120,140,160); doc.setLineWidth(0.5);
        doc.line(cx-wT-8,yLeg+1.5,cx+wT+8,yLeg+1.5);
        for(var hx=0;hx<9;hx++){ var xh=cx-wT-8+(2*wT+16)*hx/8;
          doc.line(xh,yLeg+1.5,xh-2,yLeg+4); }
        /* cotas */
        cotaH(cx-wT,cx+wT,yTop-10,rotulo[0]);
        cotaH(cx-wB,cx+wB,yBot+8,rotulo[1]);
        /* ângulo */
        doc.setDrawColor(160,178,196); doc.setLineWidth(0.22);
        doc.line(cx-wT,yMid,cx-wT+12,yMid);
        nt(cx-wT+2,yMid+4.6,angLab+" = "+(verticalEnd?"90,0":ang.toFixed(1))+"°",95,115,140,6.2);
        ntc(cx,yTop-16,rotulo[2],85,105,130,7.2);
        return {wT:wT,wB:wB,wCol:wCol};
      }

      var vA=vista(cxA,G.A,G.C,["A = "+Math.round(G.A*1000)+" mm","C = "+Math.round(G.C*1000)+" mm","VISTA A-A"],G.alfaA,"aA",G.cunha);
      var vB=vista(cxB,G.B,G.D,["B = "+Math.round(G.B*1000)+" mm","D = "+Math.round(G.D*1000)+" mm","VISTA B-B"],G.alfaB,"aB",false);

      ntc(105,32,(G.cunha?"MOEGA EM CUNHA (fenda)":"MOEGA PIRAMIDAL")+" · escoamento "+(G.regPlano?"PLANO (rasgo)":"AXISSIMETRICO")+

      if(G.grOn){ doc.setDrawColor(40,90,140); doc.setLineWidth(0.7);
        for(var gi=0;gi<=6;gi++){ var gx=cxA-vA.wT+2*vA.wT*gi/6; doc.line(gx,yTop-2,gx,yTop+0.5); }
        doc.line(cxA-vA.wT,yTop-2,cxA+vA.wT,yTop-2);

      /* faixa de switch, na vista B */
      doc.setDrawColor(190,70,60); doc.setLineWidth(0.6);

      nt(cxB+wsw+1.5,yMid+hsw+1.4,"switch "+G.pSwitch.toFixed(0)+" kPa",190,70,60,6.0);

      /* cotas verticais — corredor à direita de cada vista */
      if(hCol>1) cotaV(cxA+vA.wT+7,yTop,yMid,"Hc="+Math.round(G.Hc*1000));
      cotaV(cxA+vA.wT+7,yMid,yBot,"H = "+Math.round(G.H*1000)+" mm");
      cotaV(cxB+vB.wT+7,yMid,yLeg,"livre "+G.Hleg.toFixed(2)+" m");

      /* cargas nos apoios — abaixo da linha de terra, centralizadas */
      var yC=yLeg+8;
      doc.setDrawColor(190,70,60); doc.setLineWidth(0.6);
      [-1,1].forEach(function(sg){ var xm=cxA+sg*vA.wT;
        doc.line(xm,yC-4,xm,yC+1); doc.line(xm-1.2,yC-1.2,xm,yC+1); doc.line(xm+1.2,yC-1.2,xm,yC+1); });
      ntc(cxA,yC+5,"V = "+G.Pcol.toFixed(0)+" kN ("+fmt(Math.round(G.Pcol*1000/9.80665))+" kg) por montante",190,70,60,6.4);
      doc.setDrawColor(40,140,90); doc.setLineWidth(0.6);
      doc.line(cxB-vB.wT-10,yC-2,cxB-vB.wT-2,yC-2);
      doc.line(cxB-vB.wT-4.6,yC-3.4,cxB-vB.wT-2,yC-2);
      doc.line(cxB-vB.wT-4.6,yC-0.6,cxB-vB.wT-2,yC-2);
      ntc(cxB,yC+5,"acao lateral "+G.Flat.toFixed(0)+" kN — "+G.latGov,40,140,90,6.4);

      /* ---------- PLANTA ---------- */
      var yP0=yC+14;
      var pEsc=Math.min(58/Math.max(G.A,G.B),(258-yP0-8)/Math.max(G.B,0.1));
      var px=105, py=yP0+G.B*pEsc/2+4;
      var pa=G.A*pEsc/2, pb=G.B*pEsc/2, pc=G.C*pEsc/2, pd=G.D*pEsc/2;
      doc.setFillColor(248,244,234); doc.rect(px-pa,py-pb,2*pa,2*pb,"F");
      doc.setDrawColor(20,40,60); doc.setLineWidth(0.9);
      doc.rect(px-pa,py-pb,2*pa,2*pb);
      doc.setDrawColor(140,160,180); doc.setLineWidth(0.28);
      if(G.cunha){ doc.line(px-pa,py-pd,px+pa,py-pd); doc.line(px-pa,py+pd,px+pa,py+pd); }
      else { doc.line(px-pa,py-pb,px-pc,py-pd); doc.line(px+pa,py-pb,px+pc,py-pd);
             doc.line(px-pa,py+pb,px-pc,py+pd); doc.line(px+pa,py+pb,px+pc,py+pd); }
      doc.setDrawColor(190,70,60); doc.setLineWidth(0.8);
      doc.rect(px-pc,py-pd,2*pc,2*pd);
      /* aresta de vale (só na pirâmide) */
      if(!G.cunha&&!G.regPlano){ doc.setDrawColor(205,125,40); doc.setLineWidth(0.7);
        doc.line(px-pa,py-pb,px-pc,py-pd); }
      nt(px-pa-1,py-pb-2.6,(G.regPlano?"regime PLANO (rasgo "+G.razBoca.toFixed(1)+":1)  ·  ":"regime AXISSIMETRICO  ·  ")+
        G.govNome+" = "+G.alfaGov.toFixed(1)+"°  (exigido "+G.alfaExig.toFixed(1)+"°)"+(G.fluxoMassa?"  ATENDE":"  NAO ATENDE"),

      cotaH(px-pa,px+pa,py+pb+7,"A = "+Math.round(G.A*1000)+" mm");
      cotaV(px+pa+7,py-pb,py+pb,"B = "+Math.round(G.B*1000));

      /* ---------- TABELAS EM PÁGINA PRÓPRIA ---------- */
      doc.addPage();
      doc.setFillColor(14,27,46); doc.rect(0,0,W,20,"F");

        headStyles:{fillColor:[22,38,60],textColor:255,fontSize:8.4},
        columnStyles:{0:{cellWidth:88},1:{cellWidth:94,halign:"right",fontStyle:"bold"}},
        head:[["Geometria e fluxo","Valor"]],
        body:[
          [san("Tipo de moega"),san(G.cunha?"Em cunha (fenda)":"Piramidal")],
          [san("A x B (topo)"),san(Math.round(G.A*1000)+" x "+Math.round(G.B*1000)+" mm")],

          [san("Abertura minima exigida"),san(Math.round(G.Bmin*1000)+" mm "+(G.bocaOK?"(atende)":"(INSUFICIENTE)"))],
          [san("Volume geometrico / util"),san(G.Vgeo.toFixed(2)+" / "+G.Vutil.toFixed(2)+" m3")],
          [san("Massa util armazenada"),san(G.Mutil.toFixed(2)+" t")],
          [san("Autonomia a "+G.Q.toFixed(0)+" t/h"),san(G.autonMin.toFixed(1)+" min")],
          [san("Descarga por gravidade (Beverloo)"),san(G.Qbev.toFixed(0)+" t/h  ("+G.folgaQ.toFixed(1)+"x)")]
        ]});
      doc.autoTable({startY:doc.lastAutoTable.finalY+4,theme:"grid",margin:{left:14,right:14},
        styles:{fontSize:8,cellPadding:1.6},
        headStyles:{fillColor:[22,38,60],textColor:255,fontSize:8.4},
        columnStyles:{0:{cellWidth:88},1:{cellWidth:94,halign:"right",fontStyle:"bold"}},
        head:[["Acoes e pressoes","Valor"]],
        body:[
          [san("Pressao horizontal de projeto (ph + patch)"),san(G.phTot.toFixed(1))+" kPa"],
          [san("Pressao vertical na transicao pv"),san(G.pvD.toFixed(1))+" kPa"],
          [san("Pressao normal na tremonha pnf"),san(G.pnDes.toFixed(1))+" kPa"],
          [san("PRESSAO DE SWITCH"),san(G.pSwitch.toFixed(1))+" kPa em "+san(String(Math.round(G.hSwitch*1000)))+" mm"],
          [san("Tracao meridional"),san(G.nMer.toFixed(1))+" kN/m"],
          [san("Vento — Vk"),san(G.Vk.toFixed(1))+" m/s"],
          [san("ACAO LATERAL GOVERNANTE"),san(G.Flat.toFixed(0))+" kN — "+san(G.latGov)],
          [san("Peso proprio (vazia)"),san(fmt(Math.round(G.mVazio)))+" kg"],
          [san("Peso do granel"),san(G.Wmat.toFixed(0))+" kN ("+san(fmt(kgf(G.Wmat)))+" kg)"],
          [san("REACAO VERTICAL TOTAL"),san((G.Wperm+G.Wmat).toFixed(0))+" kN"],
          [san("Carga por montante"),san(G.Pcol.toFixed(0))+" kN ("+san(fmt(kgf(G.Pcol)))+" kg)"],
          [san(G.movel?"Impacto da descarga":"Equipamento movel"),san(G.movel?(G.Fimp.toFixed(0)+" kN"):"nao aplicavel")],
          [san(G.movel?"Choque na defensa":"—"),san(G.movel?(G.Fdef.toFixed(0)+" kN"):"—")]
        ]});
      doc.autoTable({startY:doc.lastAutoTable.finalY+4,theme:"grid",margin:{left:14,right:14},
        styles:{fontSize:8,cellPadding:1.6},
        headStyles:{fillColor:[22,38,60],textColor:255,fontSize:8.4},
        columnStyles:{0:{cellWidth:88},1:{cellWidth:94,halign:"right",fontStyle:"bold"}},
        head:[["Estrutura","Perfil / dimensao"]],
        body:[
          [san("Chapa da moega (com sobrespessura)"),san(G.tcom.toFixed(1))+" mm"],

        [san("Comprimento de ancoragem mínimo"),san(String(G.Lanc))+" mm"],
        [san("Reação vertical — permanente (serviço)"),san(G.Rv_perm.toFixed(0))+" kN  ("+fmt(kgf(G.Rv_perm))+" kg)"],
        [san("Reação vertical — total (serviço)"),san(G.Rv_tot.toFixed(0))+" kN  ("+fmt(kgf(G.Rv_tot))+" kg)"],
        [san("Reação vertical — ELU"),san(G.Rv_ELU.toFixed(0))+" kN  ("+fmt(kgf(G.Rv_ELU))+" kg)"],
        [san("Reação horizontal por montante"),san(G.Rh_col.toFixed(0))+" kN  ("+fmt(kgf(G.Rh_col))+" kg)"],
        [san("TRAÇÃO DE ARRANCAMENTO (ELU)"),san(G.Ntrac.toFixed(0))+" kN  ("+fmt(kgf(G.Ntrac))+" kg)"],
        [san("Contraventamento"),(G.Kbuc<2)?san("pórtico contraventado (K 1,0)"):san("sem contraventamento (K 2,0)")]
      ],y4+5);
      var y6=tab("6 — PESOS, FADIGA E DINÂMICA",[
        [san("PESO SECO DO SILO (estrutura)"),san((G.pesoSeco/1000).toFixed(1))+" t"],
        [san("Revestimento interno"),san((G.pLiner/1000).toFixed(2))+" t"],
        [san("Material armazenado (cheio)"),san((G.pesoMat/1000).toFixed(1))+" t"],
        [san("PESO TOTAL COM SILO CHEIO"),san((G.pesoCheio/1000).toFixed(1))+" t"],
        [san("Área de parede / de tremonha"),san(G.Aparede.toFixed(0))+" / "+san(G.Atrem.toFixed(0))+" m²"],
        [san("Fadiga — ciclos de projeto"),san(String(G.Ntot))],
        [san("Fadiga — Δσ / Δσ admissível"),san(G.dSig.toFixed(0))+" / "+san(G.dSigAdm.toFixed(0))+" MPa"+(G.fadOK?san("  OK"):san("  NAO ATENDE"))],
        [san("Frequência natural da estrutura"),san(G.fn.toFixed(2))+" Hz"],
        [san("Força de impacto no enchimento"),san(G.Fimp.toFixed(1))+" kN"],
        [san("Dispositivos anti-arco"),G.coeso?(san(String(G.nCanhoes))+" canhões de "+san(String(G.volCanhao))+" L"):san("não requeridos")],
        [san("INTERFACE ALIMENTADOR — σv boca (fluxo / partida)"),san(G.interfSv.toFixed(1))+" / "+san(G.interfSvI.toFixed(1))+" kPa"],[san("INTERFACE ALIMENTADOR — Fv boca (fluxo / partida)"),san(G.interfFv.toFixed(1))+" / "+san(G.interfFvI.toFixed(1))+" kN ("+fmt(kgf(G.interfFv))+" / "+fmt(kgf(G.interfFvI))+" kg)"]
      ],y5+5);
      doc.setFontSize(7); doc.setTextColor(110);
      doc.text(san("Croqui e tabelas de pré-dimensionamento executivo — Jenike (fluxo), EN 1991-4/NBR 11700 (ações), NBR 6123 (vento), NBR 15421 (sismo) e NBR 8800 (estrutura)."),14,y6+6);
      doc.text(san("Não substitui ensaio Jenike Shear do material real, projeto de fundação (NBR 6122/6118), detalhamento de ligações e ART do responsável técnico."),14,y6+10);
    } else {
    var cx=80, wH=26, oH=8, topY=50, transY=112, botY=142, G_LEG=14;
    // preenchimento do material (corpo + moega)
    doc.setFillColor(245,228,190);
    doc.rect(cx-wH,topY,2*wH,transY-topY,"F");
    doc.lines([[2*wH,0],[-(wH-oH),botY-transY],[-2*oH,0],[-(wH-oH),-(botY-transY)]],cx-wH,transY,[1,1],"F",true);
    // contornos do silo
    doc.setDrawColor(20,40,60); doc.setLineWidth(0.7);
    doc.line(cx-wH,topY,cx,topY-11); doc.line(cx,topY-11,cx+wH,topY);
    doc.line(cx-wH,topY,cx-wH,transY); doc.line(cx+wH,topY,cx+wH,transY); doc.line(cx-wH,topY,cx+wH,topY);
    doc.line(cx-wH,transY,cx-oH,botY); doc.line(cx+wH,transY,cx+oH,botY);
    doc.line(cx-wH,transY,cx+wH,transY); doc.line(cx-oH,botY,cx+oH,botY);
    // linhas de cota
    doc.setDrawColor(30,155,196); doc.setLineWidth(0.3); doc.setTextColor(30,120,150); doc.setFontSize(8);
    var dy=topY-7; doc.line(cx-wH,dy,cx+wH,dy); doc.line(cx-wH,dy-1.6,cx-wH,dy+1.6); doc.line(cx+wH,dy-1.6,cx+wH,dy+1.6);
    doc.text((G.tipo==="ret"?"a = ":"D = ")+san(G.D.toFixed(2))+" m",cx,dy-1.2,{align:"center"});
    var rx=cx+wH+9; doc.line(rx,topY,rx,transY); doc.line(rx-1.6,topY,rx+1.6,topY); doc.line(rx-1.6,transY,rx+1.6,transY);
    doc.text("H = "+san(G.Hcil.toFixed(2))+" m",rx+2,(topY+transY)/2+1);
    doc.line(rx,transY,rx,botY); doc.line(rx-1.6,transY,rx+1.6,transY); doc.line(rx-1.6,botY,rx+1.6,botY);
    doc.text("hc = "+san(G.hc.toFixed(2))+" m",rx+2,(transY+botY)/2+1);
    var lx=cx-wH-9; doc.line(lx,topY,lx,botY); doc.line(lx-1.6,topY,lx+1.6,topY); doc.line(lx-1.6,botY,lx+1.6,botY);
    doc.text("Htot = "+san(G.Htot.toFixed(2))+" m",lx-2,(topY+botY)/2+1,{align:"right"});
    var by=botY+7; doc.line(cx-oH,by,cx+oH,by); doc.line(cx-oH,by-1.6,cx-oH,by+1.6); doc.line(cx+oH,by-1.6,cx+oH,by+1.6);
    doc.text("B = "+san(String(Math.round(G.Brec*1000)))+(G.tipo==="ret"&&G.cunha?(" x "+String(Math.round(G.Bl*1000))):"")+" mm",cx,by+4,{align:"center"});
    if(G.tipo==="ret"){
      // cotas extras do retangular: angulos de face, vale, chapas, cintas e montantes
      doc.text("face "+san(G.alfaB.toFixed(0))+"°",cx+oH+4,botY-3);
      doc.setTextColor(G.flowShallow?200:30,G.flowShallow?60:120,G.flowShallow?60:150);
      doc.text((G.cunha?"aresta ":"VALE ")+san(G.alfaVale.toFixed(0))+"° (exig. "+san(G.alfaFlow.toFixed(0))+"°)",cx-oH-4,botY-3,{align:"right"});
      doc.setTextColor(30,120,150);
      // CINTAS horizontais (traço cheio, ultrapassando a parede) — a cada s
      doc.setDrawColor(200,120,40); doc.setLineWidth(0.7);
      var nc=Math.max(1,Math.min(G.nCintas,12)), passo=(transY-topY)/(nc+1);
      for(var ic=1;ic<=nc;ic++){ var yc=topY+passo*ic; doc.line(cx-wH-2.5,yc,cx+wH+2.5,yc); }
      doc.setFontSize(6.5); doc.setTextColor(190,110,30);
      doc.text(san(String(G.nCintas))+" cintas @ "+san(G.sst.toFixed(2))+" m",cx+wH+4,topY+passo+2);
      doc.text(san(G.perfilCinta),cx+wH+4,topY+passo+6);
      // ENRIJECEDORES verticais (tracejado fino entre as cintas)
      doc.setDrawColor(90,120,150); doc.setLineWidth(0.35);
      var nv=5;
      for(var iv=1;iv<=nv;iv++){ var xv=cx-wH+(2*wH)*iv/(nv+1); for(var yy=topY+1;yy<transY-1;yy+=3){ doc.line(xv,yy,xv,Math.min(yy+1.6,transY-1)); } }
      doc.setFontSize(6.5); doc.setTextColor(80,110,140);
      doc.text("enrijecedores verticais: "+san(G.perfilEnr),cx-wH-3,transY+4,{align:"right"});
      // montantes
      doc.setDrawColor(20,40,60); doc.setLineWidth(0.9);
      doc.line(cx-wH+3,botY,cx-wH+3,botY+G_LEG); doc.line(cx+wH-3,botY,cx+wH-3,botY+G_LEG);
      doc.setFontSize(6.5); doc.setTextColor(110,140,165);
      doc.text(san(String(G.Ncol))+" montantes · L = "+san(G.Hleg.toFixed(1))+" m",cx,botY+G_LEG+4,{align:"center"});
      doc.text(san(G.perfilCol),cx,botY+G_LEG+8,{align:"center"});
      // espessuras indicadas na parede e na tremonha
      doc.setFontSize(6.5); doc.setTextColor(60,90,120);
      doc.text("chapa "+san(G.tcom.toFixed(1))+" mm",cx-wH-3,(topY+transY)/2,{align:"right",angle:90});
      doc.text("chapa "+san(G.thopcom.toFixed(1))+" mm",cx+oH+6,(transY+botY)/2+4);
      doc.setFontSize(8); doc.setTextColor(30,120,150);
    } else {
      doc.text("ang. moega "+san(G.alfa.toFixed(0))+"°",cx+oH+4,botY-3);
    }
    // legenda com as medidas resultantes
    var legBody=[];
    if(G.tipo==="ret"){
      legBody.push([san("Seção interna  a × b"),san(G.D.toFixed(2))+" × "+san(G.b.toFixed(2))+" m"]);
      legBody.push([san("Altura 1 — parte reta  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura 2 — tremonha  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Tipo de tremonha"),G.cunha?"Cunha (fenda) — fluxo plano":"Piramidal — fluxo cônico"]);
      legBody.push([san("Boca de descarga"),G.cunha?(san(String(Math.round(G.Brec*1000)))+" × "+san(String(Math.round(G.Bl*1000)))+" mm"):(san(String(Math.round(G.Brec*1000)))+" mm")]);
      legBody.push([san("Ângulo de face (a / b)"),san(G.alfaA.toFixed(0))+"° / "+san(G.alfaB.toFixed(0))+"°"]);
      legBody.push([san(G.cunha?"Ângulo da aresta":"ÂNGULO DE VALE (governa o fluxo)"),san(G.alfaVale.toFixed(0))+"°  (exigido "+san(G.alfaFlow.toFixed(0))+"°)"+(G.flowShallow?"  (!) RASO":"  OK")]);
      legBody.push([san("Volume útil requerido / da geometria"),san(G.Vutil.toFixed(1))+" / "+san(G.Vgeo.toFixed(1))+" m³"]);
      legBody.push([san("Pressão horizontal de projeto  ph,d"),san(G.phD.toFixed(1))+" kPa"]);
      legBody.push([san("Chapa da parede (lado a / lado b)"),san(G.tA.toFixed(1))+" / "+san(G.tB.toFixed(1))+" mm"]);
      legBody.push([san("Chapa da tremonha"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Enrijecedores — espaçamento  s"),san(G.sst.toFixed(2))+" m"+(G.otimS?"  (otimizado)":"")]);
      legBody.push([san("Cintas — quantidade / W requerido"),san(String(G.nCintas))+" un / "+san(String(Math.round(G.Wreq)))+" cm³"]);
      legBody.push([san("PERFIL DA CINTA"),san(G.perfilCinta)]);
      legBody.push([san("Cinta — alternativas"),san(G.altCinta||"-")]);
      legBody.push([san("PERFIL DO ENRIJECEDOR VERTICAL"),san(G.perfilEnr)]);
      legBody.push([san("Enrijecedor — alternativas"),san(G.altEnr||"-")]);
      legBody.push([san("Cinta — inércia p/ pressão externa  I"),san(G.Ireq.toFixed(0))+" cm⁴"]);
      legBody.push([san("Vento (Vk) · sucção · vácuo"),san(G.Vk.toFixed(1))+" m/s · "+san(G.pvento.toFixed(2))+" · "+san(G.pvac.toFixed(1))+" kPa"]);
      legBody.push([san("Pressão externa de projeto  q_ext"),san(G.qext.toFixed(2))+" kPa"]);
      legBody.push([san("Montantes — quantidade"),san(String(G.Ncol))+(G.otimN?"  (otimizado)":"")]);
      legBody.push([san("Montante — carga / área / raio de giração"),san(String(Math.round(G.Pcol)))+" kN / "+san(G.Areq.toFixed(0))+" cm² / "+san(G.imin.toFixed(1))+" cm"]);
      legBody.push([san("PERFIL DO MONTANTE"),san(G.perfilCol)]);
      legBody.push([san("Montante — alternativas"),san(G.altMont||"-")]);
      legBody.push([san("PESO SECO DO SILO (estrutura)"),san((G.pesoSeco/1000).toFixed(1))+" t"]);
      legBody.push([san("Material armazenado (cheio)"),san((G.pesoMat/1000).toFixed(1))+" t"]);
      legBody.push([san("PESO TOTAL COM SILO CHEIO"),san((G.pesoCheio/1000).toFixed(1))+" t"]);
      legBody.push([san("Altura livre dos montantes  L"),san(G.Hleg.toFixed(1))+" m"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }else{
      legBody.push([san("Diâmetro interno  D"),san(G.D.toFixed(2))+" m"]);
      legBody.push([san("Altura cilíndrica  H"),san(G.Hcil.toFixed(2))+" m"]);
      legBody.push([san("Altura da moega (tremonha)  hc"),san(G.hc.toFixed(2))+" m"]);
      legBody.push([san("Altura total  Htot"),san(G.Htot.toFixed(2))+" m"]);
      legBody.push([san("Lado da boca de descarga  B"),san(String(Math.round(G.Brec*1000)))+" mm"]);
      legBody.push([san("Ângulo da moega (com a horizontal)"),san(G.alfa.toFixed(0))+"°"]);
      legBody.push([san("Volume útil de armazenagem"),san(G.Vutil.toFixed(1))+" m³"]);
      legBody.push([san("Espessura da chapa do corpo"),san(G.tcom.toFixed(1))+" mm"]);
      legBody.push([san("Espessura da chapa da moega"),san(G.thopcom.toFixed(1))+" mm"]);
      legBody.push([san("Aço estrutural  fy"),G.fy+" MPa"]);
    }
    doc.autoTable({startY:botY+(G.tipo==="ret"?26:16),theme:"grid",margin:{left:14,right:14},
      head:[["Medida resultante do cálculo","Valor"]],
      body:legBody,
      headStyles:{fillColor:[22,38,60],textColor:255,fontSize:9},bodyStyles:{fontSize:8.5},
      alternateRowStyles:{fillColor:[244,247,250]},
      columnStyles:{0:{cellWidth:120},1:{cellWidth:62,halign:"right",fontStyle:"bold"}}});
    doc.setFontSize(7); doc.setTextColor(110);
    doc.text(san("Croqui esquemático (fora de escala) — medidas resultantes do pré-dimensionamento."),14,doc.lastAutoTable.finalY+6);
    }
    doc.setFontSize(7); doc.setTextColor(150);
    doc.text("ProjectARK Engenharia · Dimensionamento de Equipamentos",14,290);
  }
  doc.save("ProjectARK-"+CUR_EQ.calculadora+".pdf");
}
function closeModal(){$("#modal").classList.remove("open");}
$("#burger").addEventListener("click",openDrawer);
$("#overlay").addEventListener("click",closeDrawer);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();}});

fetch("equipamentos.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  DB=d;
  $("#htag").innerHTML="Versão "+d.meta.versao+"<br>"+d.equipamentos.length+" equipamento(s)";
  $("#foot").textContent="ProjectARK · Pré-dimensionamento de Equipamentos · v"+d.meta.versao;
  buildMenu();render();
}).catch(()=>{$("#grid").innerHTML='<p style="color:#b33">Erro ao carregar equipamentos.json — abra via servidor (GitHub Pages).</p>';});
</script>
</body>
</html>
