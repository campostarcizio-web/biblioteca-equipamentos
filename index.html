<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProjectARK · Pré-dimensionamento de Equipamentos</title>
<style>
  :root{
    --navy:#0E1B2E; --navy2:#16263d; --navy3:#1d3047;
    --teal:#1E9BC4; --teal-d:#16789a; --gold:#D9A94A;
    --bg:#eef1f4; --card:#ffffff; --ink:#1c2733; --muted:#5f6b78; --line:#d7dde3;
    --ok:#2e8b4f; --okbg:#e7f4ec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:var(--teal-d)}
  header{position:sticky;top:0;z-index:40;overflow:visible;background:#0e1b2e;border-bottom:3px solid var(--gold);padding:7px 18px;display:flex;align-items:center;gap:18px}
  .hsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--navy2);border:1px solid var(--navy3);border-radius:8px;padding:0 11px;height:36px;min-width:230px;transition:.15s}
  .hsearch:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(30,155,196,.18)}
  .hsearch svg{width:15px;height:15px;color:#6f8aa3;flex:none}
  .hsearch input{background:none;border:none;outline:none;color:#eaf1f7;font-size:.82rem;width:100%;font-family:inherit}
  .hsearch input::placeholder{color:#6f8aa3}
  .lang{display:flex;align-items:center;gap:2px;padding-left:8px;margin-left:2px;border-left:1px solid var(--navy3);flex:none}
  .lang button{background:none;border:none;padding:3px 2px 5px;cursor:pointer;position:relative;opacity:.42;filter:saturate(.25);transition:.18s;line-height:0}
  .lang button:hover{opacity:.85;filter:saturate(.85)}
  .lang button.on{opacity:1;filter:none}
  .lang button.on::after{content:"";position:absolute;left:2px;right:2px;bottom:0;height:2px;border-radius:2px;background:var(--teal)}
  .lang svg{width:26px;height:18px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
  .langnote{margin:0 0 14px;padding:9px 12px;border-radius:8px;background:#eef4f8;border:1px solid #d7e6ef;
    color:#16789a;font-size:.78rem;display:none}
  body.en .langnote{display:block}
  .hver{text-align:right;line-height:1.3;flex:none;padding-left:4px}
  .hver .k{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#7f9bb3}
  .hver .v{font-size:.8rem;color:var(--gold);font-weight:500}
  .emblem{height:58px;display:block;flex:none}
  .wm .l1{font-size:1.32rem;font-weight:800;line-height:1.08;letter-spacing:.2px}
  .wm .l1 .p{color:#f4f7fa}.wm .l1 .a{color:#1E9BC4}.wm .l1 .e{color:#D9A94A}
  .wm .l2{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:#1E9BC4;margin-top:2px}
  .burger{display:none;background:var(--navy2);border:1px solid var(--navy3);color:#fff;width:40px;height:40px;border-radius:7px;font-size:1.2rem;cursor:pointer;flex:none}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:42px;height:42px;flex:none}
  .brand .t1{font-size:1.25rem;font-weight:800}
  .brand .t1 .p{color:#f4f7fa}.brand .t1 .a{color:var(--teal)}
  .brand .t2{font-size:.62rem;letter-spacing:.26em;color:var(--gold);font-weight:600}
  .htag{display:none}
  .layout{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:30}
  .overlay.open{display:block}
  aside{width:264px;flex:none;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 65px);padding:14px 0}
  aside h2{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:#8794a2;margin:0 16px 10px;font-weight:500}
  .navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:8px 16px;cursor:pointer;font-size:.88rem;border-left:3px solid transparent;font-family:inherit;transition:.12s}
  .navitem .n{font-size:.68rem;color:#98a4b1;font-weight:500;flex:none}
  .navitem.active .n{color:var(--teal-d);background:#dbeef5;border-radius:20px;padding:1px 7px}
  .navitem.all{font-weight:500}
  .navitem:hover{background:#f1f5f8;color:var(--teal-d)}
  .navitem.active{background:#eff6fa;color:var(--teal-d);border-left-color:var(--gold);font-weight:500}
  .grphead{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--ink);padding:10px 16px;cursor:pointer;font-size:.89rem;font-weight:500;border-left:3px solid transparent;font-family:inherit;transition:.12s}
  .grphead .n{font-size:.68rem;color:#98a4b1;font-weight:500;margin-left:auto}
  .grphead:hover{background:#f1f5f8}
  .grp.active>.grphead{border-left-color:var(--gold);color:var(--teal-d)}
  .grp.open .arrow{transform:rotate(90deg)}
  .arrow{color:var(--muted);transition:.15s;font-size:.8rem}
  .subs{display:none}.grp.open .subs{display:block}
  .subs .navitem{padding-left:34px;font-size:.85rem;color:var(--muted)}
  .subs .navitem.active{color:var(--teal-d)}
  main{flex:1;min-width:0;padding:0 20px 60px}
  .crumb{padding:14px 2px 6px;color:var(--muted);font-size:.82rem}
  .toolbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:6px 2px 13px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .toolbar h1{font-size:1.22rem;margin:0;font-weight:500;letter-spacing:-.01em}
  .toolbar .tsub{font-size:.76rem;color:var(--muted);margin-top:2px}
  .toolbar .tt{flex:1;min-width:200px}
  .count{color:var(--muted);font-size:.84rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
  .empty{color:var(--muted);font-size:.88rem;padding:30px 4px}
  .card{position:relative;isolation:isolate;background:transparent;border:none;border-radius:12px;padding:15px 16px 12px;cursor:pointer;transition:.22s;display:flex;flex-direction:column;height:100%;box-shadow:0 1px 2px rgba(14,27,46,.05),0 10px 26px -12px rgba(14,27,46,.20)}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:13px;padding:1.4px;z-index:-1;
    background:conic-gradient(from var(--ang),transparent 0 62%,var(--acc,#1E9BC4) 76%,#ffffff 82%,var(--acc,#1E9BC4) 88%,transparent 96%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:pa-spin 7s linear infinite;animation-delay:inherit;opacity:.85}
  .card::after{content:"";position:absolute;inset:0;border-radius:12px;border:1px solid #e4e9ee;background:#fff;z-index:-1}
  .card .top{display:flex;gap:11px;align-items:flex-start;margin-bottom:10px}
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(14,27,46,.06),0 18px 40px -14px rgba(14,27,46,.30)}
  .card:hover::before{opacity:1;animation-duration:3.2s}
  .card:hover .go{filter:brightness(.85)}
  .card:hover .go .arw{transform:translateX(3px)}
  .card .icon{width:42px;height:42px;flex:none;color:var(--acc,#0E1B2E);background:color-mix(in srgb,var(--acc,#1E9BC4) 9%,#fff);border:1px solid color-mix(in srgb,var(--acc,#1E9BC4) 22%,#fff);border-radius:9px;padding:7px}
  .card .cat{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--acc,#16789a);font-weight:500;min-height:2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
  .card h3{margin:2px 0 0;font-size:.98rem;font-weight:500;letter-spacing:-.005em;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
  .card .desc{color:var(--muted);font-size:.79rem;line-height:1.55;min-height:4.9em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .card .norms{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0 0;min-height:1.5em}
  .card .norms span{font-size:.62rem;color:#5f6b78;background:#f1f4f7;border:1px solid #e3e8ed;border-radius:5px;padding:2px 6px;white-space:nowrap}
  .card .go{margin-top:auto;padding-top:10px;border-top:1px solid #f0f3f6;display:flex;align-items:center;justify-content:space-between;color:var(--acc,#16789a);font-size:.76rem;font-weight:500;transition:.16s}
  .card .go .arw{transition:transform .16s;font-size:.95rem;line-height:1}
  .card .go.soon{color:#8a6d1f}
  .card .calcflag{display:inline-block;margin-top:7px;font-size:.68rem;font-weight:700;color:var(--teal-d);background:#e8f5fa;border:1px solid #bfe3f0;border-radius:20px;padding:2px 8px}
  .card .calcflag.soon{color:#8a6d1f;background:#fbf3df;border-color:#ecd9a6}


  /* ============ VIDA: LEDs, profundidade e cor por grupo ============
     O LED é um filete percorrendo a borda, feito com gradiente cônico mascarado.
     Cada card recebe uma defasagem própria, de modo que o conjunto não pulsa junto. */
  @property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
  @keyframes pa-spin{to{--ang:360deg}}
  @keyframes pa-sweep{0%{transform:translateX(-120%)}100%{transform:translateX(560%)}}
  /* O gradiente TEM de cobrir o texto em todo o ciclo: com no-repeat e deslocamento
     além da caixa, as letras ficariam sem pintura e sumiriam. Por isso o padrão é
     repetido e o deslocamento é de exatamente um ladrilho, o que fecha o laço sem emenda. */
  @keyframes wm-shine{from{background-position:0 0}to{background-position:200% 0}}
  /* brilho percorrendo o texto do logotipo — as cores originais são preservadas:
     o gradiente usa currentColor nas pontas, e só a faixa central é a luz. */
  .wm .l1 span{
    background-image:linear-gradient(104deg,currentColor 0 42%,var(--sh) 50%,currentColor 58% 100%);
    background-size:200% 100%;background-repeat:repeat;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:wm-shine 6.5s linear infinite}
  .wm .l1 .p{--sh:#8fd8f2;animation-delay:-.7s}
  .wm .l1 .a{--sh:#dcf5ff;animation-delay:-.35s}
  .wm .l1 .e{--sh:#ffeec4;animation-delay:0s}
  .goldbar{position:absolute;left:0;bottom:-3px;width:16%;height:3px;pointer-events:none;
    background:linear-gradient(90deg,transparent,#7fd4ef,transparent);animation:pa-sweep 6s linear infinite}
  .navdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--gc,#98a4b1)}
  @media (prefers-reduced-motion:reduce){
    .card::before,.goldbar,.wm .l1 span{animation:none}
    .wm .l1 span{-webkit-text-fill-color:currentColor}
  }

  .modal{position:fixed;inset:0;background:rgba(14,27,46,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
  .modal.open{display:flex}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:880px;width:100%;padding:0;overflow:hidden}
  .sheet .head{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px}
  .sheet .head .ic{width:40px;height:40px;color:var(--gold)}
  .sheet .head h2{margin:0;font-size:1.2rem}
  .sheet .head .sub{color:#9fb2c4;font-size:.82rem}
  .sheet .head .close{margin-left:auto;background:none;border:none;color:#9fb2c4;font-size:1.7rem;cursor:pointer;line-height:1}
  .calcbody{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .inputs{padding:20px 24px;border-right:1px solid var(--line)}
  .results{padding:20px 24px;background:#f7f9fb}
  .sec-t{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);font-weight:700;margin:0 0 12px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
  .fhead{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-d);font-weight:700;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .field .u{color:#9aa6b2;font-weight:400}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:.92rem;color:var(--ink);background:#fff}
  .field input:focus,.field select:focus{outline:2px solid var(--teal)}
  .btn{width:100%;margin-top:6px;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:11px;font-size:.95rem;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--teal-d)}
  .btn2{background:#fff;color:var(--teal-d);border:1px solid var(--teal);margin-top:8px}
  .btn2:hover{background:#eef7fb}
  .vid{margin-top:18px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0e1b2e}
  .vid svg{width:100%;height:auto;display:block}
  .vid .cap{color:#9fb2c4;font-size:.72rem;text-align:center;padding:7px 8px;border-top:1px solid #22344a}
  table.res{width:100%;border-collapse:collapse;font-size:.9rem}
  table.res td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.res td.k{color:var(--muted)}
  table.res td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .highlight td{background:#eef9f1}
  .highlight td.v{color:var(--ok)}
  .placeholder{color:var(--muted);font-size:.9rem;text-align:center;padding:30px 10px}
  .note{font-size:.76rem;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  footer{background:var(--navy);color:#9fb2c4;font-size:.8rem;padding:16px 20px;text-align:center;border-top:3px solid var(--gold)}
  @media(max-width:900px){.burger{display:block}.emblem{height:46px}.wm .l1{font-size:1.05rem}.wm .l2{font-size:.62rem}aside{position:fixed;top:72px;left:0;height:calc(100% - 72px);transform:translateX(-100%);transition:.22s;z-index:35}aside.open{transform:translateX(0)}.htag{display:none}.calcbody{grid-template-columns:1fr}.inputs{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <button class="burger" id="burger">☰</button>
  <div class="brand">
    <img class="emblem" src="logo1.png.png?v=2" alt="ProjectArk" />
    <div class="wm">
      <div class="l1"><span class="p">Project</span><span class="a">ARK</span> <span class="e">Engenharia</span></div>
    </div>
  </div>
  <div class="hsearch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16 16"/></svg>
    <input id="busca" type="search" placeholder="Buscar equipamento, grupo ou norma" autocomplete="off" />
  </div>
  <div class="lang">
    <button id="lang-pt" class="on" title="Português do Brasil" aria-label="Português do Brasil"><svg viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg"><rect width="28" height="20" fill="#009B3A"/><path d="M14 2.4 25.4 10 14 17.6 2.6 10Z" fill="#FEDF00"/><circle cx="14" cy="10" r="4.5" fill="#002776"/><clipPath id="bzc"><circle cx="14" cy="10" r="4.5"/></clipPath><path d="M9 12.6Q14 9.1 19.2 12.9" stroke="#fff" stroke-width="1.5" fill="none" clip-path="url(#bzc)"/></svg></button>
    <button id="lang-en" title="English (United States)" aria-label="English (United States)"><svg viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg"><rect width="28" height="20" fill="#fff"/><rect width="28" height="1.54" fill="#B22234"/><rect y="3.08" width="28" height="1.54" fill="#B22234"/><rect y="6.15" width="28" height="1.54" fill="#B22234"/><rect y="9.23" width="28" height="1.54" fill="#B22234"/><rect y="12.31" width="28" height="1.54" fill="#B22234"/><rect y="15.38" width="28" height="1.54" fill="#B22234"/><rect y="18.46" width="28" height="1.54" fill="#B22234"/><rect width="11.5" height="10.77" fill="#3C3B6E"/><g fill="#fff"><circle cx="2.2" cy="2" r=".62"/><circle cx="5.7" cy="2" r=".62"/><circle cx="9.2" cy="2" r=".62"/><circle cx="3.9" cy="4.1" r=".62"/><circle cx="7.4" cy="4.1" r=".62"/><circle cx="2.2" cy="6.2" r=".62"/><circle cx="5.7" cy="6.2" r=".62"/><circle cx="9.2" cy="6.2" r=".62"/><circle cx="3.9" cy="8.3" r=".62"/><circle cx="7.4" cy="8.3" r=".62"/></g></svg></button>
  </div>
  <div class="hver"><div class="k">Versão</div><div class="v" id="hver">—</div></div>
  <div class="htag" id="htag"></div>
  <div class="goldbar"></div>
</header>

<div class="overlay" id="overlay"></div>
<div class="layout">
  <aside id="drawer">
    <h2>Equipamentos</h2>
    <button class="navitem all active" data-all="1"><span>Todos</span></button>
    <div id="menu"></div>
  </aside>
  <main>
    <div class="toolbar"><div class="tt"><h1 id="title">Dimensionamento de Equipamentos</h1><div class="tsub" id="subtitle">Rotinas de pré-dimensionamento conforme normas ABNT, EN e API</div></div><span class="count" id="count"></span></div>
    <div class="langnote" id="langnote"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<footer id="foot">ProjectARK · Pré-dimensionamento de Equipamentos</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
let DB={meta:{},equipamentos:[]};
let curGrupo="",curSub="",CUR_EQ=null;
const REPORT_LOGO=new Image(); REPORT_LOGO.src="logo2.png";
const $=s=>document.querySelector(s);
const ICON_SCREW='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="18" width="36" height="12" rx="6"/><path d="M10 24c3-5 6 5 9 0s6 5 9 0 6 5 9 0"/></svg>';
const ICON_BELT='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="13" cy="28" r="6"/><circle cx="35" cy="28" r="6"/><path d="M13 22 H35 M13 34 H35"/><path d="M18 18 l4 4 4-4" /></svg>';
const ICON_FLEX='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="35" r="5"/><circle cx="37" cy="13" r="5"/><path d="M12 30 L37 8 M12 40 L37 18"/><path d="M22 31 l3 4 4-3"/></svg>';
const ICON_SILO='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 16 v20 M34 16 v20"/><path d="M14 16 a10 5 0 0 1 20 0"/><path d="M14 36 l10 8 10 -8"/><path d="M19 16 v20 M24 16 v22 M29 16 v20"/></svg>';
const ICON_FLARE='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M24 4 c3.6 5 5.6 7.6 5.6 10.6 a5.6 5.6 0 0 1 -11.2 0 c0 -3 2 -5.6 5.6 -10.6 z"/><path d="M24 12.4 c1.7 2.4 2.6 3.6 2.6 4.9 a2.6 2.6 0 0 1 -5.2 0 c0 -1.3 0.9 -2.5 2.6 -4.9 z" fill="currentColor" stroke="none"/><path d="M20.4 21.4 h7.2"/><path d="M18.4 44 L21.3 21.4 M29.6 44 L26.7 21.4"/><path d="M19.5 36.8 H28.5 M20.2 29.6 H27.8"/><path d="M19.5 36.8 L27.8 29.6 M28.5 36.8 L20.2 29.6"/></svg>';
const ICON_TUBE='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="32" width="14" height="9" rx="4.5"/><rect x="28" y="9" width="14" height="9" rx="4.5" transform="rotate(32 35 13.5)"/><path d="M16 34 L30 18"/><circle cx="11" cy="36.5" r="1.6" fill="currentColor"/><circle cx="20" cy="29" r="1.6" fill="currentColor"/><circle cx="28" cy="20" r="1.6" fill="currentColor"/></svg>';

/* ============ REGIME DE ESCOAMENTO — ÁBACO DE JENIKE (Bulletin 123) ============
   θ = meio-ângulo da tremonha medido da VERTICAL, no limite do fluxo de massa, em função
   do atrito de parede φw e do ângulo efetivo de atrito interno δ.

   O ábaco aplicável é decidido pela GEOMETRIA DA BOCA, e não pelo rótulo escolhido no
   formulário. Uma tremonha piramidal com boca alongada e paredes de topo íngremes escoa
   em regime PLANO — cobrar dela o ângulo do ábaco cônico reprova geometrias que funcionam.
   Na direção oposta, aplicar o ábaco plano a uma boca quase quadrada é contra a segurança.

   Critério, ambas as condições necessárias:
     1) a boca é um rasgo:  maior/menor ≥ 3
     2) a parede que fecha o comprimento do rasgo é mais íngreme que o exigido pelo ábaco
        cônico — só assim ela não forma vale ativo (zona morta na aresta).
   No regime plano quem governa é a FACE CONVERGENTE; no axissimétrico, a ARESTA DE VALE,
   que é sempre mais rasa que qualquer face (cot²αv = cot²αA + cot²αB).                 */
const JEN_D=[30,40,50,60,70], JEN_W=[0,10,20,30,40];
const JEN_CON=[[33,24,13, 0, 0],[35,28,19, 7, 0],[36,30,23,13, 0],[37,32,26,18, 7],[38,33,28,22,13]];
const JEN_PLA=[[49,41,31,17, 0],[50,44,36,25, 8],[51,46,39,31,18],[52,47,42,35,25],[52,48,44,38,30]];
function jenBil(TB,x,y){
  function idx(v,arr){ if(v<=arr[0])return [0,0,0]; if(v>=arr[arr.length-1])return [arr.length-1,arr.length-1,0];
    for(var i=1;i<arr.length;i++){ if(v<=arr[i]) return [i-1,i,(v-arr[i-1])/(arr[i]-arr[i-1])]; } return [arr.length-1,arr.length-1,0]; }
  var ix=idx(x,JEN_D), iy=idx(y,JEN_W);
  var v0=TB[ix[0]][iy[0]]+(TB[ix[0]][iy[1]]-TB[ix[0]][iy[0]])*iy[2];
  var v1=TB[ix[1]][iy[0]]+(TB[ix[1]][iy[1]]-TB[ix[1]][iy[0]])*iy[2];
  return v0+(v1-v0)*ix[2];
}
/* o = {deff, phw, C, D, alfaA, alfaB, alfaVale, forcaPlano, margem, bonus, piso} */
function regimeFluxo(o){
  var marg=(o.margem===undefined)?3:o.margem, bonus=o.bonus||0, piso=o.piso||0;
  var thCon=jenBil(JEN_CON,o.deff,o.phw), thPla=jenBil(JEN_PLA,o.deff,o.phw);
  var exigCon=Math.max(piso,(90-Math.max(3,thCon-marg))-bonus);
  var exigPla=Math.max(piso,(90-Math.max(3,thPla-marg))-bonus);
  var C=Math.max(o.C||0,1e-6), D=Math.max(o.D||0,1e-6);
  var slotAlongA=(C>=D);
  var endAng=slotAlongA?o.alfaA:o.alfaB;      // parede que fecha o comprimento do rasgo
  var faceAng=slotAlongA?o.alfaB:o.alfaA;     // face convergente
  var raz=Math.max(C,D)/Math.min(C,D);
  var slotOK=(raz>=3), endOK=(endAng>=exigCon-0.5);
  var plano=(!!o.forcaPlano)||(slotOK&&endOK);
  var exig=plano?exigPla:exigCon;
  var gov=plano?faceAng:o.alfaVale;
  return {plano:plano,thCon:thCon,thPla:thPla,exigCon:exigCon,exigPla:exigPla,exig:exig,
          gov:gov,govNome:plano?"face convergente":"aresta de vale",raz:raz,slotOK:slotOK,
          endAng:endAng,endOK:endOK,faceAng:faceAng,ok:(gov>=exig-0.5),theta:90-exig,
          Hf:(plano?1.0:2.0)+(90-exig)/60, kMec:(plano?6:8), Bfloor:(plano?0.4:0.6)};
}

function massaMotor(kw){
  var T=[[0.12,10],[0.25,13],[0.55,17],[0.75,20],[1.5,28],[2.2,35],[4,52],[5.5,68],[7.5,85],
         [11,125],[15,155],[18.5,190],[22,220],[30,290],[37,360],[45,420],[55,500],[75,650],[90,760],[110,900]];
  if(kw<=T[0][0])return T[0][1];

    return T[i-1][1]+f*(T[i][1]-T[i-1][1]); } }
  return T[T.length-1][1]*kw/T[T.length-1][0];
}

/* ---- Cálculo de propriedades ---- */
function _pI(n,d,bf,tw,tf){                   // seção I / H
  var hw=d-2*tf, A=(2*bf*tf+hw*tw)/100;
  var Ix=(bf*Math.pow(d,3)-(bf-tw)*Math.pow(hw,3))/12/1e4;
  var Iy=(2*tf*Math.pow(bf,3)+hw*Math.pow(tw,3))/12/1e4;
  return {fam:"W",n:n,A:A,Ix:Ix,W:Ix/(d/20),imin:Math.sqrt(Iy/A),kg:_massa(A)};
}
function _pL(a,b,t,n,fam){                    // cantoneira (a = aba maior, b = menor)
  var A1=a*t, A2=(b-t)*t, At=A1+A2, A=At/100;
  var y1=a/2, y2=t/2, x1=t/2, x2=(b+t)/2;
  var yg=(A1*y1+A2*y2)/At, xg=(A1*x1+A2*x2)/At;
  var Ix=(t*Math.pow(a,3)/12+A1*Math.pow(y1-yg,2)+(b-t)*Math.pow(t,3)/12+A2*Math.pow(y2-yg,2))/1e4;
  var Iy=(a*Math.pow(t,3)/12+A1*Math.pow(x1-xg,2)+t*Math.pow(b-t,3)/12+A2*Math.pow(x2-xg,2))/1e4;
  var Ixy=(A1*(x1-xg)*(y1-yg)+A2*(x2-xg)*(y2-yg))/1e4;
  var md=(Ix+Iy)/2, rd=Math.sqrt(Math.pow((Ix-Iy)/2,2)+Ixy*Ixy);
  return {fam:fam,n:n,A:A,Ix:Ix,W:Ix/((a-yg)/10),imin:Math.sqrt(Math.max(md-rd,1e-6)/A),kg:_massa(A)};
}
function _pT(h,b,t){                          // tubo estrutural retangular / quadrado
  var hi=h-2*t, bi=b-2*t, A=(h*b-hi*bi)/100;
  var Ix=(b*Math.pow(h,3)-bi*Math.pow(hi,3))/12/1e4;
  var Iy=(h*Math.pow(b,3)-hi*Math.pow(bi,3))/12/1e4;
  var q=(h===b)?"□":"▭";
  return {fam:(h===b)?"TQ":"TR",n:"Tubo "+q+" "+h+" x "+b+" x "+String(t).replace(".",",")+" mm",
          A:A,Ix:Ix,W:Ix/(h/20),imin:Math.sqrt(Math.min(Ix,Iy)/A),kg:_massa(A)};
}
function _pBC(h,t){                           // barra chata / chapa soldada
  var A=h*t/100, Ix=t*Math.pow(h,3)/12/1e4, Iy=h*Math.pow(t,3)/12/1e4;
  return {fam:"BC",n:"Barra chata "+h+" x "+String(t).replace(".",",")+" mm",
          A:A,Ix:Ix,W:Ix/(h/20),imin:Math.sqrt(Iy/A),kg:_massa(A)};
}

/* Seleciona o perfil mais leve que atende aos critérios.
   crit = {W: módulo requerido (cm³)} e/ou {A: área (cm²), i: raio de giração mín. (cm)}
   fam  = "" (todas as famílias) ou sigla da família imposta pelo usuário
   Retorna {best:perfil, alts:[um por família], dobro:bool} */
function selPerfil(crit,fam){
  function ok(p){
    if(crit.W&&p.W<crit.W) return false;
    if(crit.A&&p.A<crit.A) return false;
    if(crit.i&&p.imin<crit.i) return false;
    return true;
  }
  var pool=CAT_PERFIS.filter(function(p){ return (!fam||p.fam===fam)&&ok(p); });
  var porFam={};
  pool.forEach(function(p){ if(!porFam[p.fam]||p.kg<porFam[p.fam].kg) porFam[p.fam]=p; });
  var alts=Object.keys(porFam).map(function(k){ return porFam[k]; }).sort(function(x,y){ return x.kg-y.kg; });
  if(alts.length) return {best:alts[0],alts:alts,dobro:false};
  // Nenhum perfil isolado atende — propor seção composta com o maior perfil da família.
  var univ=CAT_PERFIS.filter(function(p){ return (!fam||p.fam===fam); });
  if(crit.i){
    // Critério de coluna: associar perfis NÃO aumenta i_min se eles forem justapostos;
    // é preciso afastá-los (seção composta em caixão / treliçada).
    var bi=univ.slice().sort(function(x,y){ return y.A-x.A; })[0];
    var nd2=Math.max(2,Math.ceil(crit.A/bi.A));
    return {best:{fam:bi.fam,n:nd2+" x "+bi.n+"  — SEÇÃO COMPOSTA (perfis afastados; definir o "+
            "espaçamento para i_min ≥ "+crit.i.toFixed(1).replace(".",",")+" cm, com travejamento)",
            A:nd2*bi.A,Ix:nd2*bi.Ix,W:nd2*bi.W,imin:crit.i,kg:nd2*bi.kg},alts:[],dobro:true};
  }
  var base=univ.slice().sort(function(x,y){ return (y.W||0)-(x.W||0); })[0];
  var nd=Math.max(2,Math.ceil(crit.W/base.W));
  var comp={fam:base.fam,n:nd+" x "+base.n+"  (perfis associados)",A:nd*base.A,Ix:nd*base.Ix,
            W:nd*base.W,imin:base.imin,kg:nd*base.kg};
  return {best:comp,alts:[comp],dobro:true};
}
function txtPerfil(p){
  return p.n+"   (W "+p.W.toFixed(0)+" cm³ · A "+p.A.toFixed(1).replace(".",",")
    +" cm² · i_min "+p.imin.toFixed(2).replace(".",",")+" cm · "+p.kg.toFixed(1).replace(".",",")+" kg/m)";
}
function txtAlts(sel,nmax){
  return sel.alts.slice(1,(nmax||3)+1).map(function(p){
    return FAM_NOME[p.fam]+": "+p.n+" ("+p.kg.toFixed(1).replace(".",",")+" kg/m)"; }).join("   ·   ")||"—";
}

/* Conversão de força para massa equivalente: 1 kgf = 9,80665 N.
   Usada para apresentar as cargas em kN com o equivalente em kg entre parênteses. */
function kgf(kN){ return Math.round(kN*1000/9.80665); }
function kNkg(kN,dec){ return kN.toFixed(dec===undefined?1:dec).replace(".",",")+" kN ("+fmt(kgf(kN))+" kg)"; }

function selSEW(Pdrive,nout){
  const T=9550*Pdrive/nout;                 // torque no eixo de saída (Nm)
  const Tsel=T*FB;                          // torque de seleção (com fator de serviço)
  const mot=SEW_MOTORS.find(m=>m.kw>=Pdrive)||SEW_MOTORS[SEW_MOTORS.length-1];
  const red=SEW_R.find(g=>g.t>=Tsel)||SEW_R[SEW_R.length-1];
  const i=N_MOTOR/nout;
  const foraR=(Tsel>SEW_R[SEW_R.length-1].t);          // acima do maior redutor da série R (R167)
  const ind=foraR?selInd(Tsel,i):null;
  return {T,Tsel,mot,red,i,foraR,ind};
}
/* Texto do acionamento recomendado: série R quando couber, senão redutor industrial (MC / X..e) */
function sewDrive(sew,Pmaj){

}

function coneVibCalc(CVCIRC){
      var g=9.80665;
      var A=num("cvA")/1000, B=num("cvB")/1000, H=num("cvH")/1000, C=num("cvC")/1000, D=num("cvD")/1000;
      var rho=num("cvRho"), phi=num("cvPhi"), phw=num("cvDelta"), coes=num("cvCoes"), d50=num("cvD50");
      var esp=num("cvEsp"), pctRef=num("cvRef");
      if([A,B,H,C,D,rho,phi,phw,coes,d50,esp,pctRef].some(function(x){return isNaN(x);})) return null;
      if(A<=0||B<=0||H<=0||C<=0||D<=0||rho<=0||phi<=0||phi>=90) return null;
      if(C>=A||D>=B) return null;

      function area(a,b){ return circ?(Math.PI/4*a*b):(a*b); }
      function perim(a,b){ return circ?(Math.PI*(3*(a+b)/2-Math.sqrt(a*b))/2*2):(2*(a+b)); }

        {k:"Por que a fadiga governa",v:"O tirante recebe uma carga ALTERNADA a "+fop.toFixed(1).replace(".",",")+" Hz — são "+Ncic.toExponential(1).replace(".",",")+" ciclos na vida do equipamento, muito além do limite de corte. Barra rosqueada tracionada é um detalhe de categoria baixa (o fundo do filete concentra tensão), então o Δσ admissível cai para "+dSigL.toFixed(1).replace(".",",")+" MPa. É por isso que tirantes de ativador são muito maiores do que a carga estática sugeriria — e por que ruptura de tirante é a falha mais comum nesses equipamentos."},

function alimCorreiaCalc(){
      var RET=true;
      var Q=num("acQ"),rhoT=num("acRho"),theta=num("acTheta"),fm=num("acFm"),fsm=num("acFsm");
      var Fmax=num("acFmax"),V=num("acV"),Din=num("acD")/1000,Bin=num("acB")/1000;
      var L2=num("acL2"),L1=num("acL1"),L3=num("acL3"),L=num("acL"),H=num("acH");
      var WbIn=num("acWb"),xrot=num("acXrot"),aesp=num("acAesp");
      var Dt=num("acDt"),eta=num("acEta");
      var abras=$("#acAbras").value, tipoC=$("#acTipo").value, Ky=parseFloat($("#acKy").value);
      var kxM=$("#acKxM").value, K=parseFloat($("#acK").value), FS=parseFloat($("#acFS").value);
      if([Q,rhoT,theta,fm,fsm,Fmax,V,L2,L1,L3,L,H,Dt,eta].some(function(x){return isNaN(x);})) return null;
      if(Q<=0||rhoT<=0||V<=0||L<=0||L2<=0||Dt<=0||eta<=0||eta>1||theta<=0||theta>=90) return null;
      var gama=rhoT*1000;                                  // kgf/m³  (γ do manual)
      /* ---- Largura da correia e abertura das guias ---- */
      var LARG=[16,20,24,30,36,42,48,54,60,72,84];
      var WB={Plylon:[5.2,6.5,7.7,11.9,14.3,17.7,20.2,26.8,29.8,35.7,41.6],
              HDRN:[6.4,8.0,9.6,13.5,16.2,21.0,24.0,37.6,41.8,50.1,58.4]};
      var gamaP=rhoT*1000;
      // Critério de CAPACIDADE: de D = Q/(γ·V·B·3600) com o limite D ≤ B/2  →  B ≥ √(2Q/(3600·γ·V))
      var Bcap_m=Math.sqrt(2*(Q*1000)/(3600*gamaP*V));     // abertura de guia mínima (m)
      var Bpor_cap=Bcap_m/0.65*1000/25.4;                  // pol de correia correspondentes
      var Bpor_guia=(Bin>0)?(Bin/0.65*1000/25.4):0;        // pol necessárias p/ a guia informada
      var Bpor_gran=3*Fmax/25.4;                           // ≥ 3 × o maior bloco
      var Breq_pol=Math.max(Bpor_cap,Bpor_guia,Bpor_gran);
      var Bauto=LARG[LARG.length-1], granInsuf=true;
      for(var i=0;i<LARG.length;i++){
        if(LARG[i]>=Breq_pol){ Bauto=LARG[i]; granInsuf=false; break; } }
      var govLarg=(Bpor_guia>=Bpor_cap&&Bpor_guia>=Bpor_gran)?"abertura de guia informada":
                  (Bpor_cap>=Bpor_gran?"capacidade (limite D ≤ B/2)":"granulometria (3 × maior bloco)");
      var Bsel=$("#acBsel").value, manualB=(Bsel!=="auto");
      var Bpol=manualB?parseInt(Bsel,10):Bauto;
      var Bmm=Math.round(Bpol*25.4);
      var iW=LARG.indexOf(Bpol); if(iW<0)iW=LARG.length-1;
      var Wb=(WbIn>0)?WbIn:WB[tipoC][iW];
      var B=(Bin>0)?Bin:(0.65*Bmm/1000);                   // abertura da guia (m)
      var Bestreita=manualB&&(Bpol<Bauto);
      var lumpOK=(Bmm>=3*Fmax);
      /* ---- Altura da camada  D = Q / (γ · V · B · 3600) ---- */
      var Dcalc=(Q*1000)/(gama*V*B*3600);                  // m
      var D=(Din>0)?Din:Dcalc;
      var Dmax=B/2, Dok=(D<=Dmax+1e-9);
      var Qreal=3600*B*D*V*gama/1000;                      // t/h
      var Vmax=(abras==="abr")?0.3:0.5, Vok=(V<=Vmax+1e-9);
      /* ---- Coeficientes ---- */
      var Ka=(1-Math.sin(theta*Math.PI/180))/(1+Math.sin(theta*Math.PI/180));
      var tgTheta=Math.tan(theta*Math.PI/180);
      var Wm=Q*1000/(3.6*V*1000);                          // kgf/m de material sobre a correia
      var Kx=(kxM==="det")?(0.0068*(Wm+Wb)+((aesp>0)?xrot/aesp:0)):4.46;
      /* ---- TENSÃO EFETIVA  Te = Pe + P1 + Ps + Pfs + Ph  (pág. 1-21) ---- */
      var Pe=L*(Kx+Ky*Wb+0.02*Wb)+45.4;                                    // correia vazia
      var P1=Ky*(1.2*B*B*gama*L2 + B*D*L3*gama);                           // movimentar o material
      var Ps=Math.max(0,(1.2*B-D))*gama*L1*fm*B;                           // cisalhamento do material
      var Pfs=D*gama*Ka*fsm*((2.4*B-D)*L1 + D*L3) + 8.93*L;                // atrito nas guias laterais
      var Ph=B*D*gama*H;                                                   // elevação
      var Te=Pe+P1+Ps+Pfs+Ph;                                              // kgf
      if(!isFinite(Te)||Te<=0) return null;
      var pctPe=100*Pe/Te,pctP1=100*P1/Te,pctPs=100*Ps/Te,pctPfs=100*Pfs/Te,pctPh=100*Ph/Te;
      /* ---- Potência e acionamento ---- */
      var Pkw=Te*9.80665*V/1000;                          // kW no tambor
      var Peixo=Pkw/eta;
      var Pmaj=Peixo*1.15;                                // 15% de margem
      var npul=V*60000/(Math.PI*Dt);                      // rpm do tambor
      var Msaida=(npul>0)?(9550*Pmaj/npul):0;
      var sew=selSEW(Pmaj,npul);
      /* ---- Tensões de operação e correia ---- */
      var T1=(1+K)*Te, T2=K*Te;
      var trN=T1*9.80665/Bmm;                             // N/mm
      var carcReq=trN*FS;
      var EP=[200,250,315,400,500,630,800,1000,1250,1600,2000];
      var EPsel=EP.find(function(x){return x>=carcReq;})||EP[EP.length-1];
      /* ---- Tambores ---- */
      var Dmin_acion=Math.max(400,Math.ceil(EPsel*0.9/50)*50);
      var Dtok=(Dt>=Dmin_acion);
      var geomAviso=(L1>L2+1e-9)||(L2+L3>L+1e-9);
      /* ============ MOEGA DE CARREGAMENTO (pá-carregadeira) ============
         A moega é um tronco de pirâmide a×b no topo, c×d na descarga, altura h. Não há
         coluna de estoque acima: a carga sobre o alimentador vem só do material contido
         na moega, e o atrito das paredes ainda alivia parte dela (Janssen, saturando em
         γ·Rh/(K·μ)). Volume, massa contida e autonomia entre ciclos da pá também saem daqui. */
      var abast="pa",abastTxt="",Vmo=0,mMo=0,autonMo=0,pvMo=0,pvSatMo=0,pvHid=0,alivio=0,alfaMa=0,alfaMb=0,
          nConcha=0,Amo1=0,Amo2=0,Fboca=0,cOK=true,dOK=true,angOK=true,Ma=0,Mb=0,Mh=0,Mc=0,Md=0;
      abast=selv("acAbast","pa");
      abastTxt=(abast==="pa")?"pá-carregadeira":(abast==="cam"?"caminhão basculante":"chute / silo (abastecimento contínuo)");
      if(RET){
        Ma=num("acMa")/1000; Mb=num("acMb")/1000; Mh=num("acMh")/1000;
        Mc=num("acMc")/1000; Md=num("acMd")/1000;
        if(!isFinite(Ma)||Ma<=0)Ma=3.5; if(!isFinite(Mb)||Mb<=0)Mb=3.0;
        if(!isFinite(Mh)||Mh<=0)Mh=2.5; if(!isFinite(Mc)||Mc<=0)Mc=3.0; if(!isFinite(Md)||Md<=0)Md=0.7;
        Amo1=Ma*Mb; Amo2=Mc*Md;
        /* volume do tronco de pirâmide da moega */
        Vmo=(Mh/3)*(Amo1+Amo2+Math.sqrt(Amo1*Amo2));
        mMo=Vmo*rhoT;                                    // t de material contido
        autonMo=(Q>0)?(mMo/Q*60):0;                      // minutos de autonomia
        var vConcha=num("acConcha"); if(!isFinite(vConcha))vConcha=0;
        nConcha=(vConcha>0)?(Vmo/vConcha):0;
        /* ângulos das paredes convergentes da moega */
        alfaMa=Math.atan(Mh/Math.max((Ma-Mc)/2,1e-4))*180/Math.PI;
        alfaMb=Math.atan(Mh/Math.max((Mb-Md)/2,1e-4))*180/Math.PI;
        angOK=(Math.min(alfaMa,alfaMb)>=45);
        /* pressão vertical na abertura: Janssen dentro da moega, com K = Ka e μ = fsm.
           γ em kgf/m³ → kgf/m² → kPa. Satura em γ·Rh/(K·μ): a parede sustenta parte da carga. */
        var Km=Ka, mum=Math.max(fsm,0.05);
        var Rhm=Amo2/(2*(Mc+Md));
        pvSatMo=gama*Rhm/(Km*mum)*9.80665/1000;
        pvMo=pvSatMo*(1-Math.exp(-Km*mum*Math.max(Mh,0.01)/Rhm));
        pvHid=gama*Mh*9.80665/1000;                      // kPa — coluna sem apoio de parede
        alivio=(pvHid>0)?(1-pvMo/pvHid)*100:0;
        Fboca=pvMo*Amo2;                                 // kN sobre a abertura
        /* coerência entre a abertura da moega e a geometria do alimentador */
        cOK=(Math.abs(Mc-L2)<=Math.max(0.15,0.10*L2));
        dOK=(Math.abs(Md-B)<=Math.max(0.10,0.15*B));
      }

        {k:"Resistência medida em ensaio",v:(Rmed>0? Rmed.toFixed(0)+" kgf/briquete   ·   FS efetivo sobre a carga de pico = "+FSef.toFixed(1).replace(".",",")+(brqOK?"   ✓ ATENDE":"   ⚠ NÃO ATENDE — requerido "+FreqKgf.toFixed(0)+" kgf/briquete") : "não informado — preencher com o resultado do ensaio de compressão do fornecedor para que a verificação seja conclusiva"),hi:true},
        {k:"Referências de ensaio e de mercado",v:"Compressão por briquete: ISO 4700 (método de referência para pelotas/aglomerados; pelotas de alto-forno de boa qualidade atingem 250 daN, e abaixo de 120 daN são consideradas frágeis, com alta probabilidade de quebra em operação). Queda: ASTM D440 (drop shatter). Tamboramento/abrasão: ASTM D441. Estes valores de pelota servem apenas como ordem de grandeza — a aceitação do briquete deve ser feita contra o requisito calculado acima, sobre o ensaio do lote real."},
        {k:"Se o briquete não atender",v:"Alternativas, na ordem de eficácia: (a) manter leito amortecedor permanente e reduzir a altura de queda; (b) revestir o fundo da moega e as guias com borracha ou UHMW; (c) reduzir a altura h da moega, o que baixa σv até a saturação; (d) alargar a abertura c × d, o que reduz a tensão por aumentar o raio hidráulico; (e) por último, aumentar a resistência do briquete (mais aglomerante, maior pressão de prensagem ou cura mais longa) — o que encarece o produto e normalmente é a via menos econômica."}
        ]:[]),
        {sec:"Observações"},
        {k:"Faixa de aplicação",v:"Alimentadores de correia são empregados principalmente na retomada de materiais FINOS E ÚMIDOS sob moegas, silos ou pilhas, onde o uso de alimentadores vibratórios não é recomendado."},
        {k:"Tamanhos disponíveis",v:"Os tamanhos são os mesmos das correias transportadoras, com as mesmas larguras padrão; os comprimentos são variáveis conforme o projeto."},
        {k:"Observação de projeto",v:"⚠ Pré-dimensionamento pelo método do Manual de Britagem (págs. 1-20 a 1-23). Determinada a tensão efetiva, o cálculo das tensões de operação, a motorização e a seleção da correia e dos tambores seguem o procedimento dos transportadores de correia. Confirmar na folha de dados do fabricante."}
      ];
      OUT.geo={tipo:"alimcor",Q:Q,Qreal:Qreal,gama:gama,rhoT:rhoT,theta:theta,Ka:Ka,fm:fm,fsm:fsm,
        V:V,Vmax:Vmax,Vok:Vok,B:B,D:D,Dmax:Dmax,Dok:Dok,L:L,L1:L1,L2:L2,L3:L3,H:H,
        Bpol:Bpol,Bmm:Bmm,Wb:Wb,tipoC:tipoC,Kx:Kx,Ky:Ky,Wm:Wm,Fmax:Fmax,lumpOK:lumpOK,
        Pe:Pe,P1:P1,Ps:Ps,Pfs:Pfs,Ph:Ph,Te:Te,Pkw:Pkw,Peixo:Peixo,Pmaj:Pmaj,npul:npul,
        Msaida:Msaida,sew:sewDrive(sew,Pmaj),T1:T1,T2:T2,carcReq:carcReq,EP:EPsel,Dt:Dt,
        Dmin:Dmin_acion,Dtok:Dtok,geomAviso:geomAviso};
      return OUT;
}

/* ===================== MOEGA DE ALIMENTAÇÃO — dimensionamento executivo =====================
   Entradas principais: A e B (dimensional superior), H (altura), C e D (boca de descarga).
   A moega é um tronco de pirâmide, opcionalmente com um colarinho reto no topo (Hc), apoiado
   sobre montantes metálicos. O roteiro segue a mesma família de normas do silo retangular:
   fluxo por Jenike, ações por EN 1991-4 / NBR 11700, vento NBR 6123, sismo NBR 15421 e
   verificação estrutural por NBR 8800, acrescido das cargas de equipamento móvel (grelha,
   impacto de descarga, tráfego e defensas) próprias da moega de recepção.                   */
function moegaCalc(){
  /* ---------- ENTRADAS ---------- */
  var A=num("mgA")/1000, B=num("mgB")/1000, H=num("mgH")/1000;
  var C=num("mgC")/1000, D=num("mgD")/1000, Hc=num("mgHc")/1000;
  if(!isFinite(A)||A<=0)A=4.0; if(!isFinite(B)||B<=0)B=3.5;
  if(!isFinite(H)||H<=0)H=2.5; if(!isFinite(C)||C<=0)C=1.2;
  if(!isFinite(D)||D<=0)D=0.8; if(!isFinite(Hc)||Hc<0)Hc=0.5;
  var tipoM=selv("mgTipo","pir"), cunha=(tipoM==="cunha");
  /* Na moega em CUNHA a convergência é só na direção B: a fenda ocupa todo o
     comprimento A e as paredes de topo são verticais. */
  if(cunha) C=A;
  if(C>A*0.999)C=A; if(D>B*0.98)D=B*0.98;
  var Q=num("mgQ"); if(!isFinite(Q)||Q<=0)Q=300;
  var rho=num("mgRho"); if(!isFinite(rho)||rho<=0)rho=1.7;
  var g=9.80665, gamma=rho*g;                       // kN/m³
  var phi=num("mgPhi"); if(!isFinite(phi)||phi<=0)phi=40;      // atrito interno φi
  var phw=num("mgPhw"); if(!isFinite(phw)||phw<=0)phw=25;      // atrito com a parede φw
  var deffIn=num("mgDeff"); var deff=(isFinite(deffIn)&&deffIn>0)?deffIn:phi;   // δ efetivo
  var coes=num("mgCoes"); if(!isFinite(coes)||coes<0)coes=0;
  var d50=num("mgD50"); if(!isFinite(d50)||d50<=0)d50=50;
  var rep=num("mgRep"); if(!isFinite(rep)||rep<=0||rep>=60)rep=35;
  var Hsob=num("mgHsob"); if(!isFinite(Hsob)||Hsob<0)Hsob=0.5;
  var eta=num("mgEta"); if(!isFinite(eta)||eta<=0||eta>1)eta=0.85;
  var abast=selv("mgAbast","pa");
  var abastTxt=(abast==="pa")?"pá-carregadeira":(abast==="cam"?"caminhão basculante":"chute / correia");
  var movel=(abast!=="chu");
  var Vcarga=num("mgVcarga"); if(!isFinite(Vcarga)||Vcarga<0)Vcarga=0;
  var Peq=num("mgPeq"); if(!isFinite(Peq)||Peq<=0)Peq=25;      // massa operacional do equipamento (t)
  var Hq=num("mgHq"); if(!isFinite(Hq)||Hq<0)Hq=1.5;           // altura de queda da descarga
  var fy=selvN("mgFy",345), abr=num("mgAbr"); if(!isFinite(abr)||abr<0)abr=3;
  var gf=selvN("mgGf",1.4), limFl=selvN("mgFlecha",150);
  var Hleg=num("mgHleg"); if(!isFinite(Hleg)||Hleg<=0)Hleg=4.0;
  var fself=num("mgSelf"); if(!isFinite(fself)||fself<1)fself=1.15;

  /* ---------- ETAPA 1 — GEOMETRIA ---------- */
  var A1=A*B, A2=C*D;                                // áreas superior e da boca
  var tA=cunha?0:(A-C)/2, tB=(B-D)/2;                // recuos horizontais das faces
  function angFace(t){ return (t<=0.0005)?90:Math.atan(H/t)*180/Math.PI; }
  var alfaA=angFace(tA), alfaB=angFace(tB);
  /* ÂNGULO DE VALE — na PIRÂMIDE a aresta de encontro entre duas faces inclinadas é SEMPRE
     mais rasa que qualquer uma delas: cot²αv = cot²αA + cot²αB. É o vale que governa o
     escoamento. Na CUNHA não existe vale: as paredes de topo são verticais e o ângulo que
     governa é o da própria face inclinada — e é por isso que a cunha exige muito menos. */
  var alfaVale=cunha?alfaB:((H>0)?Math.atan(H/Math.sqrt(tA*tA+tB*tB))*180/Math.PI:0);
  var aVrad=alfaVale*Math.PI/180, betaHop=90-alfaVale;
  /* volume: prisma trapezoidal na cunha, tronco de pirâmide na piramidal */
  var Vtronco=cunha?((H/2)*A*(B+D)):((H/3)*(A1+A2+Math.sqrt(A1*A2)));
  var Vcol=A1*Hc;
  var hCone=(Math.min(A,B)/2)*Math.tan(rep*Math.PI/180);
  var Vcone=A1*hCone/3;
  var Vgeo=Vtronco+Vcol, VgeoC=Vgeo+Vcone;
  var Vutil=Vgeo*eta, Mutil=Vutil*rho;
  var autonMin=(Q>0)?(Mutil/Q*60):0;
  var nCargas=(Vcarga>0)?(Vutil/Vcarga):0;
  /* superfícies e perímetros */
  var slA=Math.sqrt(H*H+tA*tA), slB=Math.sqrt(H*H+tB*tB);      // comprimento inclinado das faces
  /* piramidal: 4 faces trapezoidais · cunha: 2 faces inclinadas + 2 topos verticais */
  var ArA=cunha?(2*A*slB):(2*((A+C)/2)*slB);
  var ArB=cunha?(2*((B+D)/2)*H):(2*((B+D)/2)*slA);
  var Achapa=ArA+ArB+2*(A+B)*Hc;
  var perim=2*(A+B), perimB=2*(C+D);

  /* ---------- ETAPA 2 — FLUXO (JENIKE) ---------- */
  var pr=phi*Math.PI/180;
  var sc=(coes>0)?(2*coes*Math.cos(pr)/(1-Math.sin(pr))):0;     // resistência inconfinada σc
  var JEN_D=[30,40,50,60,70], JEN_W=[0,10,20,30,40];
  var JEN_CON=[[33,24,13, 0, 0],[35,28,19, 7, 0],[36,30,23,13, 0],[37,32,26,18, 7],[38,33,28,22,13]];
  var JEN_PLA=[[49,41,31,17, 0],[50,44,36,25, 8],[51,46,39,31,18],[52,47,42,35,25],[52,48,44,38,30]];
  function bilm(TB,xs,ys,x,y){
    function idx(v,arr){ if(v<=arr[0])return [0,0,0]; if(v>=arr[arr.length-1])return [arr.length-1,arr.length-1,0];
      for(var i=1;i<arr.length;i++){ if(v<=arr[i]) return [i-1,i,(v-arr[i-1])/(arr[i]-arr[i-1])]; } return [arr.length-1,arr.length-1,0]; }
    var ix=idx(x,xs), iy=idx(y,ys);
    var v00=TB[ix[0]][iy[0]],v01=TB[ix[0]][iy[1]],v10=TB[ix[1]][iy[0]],v11=TB[ix[1]][iy[1]];
    var v0=v00+(v01-v00)*iy[2], v1=v10+(v11-v10)*iy[2];
    return v0+(v1-v0)*ix[2];
  }
  /* A moega PIRAMIDAL converge nas duas direções → ábaco AXISSIMÉTRICO (cônico).
     A moega em CUNHA converge só numa → ábaco PLANO, bem mais permissivo. */
  var thLimCon=bilm(JEN_CON,JEN_D,JEN_W,deff,phw);
  var thLimPla=bilm(JEN_PLA,JEN_D,JEN_W,deff,phw);
  var margJ=3.0;
  var alfaExigCon=90-Math.max(3,thLimCon-margJ);      // exigido no regime axissimétrico
  var alfaExigPla=90-Math.max(3,thLimPla-margJ);      // exigido no regime plano (fenda)
  /* ---- QUAL REGIME SE APLICA: decidido pela GEOMETRIA, não pelo rótulo escolhido ----
     Jenike: a tremonha escoa em regime PLANO quando a boca é um rasgo alongado (L ≥ 3·B)
     E as paredes de topo, que fecham o comprimento do rasgo, são íngremes o bastante para
     não formarem vale ativo. Nesse caso quem governa é a FACE CONVERGENTE, e o vale
     geométrico deixa de ser o critério. Fora disso vale o regime AXISSIMÉTRICO e é o
     ÂNGULO DE VALE que governa. Uma moega piramidal com boca muito alongada e paredes de
     topo quase verticais é, para efeito de escoamento, uma cunha — e seria injusto cobrar
     dela o ângulo do ábaco cônico. */
  var slotAlongA=(C>=D);
  var endAng=slotAlongA?alfaA:alfaB;                  // parede de topo (fecha o rasgo)
  var faceAng=slotAlongA?alfaB:alfaA;                 // face convergente
  var razBoca=Math.max(C,D)/Math.max(Math.min(C,D),1e-6);
  var slotOK=(razBoca>=3);
  var endOK=(endAng>=alfaExigCon-0.5);
  var regPlano=cunha||(slotOK&&endOK);
  var alfaExig=regPlano?alfaExigPla:alfaExigCon;
  var thDes=90-alfaExig;
  var alfaGov=regPlano?faceAng:alfaVale;              // ângulo que efetivamente governa
  var govNome=regPlano?"face convergente":"aresta de vale";
  var valeOK=(alfaGov>=alfaExig-0.5);
  var faceOK=(Math.min(alfaA,alfaB)>=alfaExig-0.5);
  var fluxoMassa=valeOK;
  var regime=fluxoMassa?"FLUXO DE MASSA":"FLUXO DE FUNIL";
  /* rathole (fluxo de funil) e arco (ambos os regimes) */
  var GT_X=[30,40,50,60], GT_Y=[2.0,3.3,5.0,7.5];
  function interpG(x){ if(x<=GT_X[0])return GT_Y[0]; if(x>=GT_X[3])return GT_Y[3];
    for(var i=1;i<4;i++){ if(x<=GT_X[i]) return GT_Y[i-1]+(GT_Y[i]-GT_Y[i-1])*(x-GT_X[i-1])/(GT_X[i]-GT_X[i-1]); } return GT_Y[3]; }
  var Gfun=interpG(deff);
  var Hfat=(regPlano?1.0:2.0)+thDes/60;                // H(θ) — metade no regime de fenda
  var Barco=(sc>0.001)?Hfat*sc/gamma:0;
  var Drat=(sc>0.001)?Gfun*sc/gamma:0;
  var Bmec=(regPlano?6:8)*d50/1000;                     // arco mecânico (entupimento por blocos)
  var Bmin=Math.max(Barco,Bmec,regPlano?0.4:0.5);
  if(!fluxoMassa) Bmin=Math.max(Bmin,Drat);
  var Bboca=Math.min(C,D);
  var bocaOK=(Bboca>=Bmin-0.001);
  var ffc=(sc>0.001)?(gamma*Math.min(C,D)/sc):999;

  /* ---------- ETAPA 3 — VAZÃO DE DESCARGA (BEVERLOO) ---------- */
  var rhoB=rho*1000, kBev=1.5, dm=d50/1000;
  var Lslot=Math.max(C,D), Wslot=Math.min(C,D);
  var Wbev=1.03*rhoB*Math.sqrt(g)*Lslot*Math.pow(Math.max(Wslot-kBev*dm,0.001),1.5);  // kg/s
  var Qbev=Wbev*3.6;                                   // t/h
  var folgaQ=(Q>0)?(Qbev/Q):0;

  /* ---------- ETAPA 4 — PRESSÕES (EN 1991-4) ---------- */
  var Rh=A1/(2*(A+B)), dcar=4*Rh;
  var hcDc=Hc/dcar;
  var clsEsb=(hcDc>=2)?"esbelto":(hcDc>1)?"intermediário":(hcDc>0.4)?"baixo (squat)":"de retenção (moega)";
  var Ch=(hcDc>=2)?1.15:(hcDc>1?1.10:1.00), Cw=(hcDc>=2)?1.10:(hcDc>1?1.08:1.00);
  var aK=1.15, aMu=1.15;
  var Km=1.1*(1-Math.sin(pr)), MUm=Math.tan(phw*Math.PI/180);
  var Ku=aK*Km, Kl=Km/aK, MUu=aMu*MUm, MUl=MUm/aMu;
  var q0=gamma*Hsob;                                   // sobrecarga do montículo sobre a boca
  function jans(K,MU,zz){
    var pvA=gamma*Rh/(MU*K);
    var ex=Math.exp(-MU*K*zz/Rh);
    var pvz=pvA*(1-ex)+q0*ex;
    return {pv:pvz,ph:K*pvz,pw:MU*K*pvz,pvA:pvA};
  }
  var LC1=jans(Ku,MUl,Hc), LC2=jans(Ku,MUu,Hc), LC3=jans(Kl,MUl,Hc);
  var ph=LC1.ph, pwat=LC2.pw, pv=LC3.pv;
  var phD=Ch*ph, pwD=Cw*pwat, pvD=Ch*pv;
  /* patch load — carga localizada */
  var ecc=num("mgEcc"); if(!isFinite(ecc)||ecc<0)ecc=0;
  var AAC=selv("mgAAC","2");
  var Cop=(AAC==="1")?0:(0.42+1.0*ecc/dcar);
  var pPatch=Cop*phD, phTot=phD+pPatch;
  /* ---- TREMONHA — EN 1991-4 §6.3 (caso de enchimento) ----
     β é o meio-ângulo da parede medido da VERTICAL. Em tremonha rasa o atrito de parede
     NÃO se mobiliza por completo, e o valor efetivo é o menor entre o atrito disponível e
     o que o equilíbrio permite mobilizar:
         μ_heff = min( tan φw , (1 − K)/(2·tan β) )          (6.26)
         b = 0,2   ·   Ff = 1 − b/(1 + tan β/μ_heff)         (6.27)
         n = S·(Ff·μ_heff·cot β + Ff) − 2                    (6.8)   S = 2 piramidal · 1 cunha
         pv(x) = (γ·hh/(n−1))·[(x/hh) − (x/hh)^n] + pvft·(x/hh)^n
         pnf(x) = Ff·pv(x)      ptf(x) = μ_heff·Ff·pv(x)     (6.29) (6.30)
     x é medido a partir do VÉRTICE VIRTUAL da pirâmide, que fica abaixo da boca. */
  var muW=Math.tan(phw*Math.PI/180);
  function hopperEN(t,dimTopo){
    var bRl=Math.atan(t/H);                                  // β da face, da vertical
    var muHe=Math.min(muW,(1-Km)/(2*Math.max(Math.tan(bRl),0.01)));
    var Ffl=1-0.2/(1+Math.tan(bRl)/Math.max(muHe,0.01));
    var Sf=cunha?1:2;
    var nl=Sf*(Ffl*muHe/Math.max(Math.tan(bRl),0.01)+Ffl)-2;
    var hh=(t>0.001)?(H*(dimTopo/2)/t):(H*50);               // vértice → transição
    var x0=Math.max(hh-H,0.001);                             // vértice → boca
    var pvMax=0,pvT=0;
    for(var q=0;q<=20;q++){
      var x=x0+(hh-x0)*q/20, r=x/hh, pvx;
      if(Math.abs(nl-1)<0.02){ pvx=gamma*hh*r*Math.log(1/Math.max(r,1e-6))+pvD*r; }
      else { pvx=(gamma*hh/(nl-1))*(r-Math.pow(r,nl))+pvD*Math.pow(r,nl); }
      if(pvx>pvMax)pvMax=pvx;
      if(q===20)pvT=pvx;
    }
    return {beta:bRl*180/Math.PI,muHe:muHe,Ff:Ffl,n:nl,hh:hh,x0:x0,
            pvMax:pvMax,pvT:pvT,pn:Ffl*pvMax,pt:muHe*Ffl*pvMax};
  }
  var hopA=cunha?null:hopperEN(tA,A), hopB=hopperEN(tB,B);
  var hopGov=(hopA&&hopA.pn>=hopB.pn)?hopA:hopB;
  var hopGovNome=(!hopA)?"faces inclinadas (convergência só na direção B)":((hopA.pn>=hopB.pn)?"faces perpendiculares a A":"faces perpendiculares a B");
  var Ff=hopGov.Ff, muH=hopGov.muHe, nEN=hopGov.n;
  var pnF=hopGov.pn, ptF=hopGov.pt;
  /* PRESSÃO DE SWITCH: no início da descarga o estado de tensões passa de ativo para
     passivo e uma frente de pressão percorre a transição. Adota-se a amplificação clássica
     de Jenike, ps = 2·pn,enchimento, aplicada numa faixa de 0,2·dc abaixo da transição —
     é ela que dimensiona a chapa e o anel de transição. */
  var pSwitch=2*pnF, hSwitch=0.2*dcar;
  var pnDes=pnF;

  /* ---------- ETAPA 5 — CHAPA ---------- */
  var sadm=0.90*fy, nu=0.3, Eaco_MPa=200000, RHOACO=7850;
  var COM=[6.3,8.0,9.5,12.5,16.0,19.0,22.4,25.0,31.5], tmin=6.0;
  function chapaPara(pkPa,vao){
    var Md=(pkPa*gf*1000)*vao*vao/10;
    var tR=Math.sqrt(6*Md/(sadm*1e6))*1000;
    var pS=pkPa*1000;
    var Dreq=pS*Math.pow(vao,4)*limFl/(384*vao);
    var tFl=Math.pow(12*(1-nu*nu)*Dreq/(Eaco_MPa*1e6),1/3)*1000;
    var req=Math.max(tR+abr,tFl+abr,tmin), com=COM[COM.length-1];
    for(var i=0;i<COM.length;i++){ if(COM[i]>=req){ com=COM[i]; break; } }
    return {tcalc:tR,tfl:tFl,tcom:com,govMin:(Math.max(tR,tFl)+abr<tmin),govFl:(tFl>tR)};
  }
  /* espaçamento de enrijecedores: otimizado por massa (chapa + enrijecedor) */
  var sIn=num("mgS"); var sUser=(isFinite(sIn)&&sIn>0)?sIn:0;
  function custoS(sv){
    var ch=chapaPara(Math.max(pSwitch,phTot),sv);
    var mCh=ch.tcom/1000*RHOACO;
    var w=Math.max(pSwitch,phTot)*gf*sv, Mm=w*Math.min(sv,Math.max(A,B)/2)*Math.min(sv,Math.max(A,B)/2)/10;
    var Wr=Mm/(sadm*1000)*1e6, Ae=Math.max(8,Math.pow(Wr,0.75));
    var mEn=(Ae*1e-4*RHOACO)/sv;
    return {s:sv,ch:ch,custo:mCh+mEn+12/sv,Wreq:Wr};
  }
  var sOpt=null;
  for(var sv=0.5;sv<=2.01;sv+=0.1){ var rr=custoS(Math.round(sv*10)/10); if(!sOpt||rr.custo<sOpt.custo)sOpt=rr; }
  var CS=(sUser>0)?custoS(sUser):sOpt;
  var sst=CS.s;
  var chColar=chapaPara(phTot,Math.min(sst,Math.min(A,B)));
  var chFace=chapaPara(pnDes,Math.min(sst,Math.min(slA,slB)));
  var chSwitch=chapaPara(pSwitch,Math.min(sst,Math.max(A,B)/2));
  /* tração meridional na face inclinada */
  var Fvert=pvD*A1+Vtronco*gamma;                      // kN — carga vertical total sobre a tremonha
  var senAV=Math.sin(aVrad);
  var Umer=cunha?(2*A):((perim+perimB)/2);            // largura que resiste à tração
  var nMer=(senAV>0)?Fvert/(Umer*senAV):0;            // kN/m
  var tTrac=nMer*gf/sadm;                              // mm
  var treq=Math.max(tTrac+abr,chFace.tcom,chSwitch.tcom,tmin);
  var tcom=COM[COM.length-1]; for(var ti=0;ti<COM.length;ti++){ if(COM[ti]>=treq){ tcom=COM[ti]; break; } }

  /* ---------- ETAPA 6 — GRELHA DE PROTEÇÃO ---------- */
  var grOn=(selv("mgGrelha","sim")==="sim");

  var nBarras=Math.max(2,Math.round(Math.max(A,B)/(grMalha/1000)));
  var phiImp=2.0;                                              // amplificação dinâmica na queda
  var Pgd=grP*phiImp*gf;                                       // kN — carga de projeto por barra

  var selGr=selPerfil({W:Wgr},"");

  /* ---------- ETAPA 7 — CARGAS DE EQUIPAMENTO MÓVEL ---------- */
  var mCarga=(Vcarga>0)?(Vcarga*rho*1000):0;                   // kg por ciclo

  var Proda=Peq*g*0.35;                                        // kN — carga por roda (eixo dianteiro carregado / 2)
  var Fdef=0.10*Peq*g;                                         // kN — choque na defensa (10% do peso operacional)
  var Mdef=Fdef*1.0;                                           // kN·m — a 1,0 m do apoio
  var qTraf=Math.max(20,Proda/2);                              // kPa — sobrecarga na plataforma

  /* ---------- ETAPA 8 — VENTO E SISMO ---------- */
  var Htot=Hc+H, Ztopo=Htot+Hleg;
  var V0=num("mgV0"); if(!isFinite(V0)||V0<=0)V0=35;
  var S1w=selvN("mgS1",1.0), S3w=selvN("mgS3",1.0);
  var CATP={I:{A:[1.10,0.06],B:[1.11,0.065],C:[1.12,0.07]},
            II:{A:[1.00,0.085],B:[1.00,0.09],C:[0.98,0.10]},
            III:{A:[0.94,0.10],B:[0.94,0.105],C:[0.93,0.115]},

            V:{A:[0.74,0.15],B:[0.73,0.16],C:[0.71,0.175]}};
  var FR={A:1.00,B:0.98,C:0.95};

  var pw2=(CATP[catW]||CATP.II)[clsW]||CATP.II.B;
  var S2w=pw2[0]*FR[clsW]*Math.pow(Math.max(Ztopo,5)/10,pw2[1]);
  var Vk=V0*S1w*S2w*S3w, qvento=0.613*Vk*Vk/1000;
  var Ca=num("mgCa"); if(!isFinite(Ca)||Ca<=0)Ca=1.4;
  var Aproj=Math.max(A,B)*(Htot+Hleg*0.35);

  var Ncol=selvN("mgNcol",4);

    return (l0<=1.5)?Math.pow(0.658,l0*l0):(0.877/(l0*l0)); }
  var Qmov=movel?(Fimp+qTraf*0.5*A1/10):0;              // kN — parcela variável do equipamento móvel

  for(var it=0;it<8;it++){ imn=0.4*Math.sqrt(Acol); lamC=Kbuc*(Hleg*100)/Math.max(imn,0.1);

  var iReq=Kbuc*(Hleg*100)/lamMax;
  /* vigas de apoio: 2 vigas paralelas ao lado maior, vão entre montantes */
  var vaoViga=Math.max(A,B);

  var fck=num("mgFck"); if(!isFinite(fck)||fck<=0)fck=30;

  if(!isFinite(tBP)||tBP<16)tBP=16;
  var tBPcom=[16,19,22.4,25,31.5,38,50,63,75].find(function(x){return x>=tBP;})||75;
  var Ntrac=Math.max(0,Nup);

  var DIACH=[16,20,22,25,32,38,45,50];

  var diaCh=DIACH[DIACH.length-1];
  for(var d2=0;d2<DIACH.length;d2++){ if(AsEf(DIACH[d2])>=Math.max(AsCh,1.0)){ diaCh=DIACH[d2]; break; } }

  /* ---------- ETAPA 12 — FADIGA E REVESTIMENTO ---------- */
  var ciclos=(Q>0&&Vcarga>0)?(Q*1000/(Vcarga*rho*1000)*24*300):0;   // ciclos de carga por ano

  var dSD=dSc*Math.pow(0.4,1/3), dSL=dSD*Math.pow(0.05,0.2);
  var dSigma=(pSwitch-pnF)*gf*Math.max(sst,0.5)/(tcom/1000)/1000;    // MPa — variação na parede
  var fadOK=(dSigma<=dSL);
  var revUHMW=(alfaExig-alfaVale)>0.5;

  /* ================= RESULTADOS ================= */

   Roteiro conforme API STD 521 (Pressure-relieving and Depressuring Systems) e API STD 537
   (Flare Details), com vento pela ABNT NBR 6123 e sismo pela ABNT NBR 15421.

   Princípio que organiza tudo: a tocha NÃO é dimensionada pela vazão normal, e sim pela PIOR
   CONTINGÊNCIA DE ALÍVIO. Dessa vazão saem, em cadeia:
     · o diâmetro da ponta — por número de Mach E por contrapressão admissível na PSV;
     · a altura da torre — por radiação térmica admissível ao nível do solo;
     · o vaso separador — por sedimentação de gota;
     · a estrutura — por vento, vórtices e sismo.
   Quem costuma governar de fato o diâmetro é a CONTRAPRESSÃO, não o Mach.                     */

function flexowellCalc(){
  var g=9.80665;
  /* ---------- ENTRADAS ---------- */
  var Q=num("Qf"), rho=num("rhof"), Lh1=num("Lh1f"), Li=num("Lif"), theta=num("thetaf"),
      Lh2=num("Lh2f"), v=num("vf"), lump=num("lumpf"), Dt=num("Dtf");
  if(!isFinite(Q)||Q<=0)Q=300; if(!isFinite(rho)||rho<=0)rho=1.6;
  if(!isFinite(Lh1)||Lh1<0)Lh1=8; if(!isFinite(Li)||Li<=0)Li=30;
  if(!isFinite(theta)||theta<0||theta>90)theta=55; if(!isFinite(Lh2)||Lh2<0)Lh2=5;
  if(!isFinite(v)||v<=0)v=1.5; if(!isFinite(lump)||lump<=0)lump=80;
  if(!isFinite(Dt)||Dt<=0)Dt=0;
  var B=selvN("Bf",1000), phi=num("phif"); if(!isFinite(phi)||phi<=0||phi>1)phi=0.80;
  var K=selvN("Kf",0.38), FS=selvN("fsf",10);
  var fISO=selvN("fxF",0.022), eta=selvN("fxEta",0.85);
  var passoIn=num("fxPasso"); var qBin=num("fxQb");
  var tr=theta*Math.PI/180;

  /* ---------- ETAPA 1 — GEOMETRIA ---------- */
  var H=Li*Math.sin(tr);
  var Lproj=Lh1+Lh2+Li*Math.cos(tr);            // projeção horizontal
  var Ltot=Lh1+Li+Lh2;                          // comprimento desenvolvido
  var cosd=Lproj/Math.max(Ltot,0.01);           // cos δ médio ponderado
  var Qv=Q/rho;

  /* ---------- ETAPA 2 — VELOCIDADE ADMISSÍVEL POR ÂNGULO ----------
     Em alto ângulo a velocidade é limitada: acima do limite o material rola de volta
     dentro do bolsão e a capacidade real cai, com desgaste de travessa. */
  var vmax;
  if(theta<=30) vmax=4.0;
  else if(theta<=60) vmax=4.0-(theta-30)*(4.0-2.5)/30;
  else vmax=2.5-(theta-60)*(2.5-1.6)/30;
  if(lump>100) vmax*=0.85;                      // bloco grande reduz o limite
  var vmin=0.5;
  var vOK=(v<=vmax+0.02)&&(v>=vmin);

  /* ---------- ETAPA 3 — PAREDE ONDULADA E CAPACIDADE ----------
     mw = massa das DUAS paredes por metro. Valores de ordem de grandeza do catálogo. */
  var SW=[{tp:"L",h:40,bw:30,dv:35,mw:4.0},
          {tp:"N",h:60,bw:50,dv:42,mw:6.6},{tp:"N",h:80,bw:50,dv:42,mw:8.8},
          {tp:"N",h:100,bw:50,dv:42,mw:11.0},{tp:"N",h:120,bw:50,dv:42,mw:13.2},
          {tp:"S",h:120,bw:70,dv:60,mw:15.6},{tp:"S",h:160,bw:70,dv:60,mw:20.8},
          {tp:"S",h:200,bw:70,dv:60,mw:26.0},{tp:"S",h:240,bw:70,dv:60,mw:31.2},
          {tp:"S",h:280,bw:70,dv:60,mw:36.4},
          {tp:"ES",h:300,bw:95,dv:80,mw:45.0},{tp:"ES",h:400,bw:95,dv:80,mw:60.0},
          {tp:"ES",h:500,bw:95,dv:80,mw:75.0},{tp:"ES",h:630,bw:95,dv:80,mw:94.5}];
  /* redução prática de enchimento por faixa de ângulo (estimativa conservadora) */
  var kTeta=(theta<=45)?1.00:((theta<=70)?0.95:0.90);
  var phiEf=phi*kTeta;
  var swSel=selv("swf","auto"), sw=null, selCap=0, bu=0, insuf=false;
  function capDe(s){ var b=B-2*s.bw; return (b>0)?(3.6*b*s.h/1000*v*phiEf):0; }
  if(swSel!=="auto"){
    var pp=swSel.split(":"), stp=pp[0], sh=parseFloat(pp[1]);
    for(var i=0;i<SW.length;i++){ if(SW[i].tp===stp&&SW[i].h===sh){ sw=SW[i]; break; } }
    if(sw){ bu=B-2*sw.bw; selCap=capDe(sw); insuf=(selCap<Qv); }
  }
  if(!sw){
    for(var i2=0;i2<SW.length;i2++){ var b2=B-2*SW[i2].bw; if(b2<=0)continue;
      if(capDe(SW[i2])>=Qv){ sw=SW[i2]; bu=b2; selCap=capDe(sw); break; } }
    if(!sw){ sw=SW[SW.length-1]; bu=B-2*sw.bw; selCap=capDe(sw); insuf=true; }
  }
  var folgaCap=(Qv>0)?selCap/Qv:0;

  /* ---------- ETAPA 4 — TRAVESSAS ---------- */
  var CL=[20,35,40,55,60,75,90,100,110,120,140,160,180,200,220,240,280,300,400,500,600];
  var cleat=CL[CL.length-1]; for(var c=0;c<CL.length;c++){ if(CL[c]>=sw.h){ cleat=CL[c]; break; } }
  var PASSOS=[100,125,150,200,250,300,400,500,630];
  var passoMin=Math.max(1.5*lump,0.9*sw.h);
  var passo;
  if(isFinite(passoIn)&&passoIn>0){ passo=passoIn; }
  else { passo=PASSOS[PASSOS.length-1]; for(var pz=0;pz<PASSOS.length;pz++){ if(PASSOS[pz]>=passoMin){ passo=PASSOS[pz]; break; } } }
  var passoOK=(passo>=passoMin-1);
  var lumpOK=(lump<=400)&&(lump<=bu*0.9)&&(lump<=sw.h*0.9);

  /* ---------- ETAPA 5 — MASSA DA CORREIA POR COMPOSIÇÃO ----------
     Três parcelas: carcaça com coberturas, as duas paredes onduladas e as travessas.
     A carcaça depende da tração requerida, que por sua vez depende da massa — resolve-se
     por iteração curta. */
  var tCl=Math.max(15,Math.min(30,0.10*cleat));   // espessura da travessa (mm)
  var mCleat=1150*(cleat/1000)*(tCl/1000)*(bu/1000)*(1000/passo);   // kg/m
  var qRO=Math.max(8,Math.round(0.018*B)), qRU=Math.round(qRO*0.5);
  var qG=Q/(3.6*v);
  var carcReq=0, carcass="", EPsel=0, STsel=0, textil=true, qB=0, mCarc=0;
  var Fp=0,Fst=0,Fac=0,Fgu=0,Flim=0,Fsec=0,Fu=0,Peff=0,Te=0,T1=0,T2=0,trN=0,Cf=1;
  for(var it=0;it<10;it++){
    mCarc=(B/1000)*(10+0.012*Math.max(carcReq,200));
    qB=(isFinite(qBin)&&qBin>0)?qBin:(mCarc+sw.mw+mCleat);
    /* ISO 5048 / DIN 22101 */
    Cf=(Ltot<40)?1.45:((Ltot<80)?1.30:((Ltot<150)?1.17:1.09));
    Fp=fISO*Ltot*g*(qRO+qRU+(2*qB+qG)*cosd);
    Fst=qG*g*H;
    Fac=qG*v*v/1;                                  // aceleração do material no carregamento
    var Lgu=Math.max(1,Math.min(Lh1,3));           // comprimento de guia no carregamento
    Fgu=160*Lgu;                                   // atrito do material contra as guias
    Flim=1500*(B/1000)*2;                          // dois limpadores
    Fsec=Fac+Fgu+Flim;
    Fu=Cf*Fp+Fsec+Fst;
    Peff=Fu*v/eta/1000;
    Te=Fu;
    T1=Te*(1+K); T2=T1-Te;
    trN=T1/B;
    var novo=trN*FS;
    if(Math.abs(novo-carcReq)<1) { carcReq=novo; break; }
    carcReq=novo;
  }
  if(carcReq<=1000){ var EP=[200,250,315,400,500,630,800,1000];
    EPsel=EP.find(function(x){return x>=carcReq;})||1000; textil=true;
    carcass="Têxtil EP "+EPsel+" N/mm"; }
  else{ var ST=[1000,1250,1600,2000,2500,3150,4000,5000,6300,8600];
    STsel=ST.find(function(x){return x>=carcReq;})||8600; textil=false;
    carcass="Cabo de aço ST "+STsel+" N/mm"; }
  var Pmaj=Peff*1.20;

  /* ---------- ETAPA 6 — TAMBOR MÍNIMO ----------
     Dois critérios simultâneos: a carcaça (como em correia lisa) e a ALTURA DA PAREDE
     ONDULADA, que é o critério próprio do Flexowell e quase sempre o governante. */
  var DminCarc=textil?Math.max(400,Math.ceil(EPsel*0.9/50)*50):Math.max(630,Math.ceil(STsel*0.4/50)*50);
  /* A parede ondulada acordeona ao contornar o tambor — é justamente a função da onda.
     Por isso o mínimo cresce de forma modesta com a altura, e não proporcionalmente a ela:
     regra prática de 2,5 × h, que reproduz a ordem de grandeza das tabelas de catálogo
     (N100 → carcaça governa · S200 → 500 mm · ES630 → 1600 mm). */
  var DminPar=Math.max(400,Math.ceil(2.5*sw.h/50)*50);
  var Dmin=Math.max(DminCarc,DminPar);
  var govD=(DminPar>=DminCarc)?"altura da parede ondulada (2,5 × h)":"classe da carcaça";
  var DtUso=(Dt>0)?Dt:Dmin;
  var DtOK=(DtUso>=Dmin-1);

  /* ---------- ETAPA 7 — CONTRA-RECUO (BACKSTOP) ----------
     Se a componente gravitacional do material superar o atrito, o transportador desce
     carregado ao perder o acionamento. É item de SEGURANÇA, não opcional. */
  var Fatr=Cf*Fp;
  var precisaBS=(Fst>Fatr);
  var Fbs=Math.max(Fst-Fatr,0);
  var kBS=1.30;
  var Tbs=kBS*Fbs*(DtUso/2000);                    // N·m no eixo do tambor
  var npul=v*60000/(Math.PI*DtUso);
  var sew=selSEW(Pmaj,npul);

  /* ---------- ETAPA 8 — FLECHA E ESPAÇAMENTO DE ROLETES ---------- */
  var sagRel=selvN("fxSag",0.015);
  var aMax=Math.sqrt(8*Math.max(T2,1)*sagRel/(g*(qB+qG)));
  var aAdot=Math.min(Math.floor(aMax*10)/10,1.5);
  var T2min=g*(qB+qG)*Math.pow(aAdot,2)/(8*sagRel);
  var sagOK=(T2>=T2min-1);

  /* ---------- ETAPA 9 — RAIOS MÍNIMOS DE CURVA ----------
     Côncava (vale): a correia tende a levantar — R ≥ T/(qB·g).
     Convexa (crista): a parede ondulada comprime — regra prática de 30 × h. */
  var Rlift=Math.max(T1,1)/(qB*g);                 // raio para a correia NAO levantar, sem retencao
  var RconcPar=Math.ceil(20*sw.h/1000*10)/10;      // limite da parede ondulada
  var Rconv=Math.ceil(30*sw.h/1000*10)/10;
  var RconcAd=Math.max(RconcPar,6);                // raio praticavel no arranjo
  var precisaRet=(RconcAd<Rlift);                  // exige roletes de retencao
  var Fret=precisaRet?Math.max((T1-qB*g*RconcAd)*tr,0)/1000:0;   // kN no arco da curva
  var nRet=precisaRet?Math.max(3,Math.ceil(RconcAd*tr/0.6)):0;
  var Fret1=nRet>0?Fret/nRet:0;

  /* ---------- ETAPA 10 — PESOS E CARGAS ---------- */
  var mCorreia=qB*2*Ltot;                          // ida e volta
  var mMatOp=qG*Ltot;
  var nRol=Math.max(4,Math.ceil(Ltot/Math.max(aAdot,0.5)));
  var mRoletes=nRol*(qRO*0.6);
  var mEstrut=Ltot*(28+0.030*B);                   // treliça, chapas, guias
  var mAcion=sew.mot.kw*9+240;                     // motor + redutor + base
  var mTambores=2*(0.55*Math.PI*(DtUso/1000)*(B/1000)*7850*0.012+45);
  var mVazio=mCorreia+mRoletes+mEstrut+mTambores+mAcion;
  var mOper=mVazio+mMatOp;
  /* distribuídas por metro, por trecho */
  var qVazioD=(mVazio-mAcion)/Ltot*g/1000;         // kN/m
  var qOperD=qVazioD+qG*g/1000;
  /* pontuais nas extremidades */
  var Pcab=(mAcion+mTambores/2)*g/1000+ (T1+T2)/1000*0.5;   // cabeça (acionamento)
  var Pcau=(mTambores/2+120)*g/1000+ (T2*2)/1000*0.5;       // cauda (esticador)
  /* horizontais */
  var Hacion=(T1-T2)/1000;                         // reação do acionamento
  var Hestic=2*T2/1000;                            // esticador por gravidade
  var Hancor=Math.max(Hacion,Hestic);

  /* ================= RESULTADOS ================= */
  var OUT=[
    {sec:"Etapa 1 — Geometria"},
    {k:"Ângulo de inclinação do trecho",v:theta.toFixed(0)+"°"+(theta>90?"  ⚠":"")},
    {k:"ELEVAÇÃO TOTAL  H = L_incl · senθ",v:H.toFixed(2).replace(".",",")+" m",hi:true},
    {k:"Projeção horizontal  ·  comprimento desenvolvido",v:Lproj.toFixed(1).replace(".",",")+" m   ·   "+Ltot.toFixed(1).replace(".",",")+" m"},
    {k:"cos δ médio  (projeção / desenvolvido)",v:cosd.toFixed(3).replace(".",",")},
    {k:"Capacidade volumétrica requerida",v:Qv.toFixed(1).replace(".",",")+" m³/h"},

    {sec:"Etapa 2 — Velocidade admissível pelo ângulo"},
    {k:"Por que limitar",v:"Em alto ângulo, acima de certa velocidade o material rola de volta dentro do bolsão: a capacidade real cai abaixo da calculada e a travessa sofre desgaste acelerado. O limite é função do ângulo e do tamanho do bloco.",hi:true},
    {k:"Velocidade máxima recomendada",v:vmax.toFixed(2).replace(".",",")+" m/s"+(lump>100?"   (já com redução de 15 % por bloco acima de 100 mm)":"")},
    {k:"Velocidade adotada",v:v.toFixed(2).replace(".",",")+" m/s"+(vOK?"   ✓ dentro do limite":(v>vmax?"   ⚠ ACIMA do limite — reduzir a velocidade e compensar com parede mais alta ou correia mais larga":"   ⚠ abaixo do mínimo prático de 0,5 m/s")),hi:!vOK},

    {sec:"Etapa 3 — Parede ondulada e capacidade"},
    {k:"Largura da correia base  ·  largura útil entre paredes",v:fmt(B)+" mm   ·   "+fmt(Math.round(bu))+" mm"},
    {k:"PAREDE ONDULADA",v:"Tipo "+sw.tp+" · altura "+sw.h+" mm   (base "+sw.bw+" mm · passo da onda "+sw.dv+" mm · "+sw.mw.toFixed(1).replace(".",",")+" kg/m as duas)",hi:true},
    {k:"Fator de enchimento  ·  redução por ângulo",v:phi.toFixed(2).replace(".",",")+"  ×  "+kTeta.toFixed(2).replace(".",",")+"  =  "+phiEf.toFixed(3).replace(".",",")+"   —  a redução por ângulo é estimativa conservadora; confirmar na curva de capacidade do fabricante"},
    {k:"CAPACIDADE DA CONFIGURAÇÃO  3,6 · bu · h · v · φef",v:fmt(Math.round(selCap))+" m³/h   =   "+fmt(Math.round(selCap*rho))+" t/h"+(insuf?"   ⚠ INSUFICIENTE":"   ✓ folga de "+folgaCap.toFixed(2).replace(".",",")+" ×"),hi:true},

    {sec:"Etapa 4 — Travessas"},
    {k:"TRAVESSA",v:"T-"+cleat+" mm   ·   passo "+passo+" mm"+(passoOK?"":"   ⚠ abaixo do mínimo de "+Math.round(passoMin)+" mm"),hi:true},
    {k:"Passo mínimo  max(1,5 · bloco ; 0,9 · h_parede)",v:Math.round(passoMin)+" mm"},
    {k:"Maior bloco do material",v:lump.toFixed(0)+" mm"+(lumpOK?"   ✓ cabe no bolsão":"   ⚠ "+(lump>400?"acima de 400 mm, limite do catálogo":"grande para a largura útil ou para a altura da parede"))},

    {sec:"Etapa 5 — Massa da correia por composição"},
    {k:"Por que importa",v:"A correia Flexowell é carcaça mais duas paredes onduladas mais travessas. Adotar um valor único de massa erra nas duas pontas: subestima em correia larga com parede alta e superestima em correia pequena. A massa entra na resistência principal e na flecha.",hi:true},
    {k:"Carcaça com coberturas",v:mCarc.toFixed(1).replace(".",",")+" kg/m"},
    {k:"Paredes onduladas (as duas)",v:sw.mw.toFixed(1).replace(".",",")+" kg/m"},
    {k:"Travessas  (T-"+cleat+" · esp. "+tCl.toFixed(0)+" mm · passo "+passo+" mm)",v:mCleat.toFixed(1).replace(".",",")+" kg/m"},
    {k:"MASSA DA CORREIA  qB",v:qB.toFixed(1).replace(".",",")+" kg/m"+((isFinite(qBin)&&qBin>0)?"   (informada pelo usuário)":"   (estimada — confirmar na folha de dados do fabricante)"),hi:true},
    {k:"Massa de material por metro  qG = Q/(3,6·v)",v:qG.toFixed(1).replace(".",",")+" kg/m"},
    {k:"Roletes de carga  ·  de retorno",v:qRO+" · "+qRU+" kg/m"},

    {sec:"Etapa 6 — Potência (ISO 5048 / DIN 22101)"},
    {k:"Coeficiente de atrito fictício  f",v:fISO.toFixed(3).replace(".",",")+"   —  a norma situa f entre 0,020 e 0,024 para instalação em bom estado; 0,030 para condições desfavoráveis",hi:true},
    {k:"Coeficiente de comprimento  C  (L = "+Ltot.toFixed(0)+" m)",v:Cf.toFixed(2).replace(".",",")+"   —  quanto mais curto o transportador, maior o peso relativo das resistências secundárias"},
    {k:"Resistência principal  Fp = f·L·g·[qRO+qRU+(2qB+qG)·cosδ]",v:fmt(Math.round(Fp))+" N"},
    {k:"RESISTÊNCIA DE ELEVAÇÃO  Fst = qG·g·H",v:fmt(Math.round(Fst))+" N   —  em alto ângulo é ela que domina, e deve ser bem maior que a de rolamento",hi:true},
    {k:"Secundárias: aceleração · guias · limpadores",v:fmt(Math.round(Fac))+" · "+fmt(Math.round(Fgu))+" · "+fmt(Math.round(Flim))+" = "+fmt(Math.round(Fsec))+" N"},
    {k:"Força tangencial total  Fu = C·Fp + Fsec + Fst",v:fmt(Math.round(Fu))+" N"},
    {k:"POTÊNCIA EFETIVA  P = Fu·v/η",v:Peff.toFixed(2).replace(".",",")+" kW   =   "+(Peff/0.7457).toFixed(1).replace(".",",")+" HP   (η = "+eta.toFixed(2).replace(".",",")+")",hi:true},
    {k:"Potência de seleção (+20 %)",v:Pmaj.toFixed(2).replace(".",",")+" kW",hi:true},
    {k:"Aferição física",v:"elevar "+Q.toFixed(0)+" t/h a "+H.toFixed(2).replace(".",",")+" m exige "+((Q*1000/3600)*g*H/1000).toFixed(1).replace(".",",")+" kW só de elevação — a potência acima deve ficar acima disso, com margem para atrito e secundárias"},

    {sec:"Etapa 7 — Tensões, carcaça e tambores"},
    {k:"Tensões  T1 = Te·(1+K)  ·  T2 = T1 − Te",v:fmt(Math.round(T1))+" N   ·   "+fmt(Math.round(T2))+" N   (K = "+K.toFixed(2).replace(".",",")+")"},
    {k:"Tração de trabalho por largura",v:trN.toFixed(1).replace(".",",")+" N/mm   ×  FS "+FS.toFixed(0)+"  =  "+carcReq.toFixed(0)+" N/mm"},
    {k:"CARCAÇA DA CORREIA",v:carcass,hi:true},
    {k:"Tambor mínimo — pela carcaça  ·  pela parede (2,5·h)",v:DminCarc+" mm   ·   "+DminPar+" mm"},
    {k:"DIÂMETRO MÍNIMO DO TAMBOR",v:Dmin+" mm   —  governa: "+govD,hi:true},
    {k:"Tambor adotado",v:DtUso.toFixed(0)+" mm"+((Dt>0)?"   (informado)":"   (adotado o mínimo)")+(DtOK?"   ✓":"   ⚠ ABAIXO DO MÍNIMO — a parede ondulada trabalha comprimida além do limite e trinca na raiz da onda"),hi:!DtOK},
    {k:"Rotação do tambor",v:npul.toFixed(1).replace(".",",")+" rpm"},

    {sec:"Etapa 8 — CONTRA-RECUO (backstop)"},
    {k:"Por que é obrigatório",v:"Transportador de alto ângulo carregado desce ao perder o acionamento: a correia acelera ao contrário, o material despeja na cauda e o equipamento se destrói. O contra-recuo é item de segurança, não acessório.",hi:true},
    {k:"Força gravitacional × resistência ao rolamento",v:fmt(Math.round(Fst))+" N   vs   "+fmt(Math.round(Fatr))+" N"},
    {k:"CONTRA-RECUO NECESSÁRIO?",v:(precisaBS?"SIM — a gravidade supera o atrito em "+fmt(Math.round(Fbs))+" N. Prever contra-recuo no acionamento (ou freio com comando de falta de energia).":"Não pelo critério de gravidade; ainda assim, avaliar por segurança operacional se houver pessoas na região da cauda."),hi:precisaBS},
    {k:"TORQUE DE RETENÇÃO no eixo do tambor  (FS 1,3)",v:(precisaBS?(fmt(Math.round(Tbs))+" N·m   —  se o contra-recuo for montado na entrada do redutor, dividir pela relação i ≈ "+sew.i.toFixed(1).replace(".",",")+" : 1, resultando "+fmt(Math.round(Tbs/Math.max(sew.i,1)))+" N·m"):"não aplicável"),hi:precisaBS},

    {sec:"Etapa 9 — Flecha, roletes e raios de curva"},
    {k:"Flecha relativa admitida",v:(sagRel*100).toFixed(1).replace(".",",")+" % do vão"},
    {k:"Espaçamento máximo de roletes  a = √(8·T2·f/(g·(qB+qG)))",v:aMax.toFixed(2).replace(".",",")+" m   →   ADOTAR "+aAdot.toFixed(1).replace(".",",")+" m",hi:true},
    {k:"Tensão mínima para conter a flecha",v:fmt(Math.round(T2min))+" N   vs   T2 = "+fmt(Math.round(T2))+" N"+(sagOK?"   ✓":"   ⚠ aumentar o pré-tensionamento ou reduzir o espaçamento")},
    {k:"Curva CÔNCAVA — raio de não levantamento  R ≥ T1/(qB·g)",v:Rlift.toFixed(1).replace(".",",")+" m   —  é o raio que a correia exigiria para não descolar dos roletes por conta própria. Em transportador de alto ângulo esse valor quase sempre supera o comprimento disponível: a correia é leve e a tração é alta.",hi:true},
    {k:"Raio côncavo adotado no arranjo",v:RconcAd.toFixed(1).replace(".",",")+" m   (limite da parede ondulada: 20·h = "+RconcPar.toFixed(1).replace(".",",")+" m)"},
    {k:"ROLETES DE RETENÇÃO na curva côncava",v:(precisaRet?
      ("OBRIGATÓRIOS — com raio de "+RconcAd.toFixed(1).replace(".",",")+" m a correia levanta. Força total de retenção no arco: "+kNkg(Fret)+", distribuída em "+nRet+" roletes de pressão ("+kNkg(Fret1,2)+" cada). Sem eles a correia descola, o material derrama na curva e a parede ondulada sofre flexão reversa.")
      :"não necessários — o raio adotado supera o de levantamento"),hi:precisaRet},
    {k:"RAIO MÍNIMO — curva CONVEXA (crista)",v:Rconv.toFixed(1).replace(".",",")+" m   (regra prática de 30 × altura da parede)   —  raio menor dobra a parede ondulada e trinca a raiz da onda; confirmar na tabela do fabricante",hi:true},

    {sec:"Etapa 10 — Acionamento SEW"},
    {k:"Momento no eixo  T = 9550·P/n",v:fmt(Math.round(sew.T))+" N·m"},
    {k:"Torque de seleção  (T · fB)",v:fmt(Math.round(sew.Tsel))+" N·m"},
    {k:"Relação de redução  i",v:"≈ "+sew.i.toFixed(1).replace(".",",")+" : 1"},
    {k:"Motor SEW (4 polos)",v:sew.mot.kw.toString().replace(".",",")+" kW · "+sew.mot.d,hi:true},
    {k:"MOTOREDUTOR SEW",v:sewDrive(sew,Pmaj),hi:true},

    {sec:"Etapa 11 — Pesos e cargas nos apoios"},
    {k:"Correia (ida e volta)  ·  roletes  ·  estrutura",v:fmt(Math.round(mCorreia))+" · "+fmt(Math.round(mRoletes))+" · "+fmt(Math.round(mEstrut))+" kg"},
    {k:"Tambores  ·  acionamento",v:fmt(Math.round(mTambores))+" · "+fmt(Math.round(mAcion))+" kg"},
    {k:"PESO VAZIO  ·  EM OPERAÇÃO",v:fmt(Math.round(mVazio))+" kg   ·   "+fmt(Math.round(mOper))+" kg   ("+kNkg(mOper*g/1000)+")",hi:true},
    {k:"CARGA DISTRIBUÍDA — vazio  ·  em operação",v:kNmkg(qVazioD)+"   ·   "+kNmkg(qOperD),hi:true},
    {k:"Material por metro (só o granel)",v:kNmkg(qG*g/1000)},
    {k:"CARGA PONTUAL na CABEÇA (acionamento + tambor + tensões)",v:kNkg(Pcab),hi:true},
    {k:"CARGA PONTUAL na CAUDA (tambor + esticador)",v:kNkg(Pcau),hi:true},
    {k:"CARGA HORIZONTAL do acionamento  H = T1 − T2",v:kNkg(Hacion),hi:true},
    {k:"CARGA HORIZONTAL do esticador  H = 2·T2",v:kNkg(Hestic),hi:true},
    {k:"ANCORAGEM LONGITUDINAL a considerar",v:kNkg(Hancor)+"   —  aplicada no nível do eixo dos tambores; a estrutura precisa transferi-la à fundação",hi:true},

    {sec:"Verificação global"},
    {k:"Capacidade",v:(insuf?"⚠ configuração insuficiente":"✓ folga de "+folgaCap.toFixed(2).replace(".",",")+" ×")+"   ·   "+(vOK?"✓ velocidade dentro do limite":"⚠ velocidade acima do limite do ângulo")+"   ·   "+(lumpOK?"✓ bloco cabe":"⚠ bloco grande"),hi:!(vOK&&lumpOK&&!insuf)},
    {k:"Correia e tambores",v:(DtOK?"✓ tambor atende ao mínimo":"⚠ tambor abaixo do mínimo")+"   ·   "+carcass+"   ·   "+(sagOK?"✓ flecha controlada":"⚠ flecha excessiva"),hi:!(DtOK&&sagOK)},
    {k:"Segurança",v:(precisaBS?"⚠ EXIGE CONTRA-RECUO de "+fmt(Math.round(Tbs))+" N·m no eixo do tambor":"contra-recuo não exigido pelo critério de gravidade")+"   ·   "+(precisaRet?"⚠ exige roletes de retenção na curva côncava ("+kNkg(Fret)+")":"curva côncava sem retenção"),hi:(precisaBS||precisaRet)},
    {k:"Observação de projeto",v:"⚠ PRÉ-DIMENSIONAMENTO. A massa da correia, a curva de capacidade por ângulo, os raios mínimos de curva e o diâmetro mínimo de tambor devem ser confirmados na folha de dados do fabricante — no Flexowell esses quatro itens são específicos da parede ondulada e não seguem as regras da correia lisa."}
  ];
  OUT.geo={tipo:"flexo",Q:Q,rho:rho,Lh1:Lh1,Li:Li,theta:theta,Lh2:Lh2,H:H,Lproj:Lproj,Ltot:Ltot,
    v:v,vmax:vmax,vOK:vOK,B:B,bu:bu,sw:sw.tp+" "+sw.h,swh:sw.h,cleat:cleat,passo:passo,
    Qv:Qv,selCap:selCap,folgaCap:folgaCap,insuf:insuf,phi:phi,kTeta:kTeta,phiEf:phiEf,
    qB:qB,qG:qG,mCarc:mCarc,mw:sw.mw,mCleat:mCleat,
    fISO:fISO,Cf:Cf,Fp:Fp,Fst:Fst,Fsec:Fsec,Fu:Fu,Peff:Peff,Pmaj:Pmaj,
    T1:T1,T2:T2,trN:trN,carcass:carcass,Dmin:Dmin,DtUso:DtUso,DtOK:DtOK,govD:govD,
    precisaBS:precisaBS,Tbs:Tbs,aAdot:aAdot,RconcAd:RconcAd,Rconv:Rconv,Rlift:Rlift,precisaRet:precisaRet,Fret:Fret,nRet:nRet,
    mVazio:mVazio,mOper:mOper,qVazioD:qVazioD,qOperD:qOperD,Pcab:Pcab,Pcau:Pcau,
    Hacion:Hacion,Hestic:Hestic,Hancor:Hancor,
    motor:sew.mot.kw,motord:sew.mot.d,sew:sewDrive(sew,Pmaj),npul:npul,lump:lump,lumpOK:lumpOK};
  return OUT;
}
